[package]
name = "omsi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer: textured, lit meshes with OMSI alpha modes; on-screen and off-screen targets"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-geometry = { path = "../omsi-geometry" }
omsi-texture = { path = "../omsi-texture" }
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
rayon.workspace = true
log.workspace = true
anyhow.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[dev-dependencies]
naga = { version = "29", features = ["spv-out"] }
