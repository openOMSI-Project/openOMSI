[package]
name = "omsi-launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher's data side: maps, buses, lines, profiles, settings, mod installs, running games"

[lib]
name = "omsi_launcher_lib"
path = "src/lib.rs"

[[bin]]
name = "openomsi-launcher"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow.workspace = true
rayon.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.22", default-features = false, features = ["util", "deflate"] }
unrar-rs = { version = "0.10", default-features = false, features = ["crypto-rust"] }
omsi-cfg = { path = "../omsi-cfg" }
omsi-map = { path = "../omsi-map" }
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-timetable = { path = "../omsi-timetable" }
omsi-content = { path = "../omsi-content" }
omsi-model = { path = "../omsi-model" }
omsi-net = { path = "../omsi-net" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
