[package]
name = "omsi-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio: cpal mixer with pitch/gain/3D voices, WAV loading, and the OMSI sound-config runtime (unit mc_sound)"

[dependencies]
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-cfg = { path = "../omsi-cfg" }
cpal = "0.15"
parking_lot.workspace = true
hashbrown.workspace = true
glam.workspace = true
log.workspace = true
anyhow.workspace = true
# internet radio: MP3 / AAC / Ogg streams over HTTP(S)
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "flac"] }
ureq.workspace = true

[dev-dependencies]
env_logger.workspace = true
