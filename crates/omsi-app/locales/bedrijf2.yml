"Your own bus company":
  nl: "Je eigen busbedrijf"
  de: "Dein eigenes Busunternehmen"
  fr: "Votre propre entreprise de bus"
  ru: "Ваша собственная автобусная компания"
  uk: "Ваша власна автобусна компанія"
