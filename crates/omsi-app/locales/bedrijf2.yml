"The company runs this line. A changed route is approved anew; a change of a line in service begins on a day you choose. The line is given up on the company's Lines page.":
  nl: "Het bedrijf rijdt deze lijn. Een gewijzigde route wordt opnieuw goedgekeurd; een wijziging van een lijn in dienst begint op een dag die je kiest. De lijn opgeven doe je op de pagina Lijnen van het bedrijf."
  de: "Der Betrieb fährt diese Linie. Eine geänderte Strecke wird neu genehmigt; eine Änderung einer Linie im Betrieb beginnt an einem Tag deiner Wahl. Aufgegeben wird die Linie auf der Seite Linien des Betriebs."
  fr: "L'entreprise exploite cette ligne. Un itinéraire modifié est réapprouvé ; la modification d'une ligne en service commence le jour que tu choisis. On abandonne la ligne sur la page Lignes de l'entreprise."
  ru: "Компания обслуживает эту линию. Изменённый маршрут утверждается заново; изменение работающей линии начинается в выбранный день. Отказаться от линии можно на странице «Линии» компании."
  uk: "Компанія обслуговує цю лінію. Змінений маршрут затверджується наново; зміна лінії в роботі починається у вибраний день. Відмовитися від лінії можна на сторінці «Лінії» компанії."
  pl: "Firma obsługuje tę linię. Zmieniona trasa jest zatwierdzana ponownie; zmiana linii w eksploatacji zaczyna się w wybranym dniu. Z linii rezygnuje się na stronie Linie firmy."
"Line %{n}: the new timetable begins on %{date}; today's tours run as they are.":
  nl: "Lijn %{n}: de nieuwe dienstregeling begint op %{date}; de omlopen van vandaag rijden zoals ze zijn."
  de: "Linie %{n}: der neue Fahrplan beginnt am %{date}; die heutigen Umläufe fahren, wie sie sind."
  fr: "Ligne %{n} : le nouvel horaire commence le %{date} ; les services d'aujourd'hui roulent tels quels."
  ru: "Линия %{n}: новое расписание начнётся %{date}; сегодняшние выпуски идут как есть."
  uk: "Лінія %{n}: новий розклад почнеться %{date}; сьогоднішні випуски йдуть як є."
  pl: "Linia %{n}: nowy rozkład zaczyna się %{date}; dzisiejsze obiegi kursują bez zmian."
"Its route is approved for %{amount}.":
  nl: "De route is goedgekeurd voor %{amount}."
  de: "Die Strecke ist für %{amount} genehmigt."
  fr: "Son itinéraire est approuvé pour %{amount}."
  ru: "Маршрут утверждён за %{amount}."
  uk: "Маршрут затверджено за %{amount}."
  pl: "Trasa zatwierdzona za %{amount}."
"The change is taken back: the line stays as it runs.":
  nl: "De wijziging is ingetrokken: de lijn blijft zoals hij rijdt."
  de: "Die Änderung ist zurückgenommen: die Linie bleibt, wie sie fährt."
  fr: "La modification est annulée : la ligne reste telle qu'elle roule."
  ru: "Изменение отменено: линия остаётся как есть."
  uk: "Зміну скасовано: лінія лишається як є."
  pl: "Zmiana wycofana: linia zostaje, jak kursuje."
"A change of a line in service begins tomorrow at the soonest.":
  nl: "Een wijziging van een lijn in dienst begint op zijn vroegst morgen."
  de: "Eine Änderung einer Linie im Betrieb beginnt frühestens morgen."
  fr: "La modification d'une ligne en service commence demain au plus tôt."
  ru: "Изменение работающей линии начинается не раньше завтрашнего дня."
  uk: "Зміна лінії в роботі починається не раніше завтрашнього дня."
  pl: "Zmiana linii w eksploatacji zaczyna się najwcześniej jutro."
"Line %{n} runs its new timetable from today: %{d} duties and %{b} buses given anew.":
  nl: "Lijn %{n} rijdt vanaf vandaag de nieuwe dienstregeling: %{d} diensten en %{b} bussen opnieuw toegewezen."
  de: "Linie %{n} fährt ab heute den neuen Fahrplan: %{d} Dienste und %{b} Busse neu vergeben."
  fr: "La ligne %{n} roule son nouvel horaire dès aujourd'hui : %{d} services et %{b} bus attribués à nouveau."
  ru: "Линия %{n} с сегодняшнего дня работает по новому расписанию: смен назначено заново - %{d}, автобусов - %{b}."
  uk: "Лінія %{n} від сьогодні працює за новим розкладом: змін призначено наново - %{d}, автобусів - %{b}."
  pl: "Linia %{n} od dziś kursuje według nowego rozkładu: służb przydzielonych na nowo - %{d}, autobusów - %{b}."
"New timetable from %{date}":
  nl: "Nieuwe dienstregeling vanaf %{date}"
  de: "Neuer Fahrplan ab %{date}"
  fr: "Nouvel horaire dès le %{date}"
  ru: "Новое расписание с %{date}"
  uk: "Новий розклад з %{date}"
  pl: "Nowy rozkład od %{date}"
"Saved in the line editor: today's tours run as they are; from that day the line runs its new timetable and its changed tours are planned anew.":
  nl: "Opgeslagen in de lijneditor: de omlopen van vandaag rijden zoals ze zijn; vanaf die dag rijdt de lijn de nieuwe dienstregeling en worden de gewijzigde omlopen opnieuw ingepland."
  de: "Im Linieneditor gespeichert: die heutigen Umläufe fahren, wie sie sind; ab jenem Tag fährt die Linie den neuen Fahrplan, und die geänderten Umläufe werden neu geplant."
  fr: "Enregistré dans l'éditeur de lignes : les services d'aujourd'hui roulent tels quels ; à partir de ce jour la ligne roule son nouvel horaire et ses services modifiés sont replanifiés."
  ru: "Сохранено в редакторе линий: сегодняшние выпуски идут как есть; с того дня линия работает по новому расписанию, а изменённые выпуски планируются заново."
  uk: "Збережено в редакторі ліній: сьогоднішні випуски йдуть як є; з того дня лінія працює за новим розкладом, а змінені випуски плануються наново."
  pl: "Zapisano w edytorze linii: dzisiejsze obiegi kursują bez zmian; od tego dnia linia kursuje według nowego rozkładu, a zmienione obiegi są planowane na nowo."
