"A course begins today and the driver is away for its days. New drivers learn the fleet's models when they start; a model new to the company needs its type training first.":
  nl: "Een cursus begint vandaag en de chauffeur is er zo lang niet. Nieuwe chauffeurs leren de modellen van de vloot bij hun start; een model dat nieuw is voor het bedrijf vraagt eerst een typeopleiding."
  de: "Ein Kurs beginnt heute, und der Fahrer fehlt für seine Tage. Neue Fahrer lernen die Modelle der Flotte zum Start; ein für den Betrieb neues Modell braucht zuerst seine Typschulung."
  fr: "Une formation commence aujourd'hui et le conducteur est absent pendant sa durée. Les nouveaux conducteurs apprennent les modèles de la flotte à leur arrivée ; un modèle nouveau pour l'entreprise demande d'abord sa formation."
  ru: "Курс начинается сегодня, и водитель отсутствует все его дни. Новые водители осваивают модели парка при найме; новой для компании модели сначала нужно обучение."
  uk: "Курс починається сьогодні, і водій відсутній усі його дні. Нові водії опановують моделі парку під час найму; новій для компанії моделі спершу потрібне навчання."
  pl: "Kurs zaczyna się dziś, a kierowca jest nieobecny przez jego dni. Nowi kierowcy poznają modele floty na start; nowy dla firmy model wymaga najpierw szkolenia typowego."
