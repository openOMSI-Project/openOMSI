"Your own bus company, %{name}":
  nl: "Je eigen busbedrijf, %{name}"
  de: "Dein eigenes Busunternehmen, %{name}"
  fr: "Votre propre entreprise de bus, %{name}"
  ru: "Ваша собственная автобусная компания, %{name}"
  uk: "Ваша власна автобусна компанія, %{name}"
  pl: "Twoja własna firma autobusowa, %{name}"
"Here you run a transport company on one of your maps: buy buses, hire drivers, take on lines or make your own. It runs in a time of its own, and what you drive yourself counts for it.":
  nl: "Hier run je een vervoerbedrijf op een van je kaarten: koop bussen, neem chauffeurs aan, neem lijnen over of maak je eigen lijnen. Het loopt in een eigen tijd, en wat je zelf rijdt, telt ervoor mee."
  de: "Hier führst du ein Verkehrsunternehmen auf einer deiner Karten: Kaufe Busse, stelle Fahrer ein, übernimm Linien oder baue eigene. Es läuft in einer eigenen Zeit, und was du selbst fährst, zählt für das Unternehmen."
  fr: "Ici, vous dirigez une entreprise de transport sur l’une de vos cartes : achetez des bus, embauchez des conducteurs, reprenez des lignes ou créez les vôtres. Elle vit dans son propre temps, et ce que vous conduisez vous-même compte pour elle."
  ru: "Здесь вы управляете транспортной компанией на одной из своих карт: покупайте автобусы, нанимайте водителей, берите линии или создавайте свои. У неё своё время, и то, что вы проедете сами, засчитывается ей."
  uk: "Тут ви керуєте транспортною компанією на одній зі своїх карт: купуйте автобуси, наймайте водіїв, беріть лінії або створюйте свої. У неї свій час, і те, що ви проїдете самі, зараховується їй."
  pl: "Tu prowadzisz firmę przewozową na jednej ze swoich map: kupuj autobusy, zatrudniaj kierowców, przejmuj linie lub twórz własne. Działa we własnym czasie, a to, co sam przejedziesz, liczy się dla niej."
"Found it first":
  nl: "Eerst oprichten"
  de: "Erst gründen"
  fr: "D’abord la fonder"
  ru: "Сначала основать"
  uk: "Спершу заснувати"
  pl: "Najpierw ją załóż"
"Give the company a name, its colours, its home map with a depot and how hard its economy is. Once it runs, this tour shows you round its pages.":
  nl: "Geef het bedrijf een naam, zijn kleuren, zijn thuiskaart met een depot en hoe zwaar zijn economie is. Zodra het draait, leidt deze rondleiding je langs zijn pagina's."
  de: "Gib dem Unternehmen einen Namen, seine Farben, seine Heimatkarte mit einem Betriebshof und wie schwer seine Wirtschaft ist. Sobald es läuft, führt dich diese Tour durch seine Seiten."
  fr: "Donnez à l’entreprise un nom, ses couleurs, sa carte d’attache avec un dépôt et la difficulté de son économie. Une fois lancée, cette visite vous fait faire le tour de ses pages."
  ru: "Дайте компании название, цвета, родную карту с депо и сложность экономики. Как только она заработает, этот тур покажет её страницы."
  uk: "Дайте компанії назву, кольори, рідну карту з депо та складність економіки. Щойно вона запрацює, цей тур покаже її сторінки."
  pl: "Nadaj firmie nazwę, kolory, mapę macierzystą z zajezdnią i poziom trudności gospodarki. Gdy ruszy, ta wycieczka oprowadzi cię po jej stronach."
"The company's own clock":
  nl: "De eigen klok van het bedrijf"
  de: "Die eigene Uhr des Unternehmens"
  fr: "L’horloge propre de l’entreprise"
  ru: "Собственные часы компании"
  uk: "Власний годинник компанії"
  pl: "Własny zegar firmy"
"The company runs in a time of its own: let it run here, or jump on to the morning, to tomorrow or by days. At midnight the day is closed: the tours are run and the money is booked.":
  nl: "Het bedrijf loopt in een eigen tijd: laat hem hier lopen, of spring door naar de ochtend, naar morgen of met dagen tegelijk. Om middernacht wordt de dag afgesloten: de omlopen worden gereden en het geld geboekt."
  de: "Das Unternehmen läuft in einer eigenen Zeit: Lass sie hier laufen oder spring zum Morgen, zu morgen oder um Tage weiter. Um Mitternacht wird der Tag abgeschlossen: Die Umläufe werden gefahren und das Geld gebucht."
  fr: "L’entreprise vit dans son propre temps : laissez-le s’écouler ici, ou sautez au matin, au lendemain ou de plusieurs jours. À minuit la journée est clôturée : les services sont assurés et l’argent comptabilisé."
  ru: "У компании своё время: пусть оно идёт здесь, или перескочите к утру, на завтра или на несколько дней. В полночь день закрывается: выходы выполняются, деньги учитываются."
  uk: "У компанії свій час: нехай він іде тут, або перескочіть до ранку, на завтра чи на кілька днів. Опівночі день закривається: обороти виконуються, гроші обліковуються."
  pl: "Firma działa we własnym czasie: puść go tutaj albo przeskocz do rana, do jutra lub o dni. O północy dzień jest zamykany: brygady są realizowane, a pieniądze księgowane."
"Everything in tabs":
  nl: "Alles in tabbladen"
  de: "Alles in Registern"
  fr: "Tout en onglets"
  ru: "Всё во вкладках"
  uk: "Усе у вкладках"
  pl: "Wszystko w kartach"
"Each part of the company has a page here: the buses, the staff, the lines, the money, the planning and more.":
  nl: "Elk deel van het bedrijf heeft hier een pagina: de bussen, het personeel, de lijnen, het geld, de planning en meer."
  de: "Jeder Teil des Unternehmens hat hier eine Seite: die Busse, das Personal, die Linien, das Geld, die Planung und mehr."
  fr: "Chaque partie de l’entreprise a ici sa page : les bus, le personnel, les lignes, l’argent, la planification et plus encore."
  ru: "У каждой части компании здесь своя страница: автобусы, персонал, линии, деньги, планирование и многое другое."
  uk: "Кожна частина компанії має тут свою сторінку: автобуси, персонал, лінії, гроші, планування та інше."
  pl: "Każda część firmy ma tu swoją stronę: autobusy, personel, linie, pieniądze, planowanie i więcej."
"The figures":
  nl: "De cijfers"
  de: "Die Zahlen"
  fr: "Les chiffres"
  ru: "Показатели"
  uk: "Показники"
  pl: "Liczby"
"The cash, this month's result, the fleet, the staff, punctuality and reputation at a glance.":
  nl: "De kas, het resultaat van deze maand, de vloot, het personeel, de stiptheid en de reputatie in één oogopslag."
  de: "Die Kasse, das Ergebnis dieses Monats, die Flotte, das Personal, Pünktlichkeit und Ruf auf einen Blick."
  fr: "La trésorerie, le résultat du mois, la flotte, le personnel, la ponctualité et la réputation d’un coup d’œil."
  ru: "Касса, результат месяца, парк, персонал, пунктуальность и репутация с первого взгляда."
  uk: "Каса, результат місяця, парк, персонал, пунктуальність і репутація з першого погляду."
  pl: "Kasa, wynik miesiąca, flota, personel, punktualność i reputacja w jednym spojrzeniu."
"What wants your attention":
  nl: "Wat je aandacht vraagt"
  de: "Was deine Aufmerksamkeit braucht"
  fr: "Ce qui demande votre attention"
  ru: "Что требует внимания"
  uk: "Що потребує уваги"
  pl: "Co wymaga uwagi"
"Today's tours and how many are covered, your own next duty, and what needs doing. A click takes you to the page that helps.":
  nl: "De omlopen van vandaag en hoeveel er gedekt zijn, je eigen volgende dienst en wat er moet gebeuren. Een klik brengt je naar de pagina die helpt."
  de: "Die heutigen Umläufe und wie viele gedeckt sind, dein nächster eigener Dienst und was zu tun ist. Ein Klick bringt dich zur Seite, die hilft."
  fr: "Les services du jour et combien sont couverts, votre prochain service, et ce qu’il faut faire. Un clic mène à la page qui aide."
  ru: "Сегодняшние выходы и сколько из них обеспечено, ваша следующая смена и что нужно сделать. Щелчок ведёт на страницу, которая поможет."
  uk: "Сьогоднішні обороти і скільки з них забезпечено, ваш наступний наряд і що треба зробити. Клік веде на сторінку, яка допоможе."
  pl: "Dzisiejsze brygady i ile z nich jest obsadzonych, twoja następna służba i co trzeba zrobić. Kliknięcie prowadzi do strony, która pomoże."
"Buses and the dealer":
  nl: "Bussen en de dealer"
  de: "Busse und der Händler"
  fr: "Les bus et le concessionnaire"
  ru: "Автобусы и дилер"
  uk: "Автобуси та дилер"
  pl: "Autobusy i dealer"
"Your buses with their condition and their livery. At the dealer you buy new or used ones, haggle, lease or rent, and sign the contract.":
  nl: "Je bussen met hun staat en hun lak. Bij de dealer koop je nieuwe of gebruikte, onderhandel je, lease of huur je, en teken je het contract."
  de: "Deine Busse mit ihrem Zustand und ihrer Lackierung. Beim Händler kaufst du neue oder gebrauchte, verhandelst, least oder mietest und unterschreibst den Vertrag."
  fr: "Vos bus avec leur état et leur livrée. Chez le concessionnaire vous achetez du neuf ou de l’occasion, négociez, louez en leasing ou à la journée, et signez le contrat."
  ru: "Ваши автобусы с их состоянием и ливреей. У дилера вы покупаете новые или подержанные, торгуетесь, берёте в лизинг или аренду и подписываете договор."
  uk: "Ваші автобуси з їхнім станом і лівреєю. У дилера ви купуєте нові чи вживані, торгуєтеся, берете в лізинг чи оренду й підписуєте договір."
  pl: "Twoje autobusy z ich stanem i malowaniem. U dealera kupujesz nowe lub używane, negocjujesz, leasingujesz lub wynajmujesz i podpisujesz umowę."
"Drivers and the others":
  nl: "Chauffeurs en de anderen"
  de: "Fahrer und die anderen"
  fr: "Les conducteurs et les autres"
  ru: "Водители и остальные"
  uk: "Водії та інші"
  pl: "Kierowcy i pozostali"
"Hire drivers on the labour market and keep them content. Their wages, licences, holidays and days ill all count.":
  nl: "Neem chauffeurs aan op de arbeidsmarkt en houd ze tevreden. Hun loon, rijbewijzen, vakanties en ziektedagen tellen allemaal mee."
  de: "Stelle Fahrer auf dem Arbeitsmarkt ein und halte sie zufrieden. Ihr Lohn, ihre Führerscheine, ihr Urlaub und ihre Krankheitstage zählen alle."
  fr: "Embauchez des conducteurs sur le marché du travail et gardez-les contents. Leurs salaires, permis, congés et jours de maladie comptent tous."
  ru: "Нанимайте водителей на рынке труда и держите их довольными. Их зарплата, права, отпуска и больничные — всё имеет значение."
  uk: "Наймайте водіїв на ринку праці й тримайте їх задоволеними. Їхня зарплата, посвідчення, відпустки й лікарняні — усе має значення."
  pl: "Zatrudniaj kierowców na rynku pracy i dbaj o ich zadowolenie. Liczą się ich płace, prawa jazdy, urlopy i dni choroby."
"What the company runs":
  nl: "Wat het bedrijf rijdt"
  de: "Was das Unternehmen fährt"
  fr: "Ce que l’entreprise exploite"
  ru: "Что обслуживает компания"
  uk: "Що обслуговує компанія"
  pl: "Co obsługuje firma"
"Take on the map's lines or make your own in the line editor: its kind, its buses, its timetable. A line runs once it is planned.":
  nl: "Neem de lijnen van de kaart over of maak je eigen lijnen in de lijneditor: hun soort, hun bussen, hun dienstregeling. Een lijn rijdt zodra hij gepland is."
  de: "Übernimm die Linien der Karte oder baue eigene im Linieneditor: ihre Art, ihre Busse, ihren Fahrplan. Eine Linie fährt, sobald sie geplant ist."
  fr: "Reprenez les lignes de la carte ou créez les vôtres dans l’éditeur de lignes : leur type, leurs bus, leur horaire. Une ligne circule dès qu’elle est planifiée."
  ru: "Берите линии карты или создавайте свои в редакторе линий: их вид, автобусы, расписание. Линия работает, как только она запланирована."
  uk: "Беріть лінії карти або створюйте свої в редакторі ліній: їхній вид, автобуси, розклад. Лінія працює, щойно її заплановано."
  pl: "Przejmij linie mapy lub stwórz własne w edytorze linii: ich rodzaj, autobusy, rozkład. Linia kursuje, gdy tylko zostanie zaplanowana."
"Who drives what":
  nl: "Wie rijdt wat"
  de: "Wer fährt was"
  fr: "Qui conduit quoi"
  ru: "Кто что ведёт"
  uk: "Хто що веде"
  pl: "Kto co prowadzi"
"The week as a chart: drag drivers and buses onto the tours and duties, or let the dispatcher fill the roster. Plan yourself as a driver too.":
  nl: "De week als grafiek: sleep chauffeurs en bussen op de omlopen en diensten, of laat de planner het rooster vullen. Plan jezelf ook in als chauffeur."
  de: "Die Woche als Diagramm: Ziehe Fahrer und Busse auf die Umläufe und Dienste oder lass den Disponenten den Dienstplan füllen. Plane dich auch selbst als Fahrer ein."
  fr: "La semaine en diagramme : glissez conducteurs et bus sur les services, ou laissez le régulateur remplir le tableau. Planifiez-vous aussi comme conducteur."
  ru: "Неделя в виде диаграммы: перетаскивайте водителей и автобусы на выходы и смены или поручите диспетчеру заполнить график. Назначьте и себя водителем."
  uk: "Тиждень у вигляді діаграми: перетягуйте водіїв і автобуси на обороти й наряди або доручіть диспетчеру заповнити графік. Призначте й себе водієм."
  pl: "Tydzień jako wykres: przeciągaj kierowców i autobusy na brygady i służby albo pozwól dyspozytorowi wypełnić grafik. Zaplanuj też siebie jako kierowcę."
"The money":
  nl: "Het geld"
  de: "Das Geld"
  fr: "L’argent"
  ru: "Деньги"
  uk: "Гроші"
  pl: "Pieniądze"
"Every booking, month by month: fares, the authority's money, wages, fuel and repairs. Loans come from the bank here.":
  nl: "Elke boeking, maand na maand: ritprijzen, het geld van de opdrachtgever, lonen, brandstof en reparaties. Leningen komen hier van de bank."
  de: "Jede Buchung, Monat für Monat: Fahrgelder, das Geld des Aufgabenträgers, Löhne, Treibstoff und Reparaturen. Kredite kommen hier von der Bank."
  fr: "Chaque écriture, mois par mois : recettes, argent de l’autorité organisatrice, salaires, carburant et réparations. Les prêts viennent ici de la banque."
  ru: "Каждая проводка, месяц за месяцем: выручка, деньги заказчика, зарплаты, топливо и ремонт. Кредиты здесь даёт банк."
  uk: "Кожна проводка, місяць за місяцем: виручка, гроші замовника, зарплати, пальне й ремонти. Кредити тут дає банк."
  pl: "Każda księgowa pozycja, miesiąc po miesiącu: bilety, pieniądze organizatora, płace, paliwo i naprawy. Kredyty daje tu bank."
"Your duties and your progress":
  nl: "Je diensten en je voortgang"
  de: "Deine Dienste und dein Fortschritt"
  fr: "Vos services et votre progression"
  ru: "Ваши смены и ваш прогресс"
  uk: "Ваші наряди та ваш поступ"
  pl: "Twoje służby i postępy"
"My duties lists the duties planned for you, each a click from driving it. Here too: the company's level, the training courses and the rankings.":
  nl: "Mijn diensten toont de diensten die voor jou gepland zijn, elk een klik van het rijden. Ook hier: het niveau van het bedrijf, de cursussen en de ranglijsten."
  de: "Meine Dienste zeigt die für dich geplanten Dienste, jeder einen Klick vom Fahren entfernt. Auch hier: die Stufe des Unternehmens, die Schulungen und die Ranglisten."
  fr: "Mes services liste les services prévus pour vous, chacun à un clic de la conduite. Ici aussi : le niveau de l’entreprise, les formations et les classements."
  ru: "«Мои смены» показывает смены, запланированные для вас, — каждая в одном щелчке от поездки. Здесь же: уровень компании, курсы обучения и рейтинги."
  uk: "«Мої наряди» показує заплановані для вас наряди — кожен за один клік від поїздки. Тут же: рівень компанії, курси навчання й рейтинги."
  pl: "Moje służby pokazują zaplanowane dla ciebie służby, każda o kliknięcie od jazdy. Tu też: poziom firmy, szkolenia i rankingi."
"Off to work":
  nl: "Aan het werk"
  de: "An die Arbeit"
  fr: "Au travail"
  ru: "За работу"
  uk: "До роботи"
  pl: "Do pracy"
"This question mark shows the tour again. Good luck with your company!":
  nl: "Dit vraagteken toont de rondleiding opnieuw. Veel succes met je bedrijf!"
  de: "Dieses Fragezeichen zeigt die Tour noch einmal. Viel Erfolg mit deinem Unternehmen!"
  fr: "Ce point d’interrogation remontre la visite. Bonne chance avec votre entreprise !"
  ru: "Этот вопросительный знак снова покажет тур. Удачи вашей компании!"
  uk: "Цей знак питання знову покаже тур. Успіхів вашій компанії!"
  pl: "Ten znak zapytania pokaże wycieczkę ponownie. Powodzenia z firmą!"
