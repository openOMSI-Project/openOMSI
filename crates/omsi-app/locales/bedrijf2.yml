  ru: "Вдвое меньше аварий и штрафов на их рейсах"
  uk: "Удвічі менше аварій і штрафів на їхніх рейсах"
  pl: "O połowę mniej wypadków i mandatów na ich kursach"
"A passenger taken ill or hurt on board costs far less reputation":
  nl: "Een reiziger die aan boord onwel wordt of zich bezeert, kost veel minder aanzien"
