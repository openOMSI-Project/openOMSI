  nl: "Een rondleiding door het busbedrijf"
  de: "Eine Tour durch das Busunternehmen"
  fr: "Une visite de l’entreprise de bus"
  ru: "Тур по автобусной компании"
  uk: "Тур автобусною компанією"
  pl: "Wycieczka po firmie autobusowej"
