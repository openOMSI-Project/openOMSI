  nl: "Lakken en spuitwerk"
  de: "Lackierungen und Lackierarbeiten"
  fr: "Livrées et peinture"
  ru: "Ливреи и покраска"
  uk: "Лівреї та фарбування"
  pl: "Malowania i lakierowanie"
