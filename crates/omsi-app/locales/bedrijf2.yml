"Paid at every month's end, from the month after the signing. Ending it early costs three months' fee (%{amount}). The advertiser pays the printing and the foil.":
  nl: "Betaald aan het eind van elke maand, vanaf de maand na de ondertekening. Vroegtijdig beëindigen kost drie maanden vergoeding (%{amount}). De adverteerder betaalt het drukwerk en de folie."
  de: "Bezahlt am Ende jedes Monats, ab dem Monat nach der Unterschrift. Vorzeitig beenden kostet drei Monatsentgelte (%{amount}). Der Werbekunde zahlt Druck und Folie."
  fr: "Payé à chaque fin de mois, à partir du mois suivant la signature. Le résilier coûte trois mois de redevance (%{amount}). L’annonceur paie l’impression et le film."
  ru: "Оплачивается в конце каждого месяца, начиная со следующего после подписания. Досрочное расторжение стоит три месячных платы (%{amount}). Печать и плёнку оплачивает рекламодатель."
  uk: "Оплачується наприкінці кожного місяця, починаючи з наступного після підписання. Дострокове розірвання коштує три місячні плати (%{amount}). Друк і плівку оплачує рекламодавець."
  pl: "Płatne na koniec każdego miesiąca, od miesiąca po podpisaniu. Wcześniejsze zakończenie kosztuje trzy miesięczne opłaty (%{amount}). Druk i folię opłaca reklamodawca."
