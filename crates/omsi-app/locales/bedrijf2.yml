"The line runs: today's tours stay as they are. The new timetable begins on the day you choose; the tours it changes get their buses and drivers anew then.":
  nl: "De lijn rijdt: de omlopen van vandaag blijven zoals ze zijn. De nieuwe dienstregeling begint op de dag die je kiest; de omlopen die veranderen krijgen dan opnieuw hun bussen en chauffeurs."
  de: "Die Linie fährt: die heutigen Umläufe bleiben, wie sie sind. Der neue Fahrplan beginnt an dem Tag, den du wählst; die geänderten Umläufe bekommen dann neu ihre Busse und Fahrer."
  fr: "La ligne roule : les services d'aujourd'hui restent tels quels. Le nouvel horaire commence le jour que tu choisis ; les services modifiés reçoivent alors à nouveau leurs bus et conducteurs."
  ru: "Линия работает: сегодняшние выпуски остаются как есть. Новое расписание начнётся в выбранный день; изменённые выпуски тогда получат автобусы и водителей заново."
  uk: "Лінія працює: сьогоднішні випуски лишаються як є. Новий розклад почнеться у вибраний день; змінені випуски тоді отримають автобуси й водіїв наново."
  pl: "Linia kursuje: dzisiejsze obiegi zostają bez zmian. Nowy rozkład zacznie się w wybranym dniu; zmienione obiegi dostaną wtedy na nowo autobusy i kierowców."
