"No advert on the buses yet. Sign an advertiser's offer: the money comes at every month's end, from the month after the signing.":
  nl: "Nog geen reclame op de bussen. Teken een aanbod van een adverteerder: het geld komt aan het eind van elke maand, vanaf de maand na de ondertekening."
  de: "Noch keine Werbung auf den Bussen. Unterschreibe ein Angebot eines Werbekunden: Das Geld kommt am Ende jedes Monats, ab dem Monat nach der Unterschrift."
  fr: "Pas encore de publicité sur les bus. Signez l’offre d’un annonceur : l’argent arrive à chaque fin de mois, à partir du mois suivant la signature."
  ru: "На автобусах пока нет рекламы. Подпишите предложение рекламодателя: деньги приходят в конце каждого месяца, начиная со следующего после подписания."
  uk: "На автобусах ще немає реклами. Підпишіть пропозицію рекламодавця: гроші надходять наприкінці кожного місяця, починаючи з наступного після підписання."
  pl: "Na autobusach nie ma jeszcze reklam. Podpisz ofertę reklamodawcy: pieniądze wpływają na koniec każdego miesiąca, od miesiąca po podpisaniu."
