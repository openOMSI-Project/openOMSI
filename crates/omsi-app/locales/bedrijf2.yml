  fr: "notre livrée"
  ru: "наша ливрея"
  uk: "наша ліврея"
  pl: "nasze malowanie"
"Design a livery (%{amount})":
  nl: "Lak ontwerpen (%{amount})"
  de: "Lackierung entwerfen (%{amount})"
  fr: "Concevoir une livrée (%{amount})"
  ru: "Создать ливрею (%{amount})"
  uk: "Створити ліврею (%{amount})"
  pl: "Zaprojektuj malowanie (%{amount})"
"Paint the company's own livery for this bus in the livery studio: its design is paid when it is saved, a bus's painting when the bus is painted.":
  nl: "Ontwerp de eigen lak van het bedrijf voor deze bus in de lakstudio: het ontwerp wordt betaald als het wordt opgeslagen, het spuiten van een bus als de bus wordt gespoten."
  de: "Entwirf die eigene Lackierung des Unternehmens für diesen Bus im Lackierstudio: Der Entwurf wird beim Speichern bezahlt, das Lackieren eines Busses, wenn er lackiert wird."
  fr: "Peignez la livrée de l’entreprise pour ce bus dans le studio de livrées : sa conception est payée à l’enregistrement, la peinture d’un bus quand il est peint."
  ru: "Нарисуйте фирменную ливрею компании для этого автобуса в студии ливрей: дизайн оплачивается при сохранении, покраска автобуса — когда его красят."
  uk: "Намалюйте фірмову ліврею компанії для цього автобуса в студії лівреї: дизайн оплачується під час збереження, фарбування автобуса — коли його фарбують."
  pl: "Zaprojektuj własne malowanie firmy dla tego autobusu w studiu malowań: projekt jest płatny przy zapisie, lakierowanie autobusu przy lakierowaniu."
"Bus %{n} is painted in '%{name}' in the workshop (%{amount}).":
  nl: "Bus %{n} wordt in de werkplaats in '%{name}' gespoten (%{amount})."
