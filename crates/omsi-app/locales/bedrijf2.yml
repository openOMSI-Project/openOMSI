"Who lacks it is away today, on another course or leaving the company - or needs the D licence first.":
  nl: "Wie hem mist, is vandaag afwezig, op een andere cursus of gaat het bedrijf verlaten - of heeft eerst rijbewijs D nodig."
  de: "Wem sie fehlt, ist heute weg, auf einem anderen Kurs oder verlässt den Betrieb - oder braucht zuerst den Führerschein D."
  fr: "Ceux à qui elle manque sont absents aujourd'hui, en autre formation ou sur le départ - ou ont d'abord besoin du permis D."
  ru: "У кого его нет, сегодня отсутствует, на другом курсе или увольняется - или сначала нужны права D."
  uk: "Хто його не має, сьогодні відсутній, на іншому курсі або звільняється - або спершу потребує посвідчення D."
  pl: "Kto go nie ma, jest dziś nieobecny, na innym kursie lub odchodzi z firmy - albo najpierw potrzebuje kat. D."
