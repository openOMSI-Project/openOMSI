"Any bus of its depot group drives it. Choose kinds of bus or buses by name to have the line driven with them.":
  nl: "Elke bus van de depotgroep rijdt hem. Kies soorten bussen of bussen bij naam om de lijn daarmee te laten rijden."
  de: "Jeder Bus der Depotgruppe fährt sie. Wähle Busarten oder Busse nach Namen, damit die Linie mit ihnen gefahren wird."
  fr: "N’importe quel bus du groupe de dépôt l’assure. Choisissez des types de bus ou des bus par leur nom pour que la ligne soit assurée avec eux."
  ru: "Её обслуживает любой автобус группы депо. Выберите типы автобусов или конкретные автобусы, чтобы линию обслуживали ими."
  uk: "Її обслуговує будь-який автобус групи депо. Виберіть типи автобусів або конкретні автобуси, щоб лінію обслуговували ними."
  pl: "Obsługuje ją każdy autobus z grupy zajezdni. Wybierz rodzaje autobusów lub konkretne autobusy, by linia jeździła nimi."
"%{n} of the installed buses fit. The timetable's buses on the line are such buses where the map's depots have them.":
  nl: "%{n} van de geïnstalleerde bussen passen. De bussen van de dienstregeling op de lijn zijn zulke bussen, waar de depots van de kaart ze hebben."
  de: "%{n} der installierten Busse passen. Die Fahrplanbusse der Linie sind solche Busse, wo die Depots der Karte sie haben."
  fr: "%{n} des bus installés conviennent. Les bus de l’horaire sur la ligne sont de ceux-là, là où les dépôts de la carte en ont."
  ru: "Подходят установленные автобусы: %{n}. Автобусы по расписанию на линии будут такими, если они есть в депо карты."
  uk: "Підходять встановлені автобуси: %{n}. Автобуси за розкладом на лінії будуть такими, якщо вони є в депо карти."
  pl: "Pasujące zainstalowane autobusy: %{n}. Autobusy rozkładowe na linii będą takie, o ile zajezdnie mapy je mają."
