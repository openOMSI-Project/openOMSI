  fr: "Aucun bus de l’entreprise ne convient : le planning ne peut en mettre aucun sur ses services."
  ru: "Ни один автобус компании не подходит: планирование не сможет поставить его на выходы."
  uk: "Жоден автобус компанії не підходить: планування не зможе поставити його на обороти."
  pl: "Żaden autobus firmy nie pasuje: planowanie nie może przydzielić go do brygad."
