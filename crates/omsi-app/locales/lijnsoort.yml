"This map's calendar names no school holidays: these hold for your lines here (the game itself runs every working day as a school day).":
  nl: "De kalender van deze kaart noemt geen schoolvakanties: deze gelden voor je lijnen hier (het spel zelf rijdt elke werkdag als schooldag)."
  de: "Der Kalender dieser Karte nennt keine Schulferien: Diese gelten für deine Linien hier (das Spiel selbst fährt jeden Werktag als Schultag)."
  fr: "Le calendrier de cette carte ne nomme aucunes vacances scolaires : celles-ci valent pour vos lignes ici (le jeu lui-même traite chaque jour ouvré comme un jour d’école)."
  ru: "В календаре этой карты нет школьных каникул: для ваших линий здесь действуют эти (сама игра считает каждый будний день учебным)."
  uk: "У календарі цієї карти немає шкільних канікул: для ваших ліній тут діють ці (сама гра вважає кожен робочий день навчальним)."
  pl: "Kalendarz tej mapy nie podaje ferii: dla twoich linii obowiązują tu te (sama gra traktuje każdy dzień roboczy jako dzień nauki)."
