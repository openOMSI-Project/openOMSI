"Sets the drive to this duty - the map, the line and tour, the company's bus in its livery, the day and the time - and opens its start: you start it there.":
  nl: "Zet de rit klaar voor deze dienst - de kaart, de lijn en omloop, de bus van het bedrijf in zijn lak, de dag en de tijd - en opent de start: daar begin je hem zelf."
  de: "Stellt die Fahrt auf diesen Dienst ein - Karte, Linie und Umlauf, den Bus des Unternehmens in seiner Lackierung, Tag und Uhrzeit - und öffnet den Start: Dort beginnst du sie selbst."
  fr: "Prépare la conduite de ce service - la carte, la ligne et le service, le bus de l’entreprise dans sa livrée, le jour et l’heure - et ouvre le départ : c’est là que vous la lancez."
  ru: "Настраивает поездку на эту смену — карта, линия и выход, автобус компании в его ливрее, день и время — и открывает старт: там вы начинаете её сами."
  uk: "Налаштовує поїздку на цей наряд — карта, лінія й оборот, автобус компанії в його лівреї, день і час — і відкриває старт: там ви починаєте її самі."
  pl: "Ustawia jazdę na tę służbę — mapę, linię i brygadę, autobus firmy w jego malowaniu, dzień i godzinę — i otwiera start: tam rozpoczynasz ją sam."
"The duties here are those the Planning gives you yourself (\"You\" as the driver): the same weekday every week. \"Drive\" opens the start of the drive with everything set; what you drive counts for the company as measured when its day is closed, and a duty of yours not driven is open for the central to fill.":
  nl: "Hier staan de diensten die de Planning aan jou zelf geeft (\"Jij\" als chauffeur): elke week op dezelfde weekdag. \"Rijden\" opent de start van de rit met alles ingesteld; wat je rijdt telt voor het bedrijf als gemeten zodra de dag wordt afgesloten, en een dienst van jou die je niet rijdt staat open voor de centrale."
  de: "Hier stehen die Dienste, die die Planung dir selbst gibt (\"Du\" als Fahrer): jede Woche am selben Wochentag. \"Fahren\" öffnet den Start der Fahrt mit allem eingestellt; was du fährst, zählt für das Unternehmen als gemessen, wenn sein Tag abgeschlossen wird, und ein nicht gefahrener Dienst von dir ist für die Zentrale offen."
  fr: "Voici les services que la Planification vous confie (« Vous » comme conducteur) : le même jour chaque semaine. « Conduire » ouvre le départ avec tout réglé ; ce que vous conduisez compte pour l’entreprise comme mesuré à la clôture de sa journée, et un service non conduit reste ouvert pour la centrale."
  ru: "Здесь смены, которые Планирование даёт вам самим («Вы» как водитель): в один и тот же день недели каждую неделю. «Поездка» открывает старт поездки со всеми настройками; то, что вы проедете, засчитывается компании как измеренное при закрытии её дня, а не проеханная вами смена остаётся открытой для центральной."
  uk: "Тут наряди, які Планування дає вам самим («Ви» як водій): щотижня в той самий день тижня. «Їхати» відкриває старт поїздки з усіма налаштуваннями; те, що ви проїдете, зараховується компанії як виміряне при закритті її дня, а не проїханий вами наряд лишається відкритим для центральної."
  pl: "Tu są służby, które Planowanie daje tobie („Ty” jako kierowca): co tydzień w ten sam dzień tygodnia. „Jedź” otwiera start jazdy ze wszystkim ustawionym; to, co przejedziesz, liczy się dla firmy jako zmierzone przy zamknięciu jej dnia, a nieprzejechana twoja służba pozostaje otwarta dla centrali."
