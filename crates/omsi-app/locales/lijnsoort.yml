"Every day as the timetable has it. Paid by the fares and the authority's money per kilometre.":
  nl: "Elke dag volgens de dienstregeling. Betaald uit de ritprijzen en het geld per kilometer van de opdrachtgever."
  de: "Jeden Tag nach Fahrplan. Bezahlt aus den Fahrgeldern und dem Geld des Aufgabenträgers je Kilometer."
  fr: "Chaque jour selon l’horaire. Payé par les recettes et par l’autorité organisatrice au kilomètre."
  ru: "Каждый день по расписанию. Оплачивается выручкой от проезда и деньгами заказчика за каждый километр."
  uk: "Щодня за розкладом. Оплачується виручкою за проїзд і коштами замовника за кожен кілометр."
  pl: "Codziennie według rozkładu. Opłacane z biletów i przez organizatora za każdy kilometr."
"Monday to Friday on school days only: not in the school holidays, not on public holidays. Trips around the start and the end of school; the school authority pays per trip and wants them on time.":
  nl: "Maandag tot en met vrijdag, alleen op schooldagen: niet in de schoolvakanties, niet op feestdagen. Ritten rond het begin en het einde van de school; het schoolbestuur betaalt per rit en wil ze op tijd."
  de: "Montag bis Freitag, nur an Schultagen: nicht in den Schulferien, nicht an Feiertagen. Fahrten um Schulbeginn und Schulschluss; der Schulträger zahlt je Fahrt und will sie pünktlich."
  fr: "Du lundi au vendredi, les jours d’école seulement : pas pendant les vacances scolaires ni les jours fériés. Des courses autour du début et de la fin des cours ; l’autorité scolaire paie à la course et exige la ponctualité."
  ru: "С понедельника по пятницу, только в учебные дни: не в каникулы и не в праздники. Рейсы к началу и концу занятий; школьное ведомство платит за рейс и требует пунктуальности."
  uk: "З понеділка по п’ятницю, лише в навчальні дні: не в канікули й не у свята. Рейси до початку й кінця занять; шкільне управління платить за рейс і вимагає пунктуальності."
  pl: "Od poniedziałku do piątku, tylko w dni nauki: nie w ferie ani w święta. Kursy na początek i koniec lekcji; organ szkolny płaci za kurs i wymaga punktualności."
"Saturdays, Sundays and public holidays in the daytime: people out for the day, a higher fare, fewer of them when it rains.":
  nl: "Zaterdag, zondag en feestdagen overdag: dagjesmensen, een hoger tarief, minder als het regent."
  de: "Samstags, sonntags und an Feiertagen tagsüber: Ausflügler, ein höherer Fahrpreis, weniger bei Regen."
  fr: "Samedis, dimanches et jours fériés en journée : des excursionnistes, un tarif plus élevé, moins nombreux quand il pleut."
  ru: "По субботам, воскресеньям и праздникам днём: отдыхающие, тариф выше, в дождь их меньше."
  uk: "У суботу, неділю та свята вдень: відпочивальники, вищий тариф, у дощ їх менше."
  pl: "Soboty, niedziele i święta w ciągu dnia: wycieczkowicze, wyższa taryfa, mniej ich, gdy pada."
"Small buses whose trips run only when somebody booked them. The passenger pays the fare and a booking fee.":
  nl: "Kleine bussen waarvan de ritten alleen rijden als iemand ze heeft geboekt. De reiziger betaalt de ritprijs en een boekingstoeslag."
  de: "Kleine Busse, deren Fahrten nur stattfinden, wenn jemand sie bestellt hat. Der Fahrgast zahlt den Fahrpreis und einen Komfortzuschlag."
  fr: "De petits bus dont les courses n’ont lieu que si quelqu’un les a réservées. Le voyageur paie le tarif et des frais de réservation."
  ru: "Небольшие автобусы, рейсы которых выполняются, только если их кто-то заказал. Пассажир платит за проезд и сбор за заказ."
  uk: "Невеликі автобуси, рейси яких виконуються, лише якщо їх хтось замовив. Пасажир платить за проїзд і збір за замовлення."
  pl: "Małe autobusy, których kursy odbywają się tylko po rezerwacji. Pasażer płaci za bilet i opłatę za rezerwację."
