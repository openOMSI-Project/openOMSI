"Plan yourself as a driver in the Planning: choose a duty there and \"You\". It is yours on that weekday every week.":
  nl: "Plan jezelf als chauffeur in de Planning: kies daar een dienst en \"Jij\". Hij is dan elke week op die weekdag van jou."
  de: "Plane dich in der Planung als Fahrer ein: Wähle dort einen Dienst und \"Du\". Er gehört dann jede Woche an diesem Wochentag dir."
  fr: "Planifiez-vous comme conducteur dans la Planification : choisissez-y un service et « Vous ». Il est à vous ce jour de la semaine, chaque semaine."
  ru: "Назначьте себя водителем в Планировании: выберите там смену и «Вы». Она будет вашей в этот день недели каждую неделю."
  uk: "Призначте себе водієм у Плануванні: виберіть там наряд і «Ви». Він буде вашим у цей день тижня щотижня."
  pl: "Zaplanuj się jako kierowca w Planowaniu: wybierz tam służbę i „Ty”. Będzie twoja w ten dzień tygodnia co tydzień."
