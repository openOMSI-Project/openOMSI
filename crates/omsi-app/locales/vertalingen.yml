"Free driving: the bus starts where you chose, with the traffic and the timetable's buses around it, but no line of your own. Pick the place below or click an entry point on the map.":
  nl: "Vrij rijden: de bus begint waar je kiest, met het verkeer en de bussen van de dienstregeling om je heen, maar zonder eigen lijn. Kies de plek hieronder of klik op een inzetpunt op de kaart."
  de: "Freie Fahrt: Der Bus startet, wo du willst, mit dem Verkehr und den Bussen des Fahrplans um dich herum, aber ohne eigene Linie. Wähle den Ort unten oder klicke auf einen Einsetzpunkt auf der Karte."
  fr: "Conduite libre : le bus part de l'endroit choisi, entouré de la circulation et des bus de l'horaire, mais sans ligne à vous. Choisissez le lieu ci-dessous ou cliquez sur un point d'entrée de la carte."
  ru: "Свободная езда: автобус начинает там, где вы выбрали, вокруг — транспорт и автобусы по расписанию, но своего маршрута нет. Выберите место ниже или нажмите на точку появления на карте."
  uk: "Вільна поїздка: автобус починає там, де ви вибрали, довкола — рух і автобуси за розкладом, але без власної лінії. Виберіть місце нижче або клацніть точку появи на мапі."
  pl: "Jazda swobodna: autobus rusza tam, gdzie wybierzesz, wśród ruchu i autobusów z rozkładu, ale bez własnej linii. Wybierz miejsce poniżej albo kliknij punkt wjazdu na mapie."
