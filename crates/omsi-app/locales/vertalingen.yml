"The Vulkan graphics driver stopped while compiling shaders. Starting the game again will switch to OpenGL (or change it in Settings → Graphics API).":
  nl: "Het Vulkan-stuurprogramma van de videokaart stopte tijdens het compileren van shaders. Bij de volgende start schakelt het spel over op OpenGL (of wijzig het onder Instellingen → Grafische API)."
  de: "Der Vulkan-Grafiktreiber ist beim Kompilieren der Shader stehen geblieben. Beim nächsten Start wechselt das Spiel zu OpenGL (oder ändere es unter Einstellungen → Grafik-API)."
  fr: "Le pilote graphique Vulkan s'est arrêté pendant la compilation des shaders. Au prochain lancement, le jeu passera à OpenGL (ou changez-le dans Réglages → API graphique)."
  ru: "Графический драйвер Vulkan остановился при компиляции шейдеров. При следующем запуске игра перейдёт на OpenGL (или измените это в Настройки → Графический API)."
  uk: "Графічний драйвер Vulkan зупинився під час компіляції шейдерів. Під час наступного запуску гра перейде на OpenGL (або змініть це в Налаштування → Графічний API)."
  pl: "Sterownik graficzny Vulkan zatrzymał się podczas kompilowania shaderów. Przy następnym uruchomieniu gra przełączy się na OpenGL (albo zmień to w Ustawienia → API grafiki)."
"The system closed the game while it was running, typically because the device ran out of memory (RAM). Lowering texture resolution or reducing AI traffic in Settings helps prevent memory exhaustion.":
  nl: "Het systeem heeft het spel tijdens het spelen gesloten, meestal omdat het apparaat geen geheugen (RAM) meer had. Een lagere textuurresolutie of minder AI-verkeer in Instellingen helpt om dat te voorkomen."
  de: "Das System hat das Spiel während des Laufens beendet, meist weil dem Gerät der Arbeitsspeicher (RAM) ausging. Eine niedrigere Texturauflösung oder weniger KI-Verkehr in den Einstellungen hilft, das zu vermeiden."
  fr: "Le système a fermé le jeu en cours, généralement parce que l'appareil manquait de mémoire (RAM). Baisser la résolution des textures ou réduire la circulation IA dans les Réglages aide à l'éviter."
  ru: "Система закрыла игру во время работы — обычно потому, что устройству не хватило памяти (ОЗУ). Снизьте разрешение текстур или уменьшите ИИ-трафик в настройках, чтобы этого избежать."
  uk: "Система закрила гру під час роботи — зазвичай тому, що пристрою забракло пам'яті (ОЗП). Знизьте роздільність текстур або зменште ШІ-трафік у налаштуваннях, щоб цього уникнути."
  pl: "System zamknął działającą grę, zwykle dlatego, że w urządzeniu zabrakło pamięci (RAM). Niższa rozdzielczość tekstur lub mniejszy ruch SI w Ustawieniach pomagają temu zapobiec."
