  ru: "Редактор зеркал: перетаскивание/колесо = сдвиг/размер, стрелки = наклон, Alt+стрелки и PgUp/PgDn = сместить зеркало, -/+ = угол обзора, R = сброс (Shift+R: все), Insert/Delete/C = добавить/убрать/другое, Ctrl+Shift+M = готово"
  uk: "Редактор дзеркал: перетягування/коліщатко = зсув/розмір, стрілки = нахил, Alt+стрілки та PgUp/PgDn = змістити дзеркало, -/+ = поле зору, R = скинути (Shift+R: усі), Insert/Delete/C = додати/прибрати/інше, Ctrl+Shift+M = готово"
