  nl: "Spiegeleditor: slepen/wiel = verplaatsen/grootte, pijlen = richten, Alt+pijlen en PgUp/PgDn = spiegel verschuiven, -/+ = gezichtsveld, R = herstellen (Shift+R: alle), Insert/Delete/C = toevoegen/verwijderen/andere, Ctrl+Shift+M = klaar"
