"You have %{current}. Update now? The launcher downloads the new version (%{size}) from GitHub and Android installs it; openOMSI then starts again - your mods and settings stay as they are.":
  nl: "Je hebt %{current}. Nu bijwerken? De launcher downloadt de nieuwe versie (%{size}) van GitHub en Android installeert hem; daarna start openOMSI opnieuw - je mods en instellingen blijven zoals ze zijn."
  de: "Du hast %{current}. Jetzt aktualisieren? Der Launcher lädt die neue Version (%{size}) von GitHub, Android installiert sie; danach startet openOMSI neu - deine Mods und Einstellungen bleiben, wie sie sind."
  fr: "Vous avez %{current}. Mettre à jour maintenant ? Le lanceur télécharge la nouvelle version (%{size}) depuis GitHub et Android l'installe ; openOMSI redémarre ensuite - vos mods et réglages restent tels quels."
  ru: "У вас %{current}. Обновить сейчас? Лаунчер скачает новую версию (%{size}) с GitHub, Android установит её, и openOMSI запустится снова — моды и настройки останутся прежними."
  uk: "У вас %{current}. Оновити зараз? Лаунчер завантажить нову версію (%{size}) з GitHub, Android її встановить, і openOMSI запуститься знову — моди й налаштування залишаться як є."
  pl: "Masz %{current}. Zaktualizować teraz? Launcher pobierze nową wersję (%{size}) z GitHuba, a Android ją zainstaluje; potem openOMSI uruchomi się ponownie - twoje mody i ustawienia zostaną bez zmian."
"You have %{current}. Update now? The launcher downloads the new version (%{size}) from GitHub, puts it in place of this one and starts again - your mods and settings stay as they are.":
  nl: "Je hebt %{current}. Nu bijwerken? De launcher downloadt de nieuwe versie (%{size}) van GitHub, zet die in de plaats van deze en start opnieuw - je mods en instellingen blijven zoals ze zijn."
  de: "Du hast %{current}. Jetzt aktualisieren? Der Launcher lädt die neue Version (%{size}) von GitHub, setzt sie an die Stelle dieser und startet neu - deine Mods und Einstellungen bleiben, wie sie sind."
  fr: "Vous avez %{current}. Mettre à jour maintenant ? Le lanceur télécharge la nouvelle version (%{size}) depuis GitHub, la met à la place de celle-ci et redémarre - vos mods et réglages restent tels quels."
  ru: "У вас %{current}. Обновить сейчас? Лаунчер скачает новую версию (%{size}) с GitHub, поставит её вместо этой и перезапустится — моды и настройки останутся прежними."
