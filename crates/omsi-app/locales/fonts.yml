_version: 2
# The bus step's display fonts (crate::launcher::displayfont): what a chosen font changes on
# the bus, OMSI's .oft fonts and TrueType/OpenType ones, and the settings a font has on a
# display. The English text is the key, as in app.yml.

"the destination":
  nl: "de bestemming"
  de: "das Ziel"
  fr: "la destination"
  ru: "направление"
  uk: "напрямок"
  pl: "kierunek"
"the line number":
  nl: "het lijnnummer"
  de: "die Liniennummer"
  fr: "le numéro de ligne"
  ru: "номер маршрута"
  uk: "номер маршруту"
  pl: "numer linii"
"the side sign":
  nl: "het zijbord"
  de: "die Seitenanzeige"
  fr: "la girouette latérale"
  ru: "боковое табло"
  uk: "бокове табло"
  pl: "tablica boczna"
"the rear sign":
  nl: "het achterbord"
  de: "die Heckanzeige"
  fr: "la girouette arrière"
  ru: "заднее табло"
  uk: "заднє табло"
  pl: "tablica tylna"
"This bus's matrix script (%{script}) writes its destination and line number itself, in fonts it asks the game for by name: a chosen font takes their place there, each fitted to the height of the one it replaces.":
  nl: "Het matrixscript van deze bus (%{script}) schrijft de bestemming en het lijnnummer zelf, in lettertypes die het bij naam aan het spel vraagt: een gekozen lettertype neemt daar hun plaats in, telkens passend gemaakt op de hoogte van het lettertype dat het vervangt."
  de: "Das Matrix-Skript dieses Busses (%{script}) schreibt Ziel und Liniennummer selbst, in Schriften, die es beim Spiel über ihren Namen anfordert: Eine gewählte Schrift tritt dort an ihre Stelle, jeweils auf die Höhe der ersetzten Schrift angepasst."
  fr: "Le script de matrice de ce bus (%{script}) écrit lui-même la destination et le numéro de ligne, dans des polices qu'il demande au jeu par leur nom : une police choisie prend leur place, chaque fois ajustée à la hauteur de celle qu'elle remplace."
  ru: "Скрипт матрицы этого автобуса (%{script}) сам пишет направление и номер маршрута шрифтами, которые запрашивает у игры по имени: выбранный шрифт занимает их место, каждый раз подогнанный по высоте заменяемого."
  uk: "Скрипт матриці цього автобуса (%{script}) сам пише напрямок і номер маршруту шрифтами, які запитує в гри за назвою: вибраний шрифт займає їхнє місце, щоразу підігнаний за висотою того, який замінює."
  pl: "Skrypt matrycy tego autobusu (%{script}) sam wypisuje kierunek i numer linii czcionkami, o które prosi grę po nazwie: wybrana czcionka zajmuje tam ich miejsce, za każdym razem dopasowana do wysokości tej, którą zastępuje."
"It also changes %{what}.":
  nl: "Het verandert ook %{what}."
  de: "Außerdem ändert sie %{what}."
  fr: "Elle change aussi %{what}."
  ru: "Он также меняет %{what}."
  uk: "Він також змінює %{what}."
  pl: "Zmienia też: %{what}."
"The matrix's pictograms and clock keep their own.":
  nl: "De pictogrammen en de klok van de matrix houden hun eigen lettertype."
  de: "Piktogramme und Uhr der Matrix behalten ihre eigenen Schriften."
  fr: "Les pictogrammes et l'horloge de la matrice gardent les leurs."
  ru: "Пиктограммы и часы матрицы остаются своими."
  uk: "Піктограми й годинник матриці залишаються своїми."
  pl: "Piktogramy i zegar matrycy zachowują własne."
"Destinations its depot file gives as pictures stay pictures.":
  nl: "Bestemmingen die het depotbestand als afbeelding geeft, blijven afbeeldingen."
  de: "Ziele, die seine Hof-Datei als Bild liefert, bleiben Bilder."
  fr: "Les destinations que son fichier de dépôt fournit en image restent des images."
  ru: "Направления, которые файл депо задаёт картинками, остаются картинками."
  uk: "Напрямки, які файл депо задає картинками, залишаються картинками."
  pl: "Kierunki, które plik zajezdni podaje jako obrazy, pozostają obrazami."
"This bus draws its destination itself: a font changes only %{what}.":
  nl: "Deze bus tekent zijn bestemming zelf: een lettertype verandert alleen %{what}."
  de: "Dieser Bus zeichnet sein Ziel selbst: Eine Schrift ändert nur %{what}."
  fr: "Ce bus dessine lui-même sa destination : une police ne change que %{what}."
  ru: "Этот автобус сам рисует направление: шрифт меняет только %{what}."
  uk: "Цей автобус сам малює напрямок: шрифт змінює лише %{what}."
  pl: "Ten autobus sam rysuje kierunek: czcionka zmienia tylko: %{what}."
"A chosen font changes %{what}.":
  nl: "Een gekozen lettertype verandert %{what}."
  de: "Eine gewählte Schrift ändert %{what}."
  fr: "Une police choisie change %{what}."
  ru: "Выбранный шрифт меняет %{what}."
  uk: "Вибраний шрифт змінює %{what}."
  pl: "Wybrana czcionka zmienia: %{what}."
"The cab's and the saloon's displays (IBIS, printer, inside) keep their own fonts.":
  nl: "De displays van de cabine en het passagiersruim (IBIS, printer, binnen) houden hun eigen lettertypes."
  de: "Die Anzeigen am Fahrerplatz und im Fahrgastraum (IBIS, Drucker, innen) behalten ihre eigenen Schriften."
  fr: "Les afficheurs du poste de conduite et de l'habitacle (IBIS, imprimante, intérieur) gardent leurs propres polices."
  ru: "Дисплеи кабины и салона (IBIS, принтер, внутренние) сохраняют свои шрифты."
  uk: "Дисплеї кабіни й салону (IBIS, принтер, внутрішні) зберігають свої шрифти."
  pl: "Wyświetlacze kabiny i wnętrza (IBIS, drukarka, wewnętrzne) zachowują własne czcionki."
