"Copy a font into openOMSI's content folder: an OMSI .oft with its bitmaps, or a TrueType / OpenType font (.ttf, .otf, .ttc)":
  nl: "Een lettertype naar de contentmap van openOMSI kopiëren: een OMSI-.oft met zijn bitmaps, of een TrueType-/OpenType-lettertype (.ttf, .otf, .ttc)"
  de: "Eine Schrift in den Inhaltsordner von openOMSI kopieren: eine OMSI-.oft mit ihren Bitmaps oder eine TrueType-/OpenType-Schrift (.ttf, .otf, .ttc)"
  fr: "Copier une police dans le dossier de contenu d'openOMSI : un .oft d'OMSI avec ses bitmaps, ou une police TrueType / OpenType (.ttf, .otf, .ttc)"
  ru: "Скопировать шрифт в папку контента openOMSI: .oft из OMSI с его растровыми файлами или шрифт TrueType / OpenType (.ttf, .otf, .ttc)"
  uk: "Скопіювати шрифт у папку контенту openOMSI: .oft з OMSI з його растровими файлами або шрифт TrueType / OpenType (.ttf, .otf, .ttc)"
  pl: "Skopiuj czcionkę do folderu zawartości openOMSI: plik .oft z OMSI z jego bitmapami albo czcionkę TrueType / OpenType (.ttf, .otf, .ttc)"
"Reading the fonts…":
  nl: "Lettertypes worden gelezen…"
  de: "Schriften werden gelesen…"
  fr: "Lecture des polices…"
  ru: "Чтение шрифтов…"
  uk: "Читання шрифтів…"
  pl: "Wczytywanie czcionek…"
"Drawn on its %{n} displays in their own grid of %{rows} rows of dots, in place of %{font}.":
  nl: "Getekend op zijn %{n} displays in hun eigen raster van %{rows} rijen punten, in plaats van %{font}."
  de: "Auf seinen %{n} Anzeigen in deren eigenem Raster aus %{rows} Punktreihen gezeichnet, anstelle von %{font}."
  fr: "Dessinée sur ses %{n} afficheurs dans leur propre grille de %{rows} rangées de points, à la place de %{font}."
  ru: "Рисуется на его табло (%{n}) в их собственной сетке из %{rows} рядов точек вместо %{font}."
  uk: "Малюється на його табло (%{n}) у їхній власній сітці з %{rows} рядів точок замість %{font}."
  pl: "Rysowana na jego wyświetlaczach (%{n}) w ich własnej siatce z %{rows} rzędów punktów, zamiast %{font}."
"Drawn in the display's own grid of %{rows} rows of dots, in place of %{font}.":
  nl: "Getekend in het eigen raster van het display, %{rows} rijen punten, in plaats van %{font}."
  de: "Im eigenen Raster der Anzeige aus %{rows} Punktreihen gezeichnet, anstelle von %{font}."
  fr: "Dessinée dans la propre grille de l'afficheur, %{rows} rangées de points, à la place de %{font}."
  ru: "Рисуется в собственной сетке табло из %{rows} рядов точек вместо %{font}."
  uk: "Малюється у власній сітці табло з %{rows} рядів точок замість %{font}."
  pl: "Rysowana we własnej siatce wyświetlacza z %{rows} rzędów punktów, zamiast %{font}."
