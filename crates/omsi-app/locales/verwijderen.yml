_version: 2
# Deleting a bus company (crate::launcher::company: its settings and the confirmation). The
# English text is the key, as in app.yml.

"Delete the company":
  nl: "Bedrijf verwijderen"
  de: "Unternehmen löschen"
  fr: "Supprimer l'entreprise"
  ru: "Удалить компанию"
  uk: "Видалити компанію"
  pl: "Usuń firmę"
"The company is deleted for good: its buses, staff, lines, money and history. Your service record as a driver stays. This cannot be undone.":
  nl: "Het bedrijf wordt definitief verwijderd: de bussen, het personeel, de lijnen, het geld en de geschiedenis. Je staat van dienst als chauffeur blijft. Dit kan niet ongedaan worden gemaakt."
  de: "Das Unternehmen wird endgültig gelöscht: Busse, Personal, Linien, Geld und Geschichte. Deine Dienstakte als Fahrer bleibt. Das lässt sich nicht rückgängig machen."
  fr: "L'entreprise est supprimée définitivement : ses bus, son personnel, ses lignes, son argent et son historique. Vos états de service de conducteur restent. C'est irréversible."
  ru: "Компания удаляется навсегда: автобусы, персонал, линии, деньги и история. Ваш послужной список водителя остаётся. Это нельзя отменить."
  uk: "Компанію буде видалено назавжди: автобуси, персонал, лінії, гроші та історію. Ваш послужний список водія залишається. Це не можна скасувати."
  pl: "Firma zostanie usunięta na zawsze: autobusy, personel, linie, pieniądze i historia. Twój przebieg służby jako kierowcy zostaje. Tego nie da się cofnąć."
"Delete for good":
  nl: "Definitief verwijderen"
  de: "Endgültig löschen"
  fr: "Supprimer définitivement"
  ru: "Удалить навсегда"
  uk: "Видалити назавжди"
  pl: "Usuń na zawsze"
"Wait until the company's day is simulated.":
  nl: "Wacht tot de dag van het bedrijf is doorgerekend."
  de: "Warte, bis der Tag des Unternehmens berechnet ist."
  fr: "Attendez que la journée de l'entreprise soit simulée."
  ru: "Подождите, пока день компании будет рассчитан."
  uk: "Зачекайте, доки день компанії буде розраховано."
  pl: "Poczekaj, aż dzień firmy zostanie przeliczony."
"%{name} is deleted.":
  nl: "%{name} is verwijderd."
  de: "%{name} ist gelöscht."
  fr: "%{name} est supprimée."
  ru: "%{name} удалена."
  uk: "%{name} видалено."
  pl: "%{name} została usunięta."
