"A depot file of your own: the destinations and what each display shows, the IBIS's stops and routes, special and service trips. A line can choose it, and every bus that drives the line gets it.":
  nl: "Een eigen hof-bestand: de bestemmingen en wat elk display toont, de haltes en routes van de IBIS, speciale ritten en dienstritten. Een lijn kan het kiezen, en elke bus die de lijn rijdt krijgt het."
  de: "Eine eigene Hofdatei: die Ziele und was jede Anzeige zeigt, die Haltestellen und Routen des IBIS, Sonder- und Betriebsfahrten. Eine Linie kann sie wählen, und jeder Bus, der die Linie fährt, bekommt sie."
  fr: "Un fichier de dépôt à vous : les destinations et ce qu’affiche chaque girouette, les arrêts et itinéraires de l’IBIS, services spéciaux et trajets de service. Une ligne peut le choisir, et chaque bus qui la dessert le reçoit."
  ru: "Собственный файл депо: пункты назначения и что показывает каждое табло, остановки и маршруты IBIS, специальные и служебные рейсы. Линия может выбрать его, и каждый автобус на ней его получит."
  uk: "Власний файл депо: пункти призначення і що показує кожне табло, зупинки й маршрути IBIS, спеціальні та службові рейси. Лінія може обрати його, і кожен автобус на ній його отримає."
  pl: "Własny plik zajezdni: cele i to, co pokazuje każdy wyświetlacz, przystanki i trasy IBIS, kursy specjalne i przejazdy służbowe. Linia może go wybrać, a każdy autobus na niej go dostanie."
"Your own depot files: the destinations and what every display shows, the IBIS's stops and routes, special and service trips. A line chooses one, and every bus that drives it gets it.":
  nl: "Je eigen hof-bestanden: de bestemmingen en wat elk display toont, de haltes en routes van de IBIS, speciale ritten en dienstritten. Een lijn kiest er een, en elke bus die hem rijdt krijgt het."
  de: "Deine eigenen Hofdateien: die Ziele und was jede Anzeige zeigt, die Haltestellen und Routen des IBIS, Sonder- und Betriebsfahrten. Eine Linie wählt eine, und jeder Bus, der sie fährt, bekommt sie."
  fr: "Vos propres fichiers de dépôt : les destinations et ce qu’affiche chaque girouette, les arrêts et itinéraires de l’IBIS, services spéciaux et trajets de service. Une ligne en choisit un, et chaque bus qui la dessert le reçoit."
  ru: "Ваши собственные файлы депо: пункты назначения и что показывает каждое табло, остановки и маршруты IBIS, специальные и служебные рейсы. Линия выбирает один, и каждый автобус на ней его получает."
  uk: "Ваші власні файли депо: пункти призначення і що показує кожне табло, зупинки й маршрути IBIS, спеціальні та службові рейси. Лінія обирає один, і кожен автобус на ній його отримує."
  pl: "Twoje własne pliki zajezdni: cele i to, co pokazuje każdy wyświetlacz, przystanki i trasy IBIS, kursy specjalne i przejazdy służbowe. Linia wybiera jeden, a każdy autobus na niej go dostaje."
