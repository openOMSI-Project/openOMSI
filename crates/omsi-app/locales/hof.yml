"A depot file tells the buses' IBIS and destination displays what to show. Make one of your own: start from the map's depot file, one of the bus's or an empty one, and give its destinations, stops and routes the texts you want - each display's shown as it lights up. A line chooses it in the line editor under Displays, and every bus that drives the line is given it; chosen on the bus step, it goes to any bus, for a special or a service trip.":
  nl: "Een hof-bestand vertelt de IBIS en de bestemmingsdisplays van de bussen wat ze tonen. Maak er zelf een: begin met het hof-bestand van de kaart, een van de bus of een leeg, en geef de bestemmingen, haltes en routes de teksten die je wilt - elk display zie je zoals het oplicht. Een lijn kiest het in de lijneditor onder Displays, en elke bus die de lijn rijdt krijgt het; gekozen bij de busstap gaat het naar elke bus, voor een speciale rit of een dienstrit."
  de: "Eine Hofdatei sagt dem IBIS und den Zielanzeigen der Busse, was sie zeigen. Mach dir eine eigene: aus der Hofdatei der Karte, einer des Busses oder einer leeren, und gib ihren Zielen, Haltestellen und Routen die Texte, die du willst - jede Anzeige siehst du, wie sie leuchtet. Eine Linie wählt sie im Linieneditor unter Anzeigen, und jeder Bus, der die Linie fährt, bekommt sie; im Busschritt gewählt, geht sie an jeden Bus, für eine Sonderfahrt oder eine Betriebsfahrt."
  fr: "Un fichier de dépôt dit à l’IBIS et aux girouettes des bus quoi afficher. Créez le vôtre : à partir du fichier de dépôt de la carte, de l’un de ceux du bus ou d’un fichier vide, et donnez à ses destinations, arrêts et itinéraires les textes voulus - chaque girouette s’affiche telle qu’elle s’allume. Une ligne le choisit dans l’éditeur de lignes sous Girouettes, et chaque bus qui la dessert le reçoit ; choisi à l’étape du bus, il va à n’importe quel bus, pour un service spécial ou un trajet de service."
  ru: "Файл депо говорит IBIS и табло автобусов, что показывать. Создайте свой: из файла депо карты, одного из файлов автобуса или пустого, и задайте пунктам назначения, остановкам и маршрутам нужные тексты - каждое табло видно таким, каким оно светится. Линия выбирает его в редакторе линий в разделе «Табло», и каждый автобус на этой линии получает его; выбранный на шаге автобуса, он идёт любому автобусу - для специального или служебного рейса."
  uk: "Файл депо каже IBIS і табло автобусів, що показувати. Створіть свій: з файлу депо мапи, одного з файлів автобуса або порожнього, і задайте пунктам призначення, зупинкам і маршрутам потрібні тексти - кожне табло видно таким, яким воно світиться. Лінія обирає його в редакторі ліній у розділі «Табло», і кожен автобус на цій лінії отримує його; обраний на кроці автобуса, він іде будь-якому автобусу - для спеціального чи службового рейсу."
  pl: "Plik zajezdni mówi IBIS-owi i wyświetlaczom autobusów, co pokazać. Zrób własny: z pliku zajezdni mapy, jednego z plików autobusu albo pustego, i nadaj celom, przystankom i trasom teksty, jakie chcesz - każdy wyświetlacz widać tak, jak się świeci. Linia wybiera go w edytorze linii w zakładce Wyświetlacze, a każdy autobus jeżdżący na linii go dostaje; wybrany w kroku autobusu trafia do dowolnego autobusu, na kurs specjalny lub przejazd służbowy."
