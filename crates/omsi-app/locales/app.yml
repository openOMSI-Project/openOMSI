  zh: "你启动的游戏,以及与你一起驾驶的人。"
  hi: "आपके शुरू किए गए गेम, और आपके साथ कौन चला रहा है।"
  zh-tw: "你啟動的遊戲，以及一同駕駛的玩家。"
"No game is running. Start a duty on the Drive page; to drive with friends, turn on hosting on the Multiplayer page and give them the code shown here.":
  ca: "No hi ha cap partida en marxa. Inicia un servei a Condueix; per conduir amb amics, activa l'allotjament a Multijugador i dona'ls el codi que apareix aquí."
  ru: "Игра не запущена. Начните смену на странице «Поездка»; чтобы ездить с друзьями, включите хостинг на странице «Мультиплеер» и дайте им код, который появится здесь."
  de: "Kein Spiel läuft. Starte einen Dienst auf der Seite Fahren; um mit Freunden zu fahren, schalte auf der Seite Mehrspieler das Hosten ein und gib ihnen den Code, der hier erscheint."
  fr: "Aucune partie en cours. Lancez un service sur la page Conduire ; pour rouler avec des amis, activez l'hébergement sur la page Multijoueur et donnez-leur le code affiché ici."
  uk: "Жодна гра не запущена. Почніть наряд на сторінці «Їхати»; щоб грати з друзями, увімкніть хостинг на сторінці «Мультиплеєр» і дайте їм код, показаний тут."
  be: "Ніводная гульня не запушчана. Пачніце наряд на старонцы «Ехаць»; каб гуляць з сябрамі, уключыце хостынг на старонцы «Мультыплеер» і дайце ім код, паказаны тут."
  kk: "Ешқандай ойын жұмыс істемейді. Жүру бетінде нарядты бастаңыз; достармен жүру үшін Мультиплеер бетінде хостингті қосып, осында көрсетілген кодты беріңіз."
  pl: "Żadna gra nie działa. Rozpocznij służbę na stronie Jedź; aby jechać ze znajomymi, włącz hosting na stronie Multiplayer i podaj kod widoczny tutaj."
  cs: "Neběží žádná hra. Spusťte službu na stránce Jet; pro jízdu s kamarády zapněte hostování na stránce Multiplayer a dejte jim kód zobrazený tady."
  hu: "Nem fut játékmenet. Indíts szolgálatot a Vezetés oldalon; barátokkal vezetéshez kapcsold be a létrehozást a Többjátékos oldalon, és add oda az itt látható kódot."
  es: "No hay ninguna partida en marcha. Inicia un servicio en la página Conducir; para jugar con amigos, activa el alojamiento en la página Multijugador y dales el código que se muestra aquí."
  pt: "Nenhum jogo em andamento. Inicie uma escala na página Dirigir; para jogar com amigos, ative a hospedagem na página Multijogador e dê a eles o código mostrado aqui."
  pt-pt: "Nenhum jogo em andamento. Inicie uma escala na página Conduzir; para jogar com amigos, ative a hospedagem na página Multijogador e dê a eles o código mostrado aqui."
  it: "Nessun gioco in esecuzione. Avvia un turno nella pagina Guida; per guidare con gli amici, attiva l'hosting nella pagina Multigiocatore e dai loro il codice mostrato qui."
  nl: "Er draait geen spel. Start een dienst op de pagina Rijden; om met vrienden te rijden zet je hosten aan op de pagina Multiplayer en geef je hen de code die hier staat."
  tr: "Çalışan oyun yok. Sürüş sayfasında bir görev başlatın; arkadaşlarla sürmek için Çok Oyunculu sayfasında sunucu olmayı açın ve burada görünen kodu onlara verin."
  ja: "起動中のゲームはありません。「運転」ページで乗務を開始してください。友達と運転するには、マルチプレイページでホストをオンにし、ここに表示されるコードを渡します。"
  zh: "没有正在运行的游戏。请在“驾驶”页面开始任务;要与朋友一起驾驶,请在“多人游戏”页面开启主机,并把此处显示的会话码告诉他们。"
  hi: "कोई गेम नहीं चल रहा। ड्राइव पेज पर ड्यूटी शुरू करें; दोस्तों के साथ चलाने के लिए मल्टीप्लेयर पेज पर होस्टिंग चालू करें और यहाँ दिखा कोड उन्हें दें।"
  zh-tw: "目前沒有執行中的遊戲。請在「駕駛」頁面開始更次；若要與朋友一同駕駛，請在「多人遊戲」頁面開啟主機功能，並提供此處顯示的連線碼。"
