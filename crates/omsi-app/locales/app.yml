  es: "Configurado: pulsa Guardar para conservarlo (a los botones se les pueden dar sus teclas abajo)."
  pt: "Configurado: pressione Salvar para manter (os botões podem receber suas teclas abaixo)."
  pt-pt: "Configurado: prima Guardar para manter (os botões podem receber suas teclas abaixo)."
  it: "Configurato: premi Salva per mantenere (ai pulsanti si possono assegnare i tasti qui sotto)."
