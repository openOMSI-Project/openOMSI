"Manual gearbox in neutral: 1-5 select a gear (R reverse, N neutral); the clutch works itself unless auto_clutch=0":
  ca: "Canvi manual en punt mort: 1-5 trien la marxa (R per a marxa enrere, N per a punt mort); l'embragatge és automàtic llevat que auto_clutch=0"
  ru: "Механическая КПП в нейтрали: 1-5 выбирают передачу (R — задний ход, N — нейтраль); сцепление работает само, если не задано auto_clutch=0"
  de: "Schaltgetriebe im Leerlauf: 1-5 wählen einen Gang (R Rückwärts, N Leerlauf); die Kupplung arbeitet selbst, außer bei auto_clutch=0"
  fr: "Boîte manuelle au point mort : 1-5 choisissent un rapport (R marche arrière, N neutre) ; l'embrayage agit seul sauf si auto_clutch=0"
  uk: "Механічна коробка на нейтралі: 1-5 вибирають передачу (R - задня, N - нейтраль); зчеплення працює саме, якщо не auto_clutch=0"
  be: "Механічная каробка на нейтралі: 1-5 выбіраюць перадачу (R - задняя, N - нейтраль); счапленне працуе само, калі не auto_clutch=0"
  kk: "Бейтарап күйдегі қолмен қорап: 1-5 берілісті таңдайды (R артқа, N бейтарап); ілініс auto_clutch=0 болмаса өзі жұмыс істейді"
  pl: "Ręczna skrzynia na luzie: 1-5 wybiera bieg (R wsteczny, N luz); sprzęgło działa samo, chyba że auto_clutch=0"
  cs: "Manuální převodovka na neutrálu: 1-5 volí převod (R zpátečka, N neutrál); spojka funguje sama, pokud není auto_clutch=0"
  hu: "Kézi váltó üresben: 1-5 fokozatot választ (R hátramenet, N üres); a tengelykapcsoló magától működik, hacsak nincs auto_clutch=0"
  es: "Caja manual en punto muerto: 1-5 eligen marcha (R marcha atrás, N punto muerto); el embrague va solo salvo auto_clutch=0"
  pt: "Câmbio manual em ponto morto: 1-5 escolhem a marcha (R ré, N neutro); a embreagem funciona sozinha, exceto com auto_clutch=0"
  pt-pt: "Câmbio manual em ponto morto: 1-5 escolhem a marcha (R ré, N neutro); a embreagem funciona sozinha, exceto com auto_clutch=0"
  it: "Cambio manuale in folle: 1-5 scelgono una marcia (R retromarcia, N folle); la frizione funziona da sola salvo auto_clutch=0"
  nl: "Handgeschakelde bak in neutraal: 1-5 kiezen een versnelling (R achteruit, N neutraal); de koppeling werkt vanzelf tenzij auto_clutch=0"
  tr: "Manuel vites boşta: 1-5 vites seçer (R geri, N boş); auto_clutch=0 değilse debriyaj kendiliğinden çalışır"
  ja: "マニュアルトランスミッションがニュートラル時:1~5でギアを選択(Rでリバース、Nでニュートラル)。auto_clutch=0でなければクラッチは自動で動作します"
  zh: "手动变速箱空档时:1-5选择档位(R倒档,N空档);除非auto_clutch=0,否则离合器自动工作"
  hi: "मैनुअल गियरबॉक्स न्यूट्रल में: 1-5 से गियर चुनें (R रिवर्स, N न्यूट्रल); auto_clutch=0 न हो तो क्लच अपने आप काम करता है"
  zh-tw: "手排變速箱處於空檔：1-5 檔選擇檔位（R 為倒檔，N 為空檔）；除非 auto_clutch=0，否則離合器會自動運作"
