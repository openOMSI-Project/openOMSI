"Graphics, sound, controllers and game settings go back to how they came. The language, the drivers, the key bindings and the game folder stay.":
  ca: "Els gràfics, el so, els dispositius i els ajustos del joc tornen als valors originals. Es mantenen l'idioma, els conductors, les assignacions de tecles i la carpeta del joc."
  ru: "Настройки графики, звука, контроллеров и игры вернутся к исходным. Язык, водители, назначения клавиш и папка игры сохранятся."
  de: "Grafik, Ton, Controller und Spieleinstellungen werden auf den Ausgangszustand zurückgesetzt. Sprache, Fahrer, Tastenbelegung und Spielordner bleiben erhalten."
  fr: "Les réglages graphiques, sonores, des manettes et du jeu reviennent à leur état d'origine. La langue, les conducteurs, les touches et le dossier du jeu sont conservés."
  uk: "Графіка, звук, контролери й налаштування гри повертаються до початкових. Мова, водії, прив'язки клавіш і тека гри залишаються."
  be: "Графіка, гук, кантролеры і налады гульні вяртаюцца да пачатковых. Мова, вадзіцелі, прывязкі клавіш і тэчка гульні застаюцца."
  kk: "Графика, дыбыс, контроллерлер және ойын баптаулары бастапқы күйіне қайтады. Тіл, жүргізушілер, перне тағайындаулары және ойын қалтасы қалады."
  pl: "Grafika, dźwięk, kontrolery i ustawienia gry wracają do stanu początkowego. Język, kierowcy, przypisania klawiszy i folder gry zostają."
  cs: "Grafika, zvuk, ovladače a nastavení hry se vrátí do původního stavu. Jazyk, řidiči, klávesové zkratky a složka hry zůstanou."
  hu: "A grafika, a hang, a vezérlők és a játékbeállítások visszaállnak az eredetire. A nyelv, a sofőrök, a billentyűkiosztás és a játékmappa megmarad."
  es: "Los gráficos, el sonido, los mandos y los ajustes del juego vuelven a como venían. El idioma, los conductores, las teclas y la carpeta del juego se conservan."
  pt: "Gráficos, som, controles e configurações do jogo voltam ao original. O idioma, os motoristas, as teclas e a pasta do jogo são mantidos."
  pt-pt: "Gráficos, som, controlos e definições do jogo voltam ao original. O idioma, os condutores, as teclas e a pasta do jogo são mantidos."
  it: "Grafica, audio, controller e impostazioni di gioco tornano come all'origine. Restano lingua, conducenti, tasti e cartella del gioco."
  nl: "Beeld, geluid, controllers en spelinstellingen worden teruggezet. Taal, bestuurders, toetsen en de spelmap blijven behouden."
  tr: "Grafik, ses, kumanda ve oyun ayarları ilk haline döner. Dil, sürücüler, tuş atamaları ve oyun klasörü korunur."
  ja: "グラフィックス、サウンド、コントローラー、ゲーム設定を初期状態に戻します。言語、運転手、キー割り当て、ゲームフォルダはそのままです。"
  zh: "图形、声音、控制器和游戏设置将恢复为初始状态。语言、司机、按键绑定和游戏文件夹保持不变。"
  hi: "ग्राफ़िक्स, साउंड, कंट्रोलर और गेम सेटिंग्स पहले जैसी हो जाएँगी। भाषा, ड्राइवर, की बाइंडिंग और गेम फ़ोल्डर बने रहेंगे।"
  zh-tw: "圖形、音效、控制器及遊戲設定將恢復為初始設定。語言、司機資料、按鍵綁定及遊戲資料夾將會保留。"
