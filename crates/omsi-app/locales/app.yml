"Nothing installed since the launcher started. Big archives are checked against the free disk space before anything is unpacked; a cancelled or failed install leaves nothing behind.":
  ca: "No s'ha instal·lat res des que s'ha iniciat el launcher. Abans de descomprimir arxius grans es comprova l'espai lliure; una instal·lació cancel·lada o fallida no deixa restes."
  ru: "С момента запуска лаунчера ничего не установлено. Большие архивы проверяются на свободное место перед распаковкой; отменённая или неудачная установка ничего не оставляет."
  de: "Seit dem Start des Launchers nichts installiert. Große Archive werden vor dem Entpacken mit dem freien Speicher verglichen; eine abgebrochene oder fehlgeschlagene Installation hinterlässt nichts."
  fr: "Rien d'installé depuis le lancement. Les grosses archives sont comparées à l'espace libre avant décompression ; une installation annulée ou échouée ne laisse rien."
  uk: "Від запуску лаунчера нічого не встановлено. Великі архіви перевіряються на вільне місце на диску до розпакування; скасоване чи невдале встановлення нічого не залишає."
  be: "З моманту запуску лаўнчара нічога не ўсталявана. Вялікія архівы правяраюцца на вольнае месца на дыску перад распакаваннем; скасаваная ці няўдалая ўсталёўка нічога не пакідае."
  kk: "Лаунчер іске қосылғаннан бері ештеңе орнатылған жоқ. Үлкен архивтер ашылмас бұрын бос диск орнына сәйкес тексеріледі; бас тартылған не сәтсіз орнату ештеңе қалдырмайды."
  pl: "Od uruchomienia launchera nic nie zainstalowano. Duże archiwa są sprawdzane pod kątem wolnego miejsca na dysku przed rozpakowaniem; anulowana lub nieudana instalacja niczego nie zostawia."
  cs: "Od spuštění launcheru nebylo nic nainstalováno. Velké archivy se před rozbalením zkontrolují proti volnému místu na disku; zrušená nebo selhaná instalace nic nezanechá."
  hu: "Az indító elindítása óta nem települt semmi. A nagy archívumokat kicsomagolás előtt ellenőrizzük, hogy van-e nekik elég szabad hely a lemezen; a megszakított vagy sikertelen telepítés semmit nem hagy a lemezen."
  es: "No se ha instalado nada desde que arrancó el lanzador. Los archivos grandes se comparan con el espacio libre en disco antes de descomprimir; una instalación cancelada o fallida no deja nada."
  pt: "Nada foi instalado desde que o launcher iniciou. Arquivos grandes são conferidos com o espaço livre em disco antes de descompactar; uma instalação cancelada ou com falha não deixa nada."
  pt-pt: "Nada foi instalado desde que o launcher iniciou. Ficheiros grandes são conferidos com o espaço livre em disco antes de descompactar; uma instalação cancelada ou com falha não deixa nada."
  it: "Nulla installato dall'avvio del launcher. Gli archivi grandi vengono confrontati con lo spazio libero su disco prima di essere estratti; un'installazione annullata o fallita non lascia nulla."
  nl: "Sinds het starten van de launcher is niets geïnstalleerd. Grote archieven worden vóór het uitpakken getoetst aan de vrije schijfruimte; een geannuleerde of mislukte installatie laat niets achter."
  tr: "Başlatıcı açıldığından beri hiçbir şey kurulmadı. Büyük arşivler açılmadan önce boş disk alanına göre denetlenir; iptal edilen veya başarısız olan kurulum geride hiçbir şey bırakmaz."
  ja: "ランチャー起動後にインストールしたものはありません。大きなアーカイブは、展開する前に空きディスク容量が確認されます。キャンセルまたは失敗したインストールは何も残しません。"
  zh: "自启动器以来尚未安装任何内容。大型压缩包在解压前会检查可用磁盘空间;取消或失败的安装不会留下任何残留。"
  hi: "लॉन्चर शुरू होने के बाद कुछ इंस्टॉल नहीं हुआ। बड़े आर्काइव खोलने से पहले खाली डिस्क स्पेस से जाँचे जाते हैं; रद्द या विफल इंस्टॉल कुछ भी पीछे नहीं छोड़ता।"
  zh-tw: "自啟動器啟動以來尚未安裝任何內容。大型壓縮檔在解壓前會先檢查可用磁碟空間；取消或失敗的安裝不會留下任何殘留檔案。"
