"Free driving: the bus starts where you chose, with the traffic and the timetable's buses around it, but no line of your own.":
  ca: "Conducció lliure: l'autobús comença on has triat, amb el trànsit i els autobusos programats al voltant, però sense línia pròpia."
  ru: "Свободная езда: автобус начинает там, где вы выбрали, вокруг движение и автобусы по расписанию, но без своего маршрута."
  de: "Freie Fahrt: der Bus startet am gewählten Ort, mit Verkehr und Fahrplanbussen, aber ohne eigene Linie."
  fr: "Conduite libre : le bus part où vous l'avez choisi, avec la circulation et les bus du réseau, mais sans ligne à vous."
  uk: "Вільна поїздка: автобус стартує там, де ви вибрали, з рухом і автобусами за розкладом навколо, але без власної лінії."
  be: "Свабодная язда: аўтобус стартуе там, дзе вы абралі, з рухам і аўтобусамі па раскладзе вакол, але без уласнай лініі."
  kk: "Еркін жүру: автобус сіз таңдаған жерден бастайды, айналада қозғалыс пен кестелік автобустар жүреді, бірақ өз желіңіз болмайды."
  pl: "Jazda swobodna: autobus startuje tam, gdzie wybierzesz, wśród ruchu i autobusów rozkładowych, ale bez własnej linii."
  cs: "Volná jízda: autobus začne na vybraném místě, kolem něj je provoz a autobusy podle jízdního řádu, ale žádná vlastní linka."
  hu: "Szabad vezetés: a busz a választott helyen indul, körülötte forgalommal és menetrend szerinti buszokkal, de aktív menetrend nélkül."
  es: "Conducción libre: el autobús empieza donde elijas, con el tráfico y los autobuses del horario a su alrededor, pero sin línea propia."
  pt: "Direção livre: o ônibus começa no local escolhido, com o trânsito e os ônibus do horário ao redor, mas sem uma linha própria."
  pt-pt: "Condução livre: o autocarro começa no local escolhido, com o trânsito e os autocarros do horário à volta, mas sem uma linha própria."
  it: "Guida libera: il bus parte dove hai scelto, con il traffico e i bus di linea intorno, ma senza una linea tua."
  nl: "Vrij rijden: de bus start waar je kiest, met verkeer en dienstbussen eromheen, maar zonder eigen lijn."
  tr: "Serbest sürüş: otobüs seçtiğiniz yerden başlar, çevresinde trafik ve tarifedeki otobüsler bulunur, ancak kendinize ait bir hat yoktur."
  ja: "フリードライブ:選んだ場所からバスが出発します。周囲には一般車両と時刻表のバスが走りますが、専用の系統はありません。"
  zh: "自由驾驶:巴士从你选择的位置出发,周围有交通车辆和时刻表巴士,但没有属于自己的线路。"
  hi: "फ़्री ड्राइविंग: बस आपकी चुनी जगह से शुरू होती है, आसपास ट्रैफ़िक और टाइमटेबल की बसें होती हैं, लेकिन आपकी अपनी कोई लाइन नहीं होती।"
  zh-tw: "自由駕駛：巴士會在你選定的位置出發，周圍仍有交通及按時間表運行的巴士，但你不會獲編配路線。"
  ko: "자유 운전: 선택한 위치에서 출발하며 주변에 교통과 시간표 버스가 있지만 본인 노선은 없습니다."
  th: "ขับอิสระ: รถเริ่มจากจุดที่เลือก มีรถอื่นและรถตามตารางเวลาอยู่รอบ ๆ แต่ไม่มีสายรถของคุณเอง"
  vi: "Lái tự do: xe bắt đầu tại vị trí đã chọn, xung quanh vẫn có xe cộ và xe theo lịch trình, nhưng bạn không có tuyến riêng."
  id: "Mengemudi bebas: bus mulai dari lokasi pilihan Anda dengan lalu lintas dan bus terjadwal, tetapi tanpa rute Anda sendiri."
  ms: "Pemanduan bebas: bas bermula di lokasi pilihan, dengan trafik dan bas berjadual di sekeliling, tetapi tanpa laluan sendiri."
  tl: "Malayang pagmamaneho: magsisimula ang bus sa napili mong lugar, may trapiko at mga naka-iskedyul na bus, pero wala kang sariling ruta."
