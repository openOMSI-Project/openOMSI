"Your friend pastes it into LAN play → Join - at home or anywhere on the internet.":
  ca: "El teu amic l'enganxa a Joc en xarxa local → Uneix-t'hi, a casa o des de qualsevol lloc d'internet."
  ru: "Друг вставляет его в «Игра по сети → Присоединиться» - дома или где угодно через интернет."
  de: "Dein Freund fügt ihn bei Netzwerkspiel → Beitreten ein - zu Hause oder irgendwo im Internet."
  fr: "Votre ami le colle dans Jeu en réseau → Rejoindre - à la maison ou n'importe où sur Internet."
  uk: "Друг вставляє його в «Гра по LAN» → «Приєднатися» - вдома або будь-де в інтернеті."
  be: "Сябар устаўляе яго ў «Гульня па LAN» → «Далучыцца» - дома або дзе заўгодна ў інтэрнэце."
  kk: "Досыңыз оны LAN ойыны → Қосылу өрісіне қояды - үйде немесе интернеттегі кез келген жерде."
  pl: "Znajomy wkleja go w Gra w sieci LAN → Dołącz - w domu lub gdziekolwiek w internecie."
  cs: "Kamarád ho vloží do Hra po LAN → Připojit - doma nebo kdekoli na internetu."
  hu: "A barátod beilleszti a LAN-játék → Csatlakozás mezőbe - otthon vagy bárhol az interneten."
  es: "Tu amigo lo pega en Juego en LAN → Unirse, en casa o desde cualquier lugar de internet."
  pt: "Seu amigo cola em Jogo em LAN → Entrar, em casa ou de qualquer lugar da internet."
  pt-pt: "Seu amigo cola em Jogo em LAN → Entrar, em casa ou de qualquer lugar da internet."
  it: "Il tuo amico lo incolla in Gioco LAN → Unisciti - a casa o ovunque su internet."
  nl: "Je vriend plakt die bij LAN-spel → Deelnemen - thuis of waar dan ook op internet."
  tr: "Arkadaşınız bunu LAN oyunu → Katıl alanına yapıştırır - evde veya internette herhangi bir yerde."
  ja: "友達はそれを LANプレイ → 参加 に貼り付けます。自宅でもインターネット越しでも使えます。"
  zh: "朋友将其粘贴到 局域网游戏 → 加入——在家里或互联网上任何地方均可。"
  hi: "आपका दोस्त इसे LAN प्ले → Join में पेस्ट करता है - घर पर या इंटरनेट पर कहीं भी।"
  zh-tw: "朋友只需將其貼上至「區域網絡遊戲 → 加入」——在家中或互聯網上的任何地方均可。"
