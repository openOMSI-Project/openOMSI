  de: "Android fragt, ob openOMSI aktualisiert werden soll: Tippe dort auf „Aktualisieren“. Danach startet die App von selbst neu."
  fr: "Android demande s'il faut mettre à jour openOMSI : appuyez sur Mettre à jour. L'appli redémarre ensuite toute seule."
  uk: "Android запитає, чи оновити openOMSI: натисніть там «Оновити». Потім застосунок запуститься знову сам."
  be: "Android запытае, ці абнавіць openOMSI: націсніце там «Абнавіць». Потым праграма запусціцца зноў сама."
  kk: "Android openOMSI жаңартуды сұрайды: сол жерде Жаңарту түймесін басыңыз. Содан кейін қолданба өзі қайта іске қосылады."
  pl: "Android zapyta, czy zaktualizować openOMSI: naciśnij tam Aktualizuj. Aplikacja uruchomi się potem sama."
  cs: "Android se zeptá, zda aktualizovat openOMSI: stiskněte tam Aktualizovat. Aplikace se pak sama znovu spustí."
  hu: "Az Android megkérdezi, frissítsen-e az openOMSI: nyomd meg a Frissítés gombot. Az alkalmazás ezután magától újraindul."
  es: "Android pregunta si actualizar openOMSI: pulsa Actualizar. Después la app se inicia sola de nuevo."
  pt: "O Android pergunta se deseja atualizar o openOMSI: toque em Atualizar. Depois o app reinicia sozinho."
  pt-pt: "O Android pergunta se deseja atualizar o openOMSI: toque em Atualizar. Depois o app reinicia sozinho."
  it: "Android chiede se aggiornare openOMSI: premi Aggiorna. L'app poi riparte da sola."
  nl: "Android vraagt of openOMSI moet worden bijgewerkt: druk daar op Bijwerken. De app start daarna vanzelf opnieuw."
  tr: "Android openOMSI'nin güncellenip güncellenmeyeceğini sorar: orada Güncelle'ye basın. Uygulama sonra kendiliğinden yeniden başlar."
  ja: "AndroidがopenOMSIを更新するか尋ねます:そこで「更新」を押してください。その後アプリは自動的に再起動します。"
  zh: "Android会询问是否更新openOMSI:请在那里点“更新”。之后应用会自动重新启动。"
  hi: "Android पूछेगा कि openOMSI अपडेट करना है या नहीं: वहाँ Update दबाएँ। फिर ऐप अपने आप दोबारा शुरू हो जाएगा।"
  zh-tw: "Android 會詢問是否更新 openOMSI：請在該處按「更新」。隨後應用程式會自行重新啟動。"
