"If the wheel barely moves, increase Test strength and retry. Keep your hands clear.":
  ca: "Si el volant gairebé no es mou, augmenta la intensitat de la prova i torna-ho a provar. Mantén les mans allunyades."
  de: "Wenn sich das Lenkrad kaum bewegt, erhöhe die Teststärke und versuche es erneut. Halte deine Hände fern."
  pt: "Se o volante quase não se mover, aumente a Força do teste e tente novamente. Mantenha as mãos afastadas."
  pt-pt: "Se o volante quase não se mover, aumente a Força do teste e tente novamente. Mantenha as mãos afastadas."
  zh: "如果方向盘几乎不动,请增大测试力度并重试。请将您的双手远离方向盘。"
  pl: "Jeśli kierownica ledwo się porusza, zwiększ siłę testu i spróbuj ponownie. Trzymaj ręce z dala od kierownicy."
  fr: "Si le volant bouge à peine, augmentez la force du test et réessayez. Gardez les mains à l'écart."
  zh-tw: "如果方向盤幾乎不動，請提高測試強度後重試。請讓雙手保持遠離。"

"The wheel did not move enough. Retry or choose the direction manually.":
  ca: "El volant no s'ha mogut prou. Torna-ho a provar o tria el sentit manualment."
  de: "Das Lenkrad hat sich nicht ausreichend bewegt. Wiederhole den Test oder wähle die Richtung manuell."
  pt: "O volante não se moveu o suficiente. Tente novamente ou escolha a direção manualmente."
  pt-pt: "O volante não se moveu o suficiente. Tente novamente ou escolha a direção manualmente."
  zh: "方向盘移动的幅度不够。请重试或手动选择方向。"
  pl: "Kierownica nie poruszyła się wystarczająco. Spróbuj ponownie lub wybierz kierunek ręcznie."
  fr: "Le volant n'a pas assez bougé. Réessayez ou choisissez le sens manuellement."
  zh-tw: "方向盤移動幅度不足。請重試或手動選擇方向。"

"Direction detected: normal":
  ca: "Sentit detectat: normal"
  de: "Richtung erkannt: normal"
  pt: "Direção detectada: normal"
  pt-pt: "Direção detetada: normal"
  zh: "检测到的方向:正常"
  pl: "Wykryty kierunek: normalny"
  fr: "Sens détecté : normal"
  zh-tw: "偵測到的方向：正常"

"Direction detected: inverted":
  ca: "Sentit detectat: invertit"
  de: "Richtung erkannt: invertiert"
  pt: "Direção detectada: invertida"
  pt-pt: "Direção detetada: invertida"
  zh: "检测到的方向:反转"
  pl: "Wykryty kierunek: odwrócony"
  fr: "Sens détecté : inversé"
  zh-tw: "偵測到的方向：反轉"

"Testing: keep your hands off the wheel…":
  ca: "Provant: mantén les mans fora del volant…"
  de: "Test läuft: Lenkrad nicht anfassen…"
  pt: "Testando: mantenha as mãos longe do volante…"
  pt-pt: "A testar: mantenha as mãos afastadas do volante…"
  zh: "正在测试:请勿握住方向盘…"
  pl: "Test trwa: nie dotykaj kierownicy…"
  fr: "Test en cours : ne touchez pas le volant…"
  zh-tw: "測試：雙手遠離方向盤…"

"If detection is inconclusive, retry or choose the direction manually. You can change it later on this device's page.":
  ca: "Si la detecció no és concloent, torna-ho a provar o tria el sentit manualment. El podràs canviar més endavant a la pàgina del dispositiu."
  de: "Wenn die Erkennung nicht eindeutig ist, wiederhole den Test oder wähle die Richtung manuell. Du kannst sie später auf der Seite dieses Geräts ändern."
  pt: "Se a detecção for inconclusiva, tente novamente ou escolha a direção manualmente. Você pode alterá-la depois na página deste dispositivo."
  pt-pt: "Se a deteção for inconclusiva, tente novamente ou escolha a direção manualmente. Pode alterá-la mais tarde na página deste dispositivo."
  zh: "如果测试结果不明确,请重试或手动选择方向。之后可在此设备的页面中更改。"
  pl: "Jeśli wykrywanie nie przyniesie jednoznacznego wyniku, spróbuj ponownie lub wybierz kierunek ręcznie. Możesz go później zmienić na stronie tego urządzenia."
  fr: "Si la détection n'est pas concluante, réessayez ou choisissez le sens manuellement. Vous pourrez le changer plus tard sur la page de ce périphérique."
  zh-tw: "如果偵測沒有結果，請重試或手動選擇方向。您可以稍後在此裝置的頁面上進行變更。"

"The test was interrupted. Please try again.":
  ca: "La prova s'ha interromput. Torna-ho a provar."
  de: "Der Test wurde unterbrochen. Bitte versuche es erneut."
  pt: "O teste foi interrompido. Tente novamente."
  pt-pt: "O teste foi interrompido. Tente novamente."
  zh: "测试已中断。请重试。"
  pl: "Test został przerwany. Spróbuj ponownie."
  fr: "Le test a été interrompu. Veuillez réessayer."
  zh-tw: "測試被中斷。請再試一次。"

"The wheel is unavailable. Reconnect it and try again.":
  ca: "El volant no està disponible. Torna'l a connectar i torna-ho a provar."
  de: "Das Lenkrad ist nicht verfügbar. Verbinde es erneut und wiederhole den Test."
  pt: "O volante não está disponível. Reconecte-o e tente novamente."
  pt-pt: "O volante não está disponível. Volte a ligá-lo e tente novamente."
  zh: "方向盘不可用。请重新连接后重试。"
  pl: "Kierownica jest niedostępna. Podłącz ją ponownie i spróbuj jeszcze raz."
  fr: "Le volant est indisponible. Reconnectez-le et réessayez."
  zh-tw: "方向盤無法使用。請重新連線後重試。"

"Move the wheel away from its end stops and try again.":
  ca: "Allunya el volant dels topalls i torna-ho a provar."
  de: "Drehe das Lenkrad von den Endanschlägen weg und wiederhole den Test."
  pt: "Afaste o volante dos batentes de fim de curso e tente novamente."
  pt-pt: "Afaste o volante dos batentes de fim de curso e tente novamente."
  zh: "请将方向盘转离限位后再重试。"
  pl: "Odsuń kierownicę od ograniczników skrajnych i spróbuj ponownie."
  fr: "Éloignez le volant de ses butées et réessayez."
  zh-tw: "請將方向盤移離兩端限位後重試。"

"The wheel did not settle. Let go and try again.":
  ca: "El volant no s'ha estabilitzat. Deixa'l anar i torna-ho a provar."
  de: "Das Lenkrad kam nicht zur Ruhe. Lass es los und wiederhole den Test."
  pt: "O volante não ficou parado. Solte-o e tente novamente."
  pt-pt: "O volante não ficou imóvel. Solte-o e tente novamente."
  zh: "方向盘未能稳定。请松开后重试。"
  pl: "Kierownica nie ustabilizowała się. Puść ją i spróbuj ponownie."
  fr: "Le volant ne s'est pas stabilisé. Lâchez-le et réessayez."
  zh-tw: "方向盤未穩定。請放手後重試。"

"The wheel moved too far. Test stopped.":
  ca: "El volant s'ha mogut massa. Prova aturada."
  de: "Das Lenkrad hat sich zu weit bewegt. Test gestoppt."
  pt: "O volante se moveu demais. Teste interrompido."
  pt-pt: "O volante moveu-se demasiado. Teste interrompido."
  zh: "方向盘转动幅度过大。测试已停止。"
  pl: "Kierownica obróciła się za daleko. Test zatrzymany."
  fr: "Le volant a trop tourné. Test arrêté."
  zh-tw: "方向盤移動幅度過大。測試已停止。"

"The result is inconclusive. Retry or choose the direction manually.":
  ca: "El resultat no és concloent. Torna-ho a provar o tria el sentit manualment."
  de: "Das Ergebnis ist nicht eindeutig. Wiederhole den Test oder wähle die Richtung manuell."
  pt: "O resultado é inconclusivo. Tente novamente ou escolha a direção manualmente."
  pt-pt: "O resultado é inconclusivo. Tente novamente ou escolha a direção manualmente."
  zh: "测试结果不明确。请重试或手动选择方向。"
  pl: "Wynik jest niejednoznaczny. Spróbuj ponownie lub wybierz kierunek ręcznie."
  fr: "Le résultat n'est pas concluant. Réessayez ou choisissez le sens manuellement."
  zh-tw: "結果尚無定論。重試或手動選擇方向。"

"Force feedback is unavailable. Choose the direction manually.":
  ca: "El retorn de força no està disponible. Tria el sentit manualment."
  de: "Force Feedback ist nicht verfügbar. Wähle die Richtung manuell."
  pt: "O force feedback não está disponível. Escolha a direção manualmente."
  pt-pt: "O force feedback não está disponível. Escolha a direção manualmente."
  zh: "力反馈不可用。请手动选择方向。"
  pl: "Force feedback jest niedostępny. Wybierz kierunek ręcznie."
  fr: "Le retour de force est indisponible. Choisissez le sens manuellement."
  zh-tw: "力回饋不可用。手動選擇方向。"

