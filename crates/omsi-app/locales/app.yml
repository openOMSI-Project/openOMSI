  kk: "Тоқтау тежегіші / есікті босату қосулы: өшірілгенше автобус тұрады"
  pl: "Hamulec przystankowy / zwolnienie drzwi włączone: autobus stoi, dopóki nie zostanie wyłączone"
  cs: "Brzda zastavení / uvolnění dveří je zapnutá: autobus stojí, dokud se nevypne"
  hu: "A megállófék / ajtóoldás be van kapcsolva: a busz áll, amíg ki nem kapcsolod"
