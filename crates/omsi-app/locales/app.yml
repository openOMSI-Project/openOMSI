"On a server the map, the time, the date and the weather are the same for everybody: the server keeps the world's clock. You choose your bus and your duty.":
  ca: "En un servidor, el mapa, l'hora, la data i el temps són iguals per a tothom: el servidor controla el rellotge del món. Tu tries l'autobús i el servei."
  ru: "На сервере карта, время, дата и погода одинаковы для всех: часы мира ведёт сервер. Вы выбираете свой автобус и свой наряд."
  de: "Auf einem Server sind Karte, Uhrzeit, Datum und Wetter für alle gleich: Der Server führt die Uhr der Welt. Du wählst deinen Bus und deinen Dienst."
  fr: "Sur un serveur, la carte, l'heure, la date et la météo sont les mêmes pour tous : le serveur tient l'horloge du monde. Vous choisissez votre bus et votre service."
  uk: "На сервері мапа, час, дата й погода однакові для всіх: сервер веде світовий годинник. Ви обираєте автобус і наряд."
  be: "На серверы мапа, час, дата і надвор'е аднолькавыя для ўсіх: сервер вядзе сусветны гадзіннік. Вы абіраеце аўтобус і наряд."
  kk: "Серверде карта, уақыт, күн және ауа райы барлығына бірдей: сервер әлемнің сағатын жүргізеді. Автобус пен нарядты өзіңіз таңдайсыз."
  pl: "Na serwerze mapa, godzina, data i pogoda są takie same dla wszystkich: serwer prowadzi zegar świata. Autobus i służbę wybierasz ty."
  cs: "Na serveru jsou mapa, čas, datum a počasí pro všechny stejné: server drží světový čas. Vy si vybíráte autobus a službu."
  hu: "Szerveren a térkép, az idő, a dátum és az időjárás mindenkinek ugyanaz: a szerver tartja a világ óráját. Te a buszt és a szolgálatot választod."
  es: "En un servidor el mapa, la hora, la fecha y el clima son iguales para todos: el servidor lleva el reloj del mundo. Tú eliges tu autobús y tu servicio."
  pt: "Em um servidor o mapa, a hora, a data e o clima são iguais para todos: o servidor mantém o relógio do mundo. Você escolhe seu ônibus e sua escala."
  pt-pt: "Em um servidor o mapa, a hora, a data e o meteorologia são iguais para todos: o servidor mantém o relógio do mundo. Você escolhe seu autocarro e sua escala."
  it: "Su un server mappa, ora, data e meteo sono uguali per tutti: il server tiene l'orologio del mondo. Tu scegli il bus e il turno."
  nl: "Op een server zijn kaart, tijd, datum en weer voor iedereen gelijk: de server houdt de wereldklok bij. Jij kiest je bus en je dienst."
  tr: "Bir sunucuda harita, saat, tarih ve hava herkes için aynıdır: dünya saatini sunucu tutar. Otobüsünüzü ve görevinizi siz seçersiniz."
  ja: "サーバーでは、マップ、時刻、日付、天候は全員共通です。サーバーが世界の時計を管理します。バスと乗務は自分で選べます。"
  zh: "在服务器上,地图、时间、日期和天气对所有人都相同:服务器掌管世界时钟。你可以选择自己的巴士和任务。"
  hi: "सर्वर पर मैप, समय, तारीख़ और मौसम सबके लिए एक जैसे होते हैं: दुनिया की घड़ी सर्वर रखता है। बस और ड्यूटी आप चुनते हैं।"
  zh-tw: "在伺服器上，所有玩家的地圖、時間、日期及天氣皆相同：伺服器控制世界時鐘。你可以自由選擇自己的巴士與更次。"
