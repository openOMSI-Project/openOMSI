"OMSI 2's own lessons: each opens its situation, with its pages beside the picture (Enter turns the page).":
  ca: "Les lliçons d'OMSI 2: cadascuna obre la seva situació, amb les pàgines al costat de la imatge (Retorn passa de pàgina)."
  ru: "Уроки самой OMSI 2: каждый открывает свою ситуацию со страницами рядом с картинкой (Enter листает)."
  de: "Die Lektionen von OMSI 2: jede öffnet ihre Situation, mit ihren Seiten neben dem Bild (Enter blättert um)."
  fr: "Les leçons d'OMSI 2 : chacune ouvre sa situation, avec ses pages à côté de l'image (Entrée tourne la page)."
  uk: "Власні уроки OMSI 2: кожен відкриває свою ситуацію, а її сторінки - поруч із картинкою (Enter перегортає сторінку)."
  be: "Уласныя ўрокі OMSI 2: кожны адкрывае сваю сітуацыю, а яго старонкі - побач з малюнкам (Enter перагортвае старонку)."
  kk: "OMSI 2-нің өз сабақтары: әрқайсысы өз жағдайын ашады, беттері суреттің қасында (Enter бетті аударады)."
  pl: "Lekcje z samego OMSI 2: każda otwiera swoją sytuację, ze stronami obok obrazu (Enter przewraca stronę)."
  cs: "Vlastní lekce OMSI 2: každá otevře svou situaci se stránkami vedle obrazu (Enter listuje)."
  hu: "Az OMSI 2 saját oktatóanyagai: mindegyik megnyit egy előre beállított szituációt a követendő, képekkel illusztrált lépésekkel együtt (az Enter lapoz)."
  es: "Las lecciones propias de OMSI 2: cada una abre su situación, con sus páginas junto a la imagen (Enter pasa la página)."
  pt: "As lições do próprio OMSI 2: cada uma abre sua situação, com as páginas ao lado da imagem (Enter vira a página)."
  pt-pt: "As lições do próprio OMSI 2: cada uma abre sua situação, com as páginas ao lado da imagem (Enter vira a página)."
  it: "Le lezioni di OMSI 2: ognuna apre la sua situazione, con le sue pagine accanto all'immagine (Invio gira pagina)."
  nl: "De lessen van OMSI 2: elke les opent zijn situatie, met de pagina's naast het beeld (Enter bladert om)."
  tr: "OMSI 2'nin kendi dersleri: her biri kendi durumunu açar, sayfaları görüntünün yanında yer alır (Enter sayfayı çevirir)."
  ja: "OMSI 2付属のレッスン:それぞれの状況が開き、画像の横にページが表示されます(Enterでページ送り)。"
  zh: "OMSI 2自带的课程:每个都会打开其场景,页面显示在画面旁(按Enter翻页)。"
  hi: "OMSI 2 के अपने पाठ: हर एक अपनी सिचुएशन खोलता है, उसके पेज तस्वीर के बगल में होते हैं (Enter पेज पलटता है)।"
  zh-tw: "OMSI 2 內建課程：每個課程都會開啟專屬情境，畫面旁會顯示說明頁面（按 Enter 翻頁）。"
