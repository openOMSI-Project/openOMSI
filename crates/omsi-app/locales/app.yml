"Copy the report (the end of the game's log), or open a GitHub issue with it: it tells what went wrong on this computer.":
  ca: "Copia l'informe (el final del registre del joc) o obre'n una incidència a GitHub: explica què ha fallat en aquest ordinador."
  ru: "Скопируйте отчёт (конец журнала игры) или откройте с ним запрос на GitHub: он подскажет, что пошло не так на этом компьютере."
  de: "Kopiere den Bericht (das Ende des Spielprotokolls) oder öffne damit ein GitHub-Issue: Er zeigt, was auf diesem Computer schiefgelaufen ist."
  fr: "Copiez le rapport (la fin du journal du jeu) ou ouvrez un ticket GitHub avec : il indique ce qui a mal tourné sur cet ordinateur."
  uk: "Скопіюйте звіт (кінець журналу гри) або відкрийте з ним issue на GitHub: він розповідає, що пішло не так на цьому комп'ютері."
  be: "Скапіюйце справаздачу (канец журнала гульні) або адкрыйце з ёй issue на GitHub: яна расказвае, што пайшло не так на гэтым камп'ютары."
  kk: "Есепті көшіріңіз (ойын журналының соңы) немесе онымен GitHub-та issue ашыңыз: онда осы компьютерде не қате кеткені көрсетіледі."
  pl: "Skopiuj raport (koniec dziennika gry) albo otwórz z nim zgłoszenie na GitHubie: pokazuje, co poszło nie tak na tym komputerze."
  cs: "Zkopírujte hlášení (konec logu hry) nebo s ním otevřete issue na GitHubu: říká, co se na tomto počítači pokazilo."
  hu: "Másold ki a jelentést (a játék naplójának végét), vagy nyiss vele GitHub issue-t: megmutatja, mi romlott el ezen a számítógépen."
  es: "Copia el informe (el final del registro del juego) o abre una incidencia en GitHub con él: explica qué falló en este equipo."
  pt: "Copie o relatório (o final do log do jogo) ou abra uma issue no GitHub com ele: mostra o que deu errado neste computador."
  pt-pt: "Copie o relatório (o final do log do jogo) ou abra uma issue no GitHub com ele: mostra o que deu errado neste computador."
  it: "Copia il rapporto (la fine del log del gioco), o apri una issue su GitHub con esso: dice cosa è andato storto su questo computer."
  nl: "Kopieer het rapport (het einde van het spellogboek) of open er een GitHub-issue mee: het vertelt wat er op deze computer misging."
  tr: "Raporu kopyalayın (oyun günlüğünün sonu) veya onunla bir GitHub sorunu açın: bu bilgisayarda neyin ters gittiğini anlatır."
  ja: "レポート(ゲームのログの末尾)をコピーするか、それを添えてGitHubのIssueを開きます。このコンピューターで何が起きたかが分かります。"
  zh: "复制报告(游戏日志的末尾),或用它创建GitHub issue:它能说明这台电脑上出了什么问题。"
  hi: "रिपोर्ट कॉपी करें (गेम लॉग का अंत), या उसके साथ GitHub इश्यू खोलें: इससे पता चलता है कि इस कंप्यूटर पर क्या गलत हुआ।"
  zh-tw: "複製報告（遊戲記錄檔結尾），或用於在 GitHub 提出 issue：其說明了此電腦上發生的問題。"
