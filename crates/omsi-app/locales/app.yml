"The games you started: their logs, and their LAN session - the code to give a friend, who joined, the chat.":
  ca: "Les partides que has iniciat: els registres i la sessió en xarxa, el codi per compartir amb un amic, qui s'hi ha unit i el xat."
  ru: "Запущенные вами игры: их журналы и сетевая сессия - код для друга, кто подключился, чат."
  de: "Die gestarteten Spiele: ihre Protokolle und ihre LAN-Sitzung - der Code für einen Freund, wer beigetreten ist, der Chat."
  fr: "Les parties lancées : leurs journaux et leur session réseau - le code à donner à un ami, qui a rejoint, le chat."
  uk: "Запущені вами ігри: їхні журнали та LAN-сесія - код для друга, хто приєднався, чат."
  be: "Запушчаныя вамі гульні: іх журналы і LAN-сесія - код для сябра, хто далучыўся, чат."
  kk: "Сіз бастаған ойындар: олардың журналдары және LAN сессиясы - досқа берілетін код, кім қосылды, чат."
  pl: "Uruchomione gry: ich dzienniki i sesja LAN - kod dla znajomego, kto dołączył, czat."
  cs: "Vámi spuštěné hry: jejich logy a relace LAN - kód pro kamaráda, kdo se připojil, chat."
  hu: "Az általad indított játékok: naplóik és LAN munkamenetük - a barátnak adandó kód, ki csatlakozott, a csevegés."
  es: "Las partidas que iniciaste: sus registros y su sesión LAN: el código para dar a un amigo, quién se unió, el chat."
  pt: "Os jogos que você iniciou: logs, sessão LAN, código para convidar um amigo, participantes e chat."
  pt-pt: "Os jogos que você iniciou: logs, sessão LAN, código para convidar um amigo, participantes e chat."
  it: "I giochi che hai avviato: i loro log e la sessione LAN - il codice da dare a un amico, chi si è unito, la chat."
  nl: "De spellen die je hebt gestart: hun logs en hun LAN-sessie - de code voor een vriend, wie er meedoet, de chat."
  tr: "Başlattığınız oyunlar: günlükleri ve LAN oturumları - arkadaşa verilecek kod, kimlerin katıldığı, sohbet."
  ja: "起動したゲーム:ログと、そのLANセッション(友達に渡すコード、参加者、チャット)。"
  zh: "你启动的游戏:其日志及局域网会话——给朋友的会话码、已加入的人、聊天。"
  hi: "आपके शुरू किए गए गेम: उनके लॉग और LAN सेशन - दोस्त को देने का कोड, कौन जुड़ा, चैट।"
  zh-tw: "你啟動的遊戲：其記錄檔及區域網絡工作階段——提供給朋友的連線碼、已加入的玩家、聊天室。"
"No game is running. Start a duty on the Drive page; to drive with a friend, choose LAN play → Host there, and give them the session code shown here.":
  ca: "No hi ha cap partida en marxa. Inicia un servei a Condueix; per conduir amb un amic, tria Joc en xarxa local → Allotja i dona-li el codi de sessió que apareix aquí."
  ru: "Игра не запущена. Начните смену на странице «Поездка»; чтобы играть с другом, выберите там «Игра по сети → Создать» и дайте ему код сессии отсюда."
  de: "Kein Spiel läuft. Starte einen Dienst auf der Seite Fahren; um mit einem Freund zu fahren, wähle dort Netzwerkspiel → Hosten und gib ihm den hier gezeigten Code."
  fr: "Aucune partie en cours. Lancez un service sur la page Conduire ; pour jouer avec un ami, choisissez Jeu en réseau → Héberger et donnez-lui le code affiché ici."
  uk: "Жодна гра не запущена. Почніть наряд на сторінці «Їхати»; щоб грати з другом, оберіть там «Гра по LAN» → «Хост» і дайте йому код сесії, показаний тут."
  be: "Ніводная гульня не запушчана. Пачніце наряд на старонцы «Ехаць»; каб гуляць з сябрам, абярыце там «Гульня па LAN» → «Хост» і дайце яму код сесіі, паказаны тут."
  kk: "Ешқандай ойын жұмыс істемейді. Жүру бетінде нарядты бастаңыз; досыңызбен жүру үшін сол жерде LAN ойыны → Хост таңдап, осында көрсетілген сессия кодын беріңіз."
  pl: "Żadna gra nie działa. Rozpocznij służbę na stronie Jedź; aby jechać ze znajomym, wybierz tam Gra w sieci LAN → Host i podaj kod sesji widoczny tutaj."
  cs: "Neběží žádná hra. Spusťte službu na stránce Jet; pro jízdu s kamarádem tam zvolte Hra po LAN → Hostit a dejte mu kód relace zobrazený tady."
  hu: "Nem fut játékmenet. Indíts szolgálatot a Vezetés oldalon; baráttal vezetéshez válaszd a LAN-játék → Létrehozás lehetőséget, és add oda az itt látható munkamenet-kódot."
  es: "No hay ninguna partida en marcha. Inicia un servicio en la página Conducir; para jugar con un amigo, elige Juego en LAN → Anfitrión allí y dale el código de sesión que se muestra aquí."
  pt: "Nenhum jogo em andamento. Inicie uma escala na página Dirigir; para jogar com um amigo, escolha Jogo em LAN → Anfitrião lá e dê a ele o código de sessão mostrado aqui."
  pt-pt: "Nenhum jogo em andamento. Inicie uma escala na página Conduzir; para jogar com um amigo, escolha Jogo em LAN → Anfitrião lá e dê a ele o código de sessão mostrado aqui."
  it: "Nessun gioco in esecuzione. Avvia un turno nella pagina Guida; per guidare con un amico, scegli Gioco LAN → Ospita e dagli il codice sessione mostrato qui."
  nl: "Er draait geen spel. Start een dienst op de pagina Rijden; om met een vriend te rijden kies je LAN-spel → Hosten en geef je hem de sessiecode die hier staat."
  tr: "Çalışan oyun yok. Sürüş sayfasında bir görev başlatın; arkadaşınızla sürmek için orada LAN oyunu → Sunucu ol'u seçin ve burada görünen oturum kodunu ona verin."
  ja: "起動中のゲームはありません。「運転」ページで乗務を開始してください。友達と運転するには、そこでLANプレイ → ホストを選び、ここに表示されるセッションコードを渡します。"
  zh: "没有正在运行的游戏。请在“驾驶”页面开始任务;要与朋友一起驾驶,请在那里选择局域网游戏 → 主机,并把此处显示的会话码告诉他们。"
  hi: "कोई गेम नहीं चल रहा। ड्राइव पेज पर ड्यूटी शुरू करें; दोस्त के साथ चलाने के लिए वहाँ LAN प्ले → होस्ट चुनें और यहाँ दिखा सेशन कोड उन्हें दें।"
  zh-tw: "沒有正在執行的遊戲。請在「駕駛」頁面開始更次；若要與朋友一同駕駛，請在該處選擇「區域網絡遊戲 → 建立房間」，並將此處顯示的連線碼提供給他們。"
