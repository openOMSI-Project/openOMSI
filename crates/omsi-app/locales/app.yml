"The rate is shared by all bus mirrors. Higher rates can reduce game FPS.":
  ca: "La freqüència és compartida per tots els retrovisors. Augmentar-la pot reduir els FPS del joc."
  ru: "Частота распределяется между всеми зеркалами автобуса. Более высокая частота может снизить FPS игры."
  de: "Die Rate verteilt sich auf alle Busspiegel. Höhere Werte können die Spiel-FPS senken."
  fr: "La fréquence est partagée entre tous les rétroviseurs du bus. Une fréquence plus élevée peut réduire les FPS du jeu."
  uk: "Частота розподіляється між усіма дзеркалами автобуса. Вища частота може знизити FPS гри."
  be: "Частата размяркоўваецца паміж усімі люстэркамі аўтобуса. Больш высокая частата можа знізіць FPS гульні."
  kk: "Жаңарту жиілігі барлық автобус айналарына бөлінеді. Жоғары мәндер ойынның FPS көрсеткішін төмендетуі мүмкін."
  pl: "Częstotliwość jest dzielona między wszystkie lusterka autobusu. Wyższe wartości mogą obniżyć FPS gry."
  cs: "Frekvence se dělí mezi všechna zrcátka autobusu. Vyšší hodnoty mohou snížit FPS hry."
  hu: "A frissítési gyakoriság megoszlik a busz összes tükre között. A magasabb értékek csökkenthetik a játék FPS-ét."
  es: "La frecuencia se reparte entre todos los espejos del autobús. Una frecuencia mayor puede reducir los FPS del juego."
  pt: "A taxa é dividida entre todos os espelhos do ônibus. Taxas maiores podem reduzir o FPS do jogo."
  pt-pt: "A taxa é dividida entre todos os espelhos do autocarro. Taxas mais elevadas podem reduzir os FPS do jogo."
  it: "La frequenza è condivisa tra tutti gli specchietti del bus. Valori più alti possono ridurre gli FPS del gioco."
  nl: "De frequentie wordt verdeeld over alle busspiegels. Hogere waarden kunnen de FPS van het spel verlagen."
  tr: "Yenileme hızı tüm otobüs aynaları arasında paylaşılır. Daha yüksek değerler oyunun FPS değerini düşürebilir."
  ja: "更新頻度はバスのすべてのミラーで共有されます。高い値にするとゲームのFPSが低下する場合があります。"
  zh: "刷新频率由所有巴士后视镜共享。较高的频率可能降低游戏帧率。"
  hi: "यह दर बस के सभी शीशों के बीच बाँटी जाती है। अधिक दर से गेम का FPS कम हो सकता है।"
  zh-tw: "更新頻率由所有巴士後視鏡共用。較高的頻率可能降低遊戲幀率。"
  ko: "업데이트 빈도는 모든 버스 거울이 공유합니다. 빈도를 높이면 게임 FPS가 낮아질 수 있습니다."
  th: "อัตราการอัปเดตแบ่งใช้ร่วมกันระหว่างกระจกทุกบานของรถบัส ค่าที่สูงขึ้นอาจลด FPS ของเกม"
  vi: "Tần suất được chia cho tất cả gương xe buýt. Tần suất cao hơn có thể làm giảm FPS của trò chơi."
  id: "Frekuensi pembaruan dibagi ke semua kaca spion bus. Frekuensi lebih tinggi dapat menurunkan FPS game."
  ms: "Kadar kemas kini dikongsi oleh semua cermin bas. Kadar yang lebih tinggi boleh mengurangkan FPS permainan."
  tl: "Ang dalas ng pag-update ay pinaghahatian ng lahat ng salamin ng bus. Mas mataas na dalas ay maaaring magpababa ng FPS ng laro."
