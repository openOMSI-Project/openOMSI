"Wheels with a saved direction use their own setting under Controls → Game controllers.":
  ca: "Els volants amb un sentit desat fan servir el seu propi ajust a Controls → Dispositius de joc."
  de: "Lenkräder mit gespeicherter Richtung verwenden ihre eigene Einstellung unter Steuerung → Gamecontroller."
  pt: "Volantes com uma direção salva usam a própria configuração em Controles → Controles de jogo."
  pt-pt: "Volantes com uma direção guardada usam a própria configuração em Controlos → Controladores de jogo."
  zh: "已保存方向的方向盘在“控制 → 游戏手柄”中使用各自的设置。"
  pl: "Kierownice z zapisanym kierunkiem używają własnego ustawienia w sekcji Sterowanie → Kontrolery gier."
  fr: "Les volants dont le sens est enregistré gardent leur propre réglage sous Commandes → Contrôleurs de jeu."
  zh-tw: "已儲存方向的方向盤在「控制」→「遊戲控制器」下使用自己的設定。"

"INJURY RISK: TAKE YOUR HANDS OFF THE WHEEL. Keep hands and fingers clear before starting and throughout the test.":
  ca: "RISC DE LESIONS: TREU LES MANS DEL VOLANT. Mantén les mans i els dits allunyats abans de començar i durant tota la prova."
  de: "VERLETZUNGSGEFAHR: HÄNDE WEG VOM LENKRAD. Halte Hände und Finger vor dem Start und während des gesamten Tests fern."
  pt: "RISCO DE LESÃO: TIRE AS MÃOS DO VOLANTE. Mantenha as mãos e os dedos afastados antes de iniciar e durante todo o teste."
  pt-pt: "RISCO DE LESÃO: RETIRE AS MÃOS DO VOLANTE. Mantenha as mãos e os dedos afastados antes de iniciar e durante todo o teste."
  zh: "受伤风险：请把手从方向盘上移开。测试开始前及整个测试过程中,请让双手和手指远离方向盘。"
  pl: "RYZYKO URAZU: PUŚĆ KIEROWNICĘ. Trzymaj ręce i palce z dala od niej przed rozpoczęciem i przez cały czas trwania testu."
  fr: "RISQUE DE BLESSURE : LÂCHEZ LE VOLANT. Gardez les mains et les doigts à l'écart avant de commencer et pendant tout le test."
  zh-tw: "受傷風險：請將雙手從方向盤上移開。開始前及整個測試期間，請讓雙手和手指保持遠離。"

"The test applies two short forces in opposite directions. Finish and press Save to keep the detected direction for this wheel.":
  ca: "La prova aplica dues forces breus en sentits oposats. Acaba i prem Desa per conservar el sentit detectat per a aquest volant."
  de: "Der Test gibt zwei kurze Kraftimpulse in entgegengesetzte Richtungen aus. Schließe den Assistenten ab und drücke Speichern, um die erkannte Richtung für dieses Lenkrad zu übernehmen."
  pt: "O teste aplica duas forças curtas em direções opostas. Conclua e pressione Salvar para manter a direção detectada para este volante."
  pt-pt: "O teste aplica duas forças curtas em direções opostas. Conclua e prima Guardar para manter a direção detetada para este volante."
  zh: "测试会施加两次方向相反的短促力。完成后按“保存”即可为该方向盘保留检测到的方向。"
  pl: "Test wywołuje dwa krótkie impulsy siły w przeciwnych kierunkach. Zakończ i naciśnij Zapisz, aby zachować wykryty kierunek dla tej kierownicy."
  fr: "Le test applique deux brèves forces en sens opposés. Terminez puis appuyez sur Enregistrer pour garder le sens détecté pour ce volant."
  zh-tw: "此測試在相反方向施加兩個短力。完成並按下儲存以保留偵測到的該輪子的方向。"

