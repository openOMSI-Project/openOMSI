"A bus, a map, scenery, a whole OMSI folder - as a folder or a .zip. The original OMSI 2 folder is never written to.":
  ca: "Un autobús, un mapa, elements de l'entorn o una carpeta d'OMSI sencera, com a carpeta o fitxer .zip. La carpeta original d'OMSI 2 no es modifica mai."
  ru: "Автобус, карта, объекты, целая папка OMSI - папкой или .zip. В папку оригинальной OMSI 2 ничего не пишется."
  de: "Ein Bus, eine Karte, Szenerie, ein ganzer OMSI-Ordner - als Ordner oder .zip. In den originalen OMSI-2-Ordner wird nie geschrieben."
  fr: "Un bus, une carte, des décors, tout un dossier OMSI - en dossier ou en .zip. Le dossier de l'OMSI 2 original n'est jamais modifié."
  uk: "Автобус, мапа, декорації, ціла тека OMSI - теками або як .zip. В оригінальну теку OMSI 2 нічого не записується."
  be: "Аўтобус, мапа, дэкарацыі, цэлая тэчка OMSI - тэчкамі або як .zip. У арыгінальную тэчку OMSI 2 нічога не запісваецца."
  kk: "Автобус, карта, декорация, тұтас OMSI қалтасы - қалта немесе .zip ретінде. Түпнұсқа OMSI 2 қалтасына ешқашан жазылмайды."
  pl: "Autobus, mapa, sceneria, cały folder OMSI - jako folder lub .zip. Do oryginalnego folderu OMSI 2 nic nie jest zapisywane."
  cs: "Autobus, mapa, scenérie, celá složka OMSI - jako složka nebo .zip. Do originální složky OMSI 2 se nikdy nezapisuje."
  hu: "Busz, térkép, objektumok, egy teljes OMSI mappa - mappaként vagy .zip fájlként. Az eredeti OMSI 2 mappád érintetlen marad."
  es: "Un autobús, un mapa, un escenario, una carpeta OMSI entera: como carpeta o como .zip. La carpeta del OMSI 2 original nunca se modifica."
  pt: "Um ônibus, um mapa, um cenário, uma pasta OMSI inteira: como pasta ou como .zip. A pasta do OMSI 2 original nunca é alterada."
  pt-pt: "Um autocarro, um mapa, um cenário, uma pasta OMSI inteira: como pasta ou como .zip. A pasta do OMSI 2 original nunca é alterada."
  it: "Un bus, una mappa, uno scenario, un'intera cartella OMSI - come cartella o .zip. La cartella dell'OMSI 2 originale non viene mai modificata."
  nl: "Een bus, een kaart, een landschap, een hele OMSI-map - als map of .zip. In de map van de originele OMSI 2 wordt nooit geschreven."
  tr: "Bir otobüs, harita, manzara, tüm bir OMSI klasörü - klasör veya .zip olarak. Orijinal OMSI 2 klasörüne asla yazılmaz."
  ja: "バス、マップ、風景、OMSIフォルダ丸ごと - フォルダまたは.zipで。元のOMSI 2フォルダには一切書き込みません。"
  zh: "巴士、地图、场景、整个OMSI文件夹——以文件夹或.zip形式。绝不会写入原版OMSI 2文件夹。"
  hi: "एक बस, मैप, दृश्य, या पूरा OMSI फ़ोल्डर - फ़ोल्डर या .zip के रूप में। ओरिजिनल OMSI 2 फ़ोल्डर में कभी कुछ नहीं लिखा जाता।"
  zh-tw: "巴士、地圖、景觀、整個 OMSI 資料夾——可為資料夾或 .zip 格式。絕不會寫入原版 OMSI 2 資料夾。"
