  pt-pt: "Uma saída não é um horário (h:mm)."
  it: "Una partenza non è un orario (h:mm)."
  nl: "Een vertrektijd is geen tijd (u:mm)."
  tr: "Kalkış bir saat değil (s:dd)."
  ja: "出発は時刻ではありません(h:mm)。"
  zh: "发车时间格式不正确(h:mm)。"
  hi: "प्रस्थान समय नहीं है (h:mm)।"
  zh-tw: "發車時間格式不正確（應為 h:mm）。"
"A map's lines: their tours and when each trip leaves. Saved as the line's .ttl (in the content folder; OMSI 2's own files stay as they are).":
  ca: "Les línies d'un mapa: els torns i la sortida de cada trajecte. Es desen al .ttl de la línia (a la carpeta de contingut; els fitxers originals d'OMSI 2 es mantenen intactes)."
  ru: "Линии карты: их выходы и время отправления каждого рейса. Сохраняется как .ttl линии (в папке контента; файлы самой OMSI 2 не затрагиваются)."
  de: "Die Linien einer Karte: ihre Kurse und wann jede Fahrt abfährt. Wird als .ttl der Linie gespeichert (im Inhaltsordner; die Originaldateien von OMSI 2 bleiben unverändert)."
  fr: "Les lignes d'une carte : leurs tours et l'heure de départ de chaque course. Enregistré comme .ttl de la ligne (dans le dossier de contenu ; les fichiers d'OMSI 2 restent inchangés)."
  uk: "Лінії мапи: їхні оберти та час відправлення кожного рейсу. Зберігається як .ttl лінії (у теці вмісту; власні файли OMSI 2 залишаються як є)."
  be: "Лініі мапы: іх абароты і час адпраўлення кожнага рэйса. Захоўваецца як .ttl лініі (у тэчцы змесціва; уласныя файлы OMSI 2 застаюцца як ёсць)."
  kk: "Картаның желілері: олардың рейстер тізбегі мен әр рейстің жөнелу уақыты. Желінің .ttl файлы ретінде сақталады (контент қалтасында; OMSI 2-нің өз файлдары өзгеріссіз қалады)."
  pl: "Linie mapy: ich brygady i godziny odjazdów każdego kursu. Zapisywane jako .ttl linii (w folderze z zawartością; pliki samego OMSI 2 zostają bez zmian)."
  cs: "Linky mapy: jejich turnusy a odjezdy jednotlivých spojů. Uloženo jako .ttl linky (ve složce obsahu; vlastní soubory OMSI 2 zůstávají beze změny)."
  hu: "A pálya járatai: fordulók és az egyes menetek indulása. Mentés a járat .ttl fájljaként (a tartalommappában; az OMSI 2 saját fájljai változatlanok maradnak)."
  es: "Las líneas de un mapa: sus recorridos y cuándo sale cada viaje. Se guarda como el .ttl de la línea (en la carpeta de contenido; los archivos propios de OMSI 2 no se tocan)."
  pt: "As linhas de um mapa: seus percursos e quando cada viagem sai. Salvo como o .ttl da linha (na pasta de conteúdo; os arquivos do próprio OMSI 2 não são alterados)."
  pt-pt: "As linhas de um mapa: seus percursos e quando cada viagem sai. Guardado como o .ttl da linha (na pasta de conteúdo; os ficheiros do próprio OMSI 2 não são alterados)."
  it: "Le linee di una mappa: i loro turni e quando parte ogni corsa. Salvato come .ttl della linea (nella cartella dei contenuti; i file di OMSI 2 restano invariati)."
  nl: "De lijnen van een kaart: hun omlopen en wanneer elke rit vertrekt. Opgeslagen als .ttl van de lijn (in de inhoudsmap; de eigen bestanden van OMSI 2 blijven ongewijzigd)."
  tr: "Bir haritanın hatları: turları ve her seferin ne zaman kalktığı. Hattın .ttl dosyası olarak kaydedilir (içerik klasöründe; OMSI 2'nin kendi dosyaları olduğu gibi kalır)."
  ja: "マップの系統:その行路と各便の出発時刻。系統の.ttlとして保存されます(コンテンツフォルダ内。OMSI 2自身のファイルは変更されません)。"
  zh: "地图的线路:其行程以及每个班次的发车时间。保存为该线路的.ttl(在内容文件夹中;OMSI 2自带的文件保持不变)。"
  hi: "मैप की लाइनें: उनके टूर और हर ट्रिप कब जाती है। लाइन की .ttl के रूप में सेव होती है (कंटेंट फ़ोल्डर में; OMSI 2 की अपनी फ़ाइलें जस की तस रहती हैं)।"
  zh-tw: "地圖路線：其更次及各班次的發車時間。儲存為路線的 .ttl 檔案（位於內容資料夾中；OMSI 2 原始檔案保持不變）。"
