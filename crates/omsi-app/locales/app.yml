  de: "H-Schaltungsgänge sind belegt. Hat Ihre Schaltung keine Leerlauftaste, aktivieren Sie die Rückkehr in den Leerlauf unter Einstellungen → Fahren → Gamecontroller."
  fr: "Des rapports de boîte en H sont attribués. Si votre levier n'a pas de bouton de point mort, activez le retour au point mort dans Paramètres → Conduite → Manettes."
  uk: "Призначено передачі H-подібної КПП. Якщо ваш важіль не має кнопки нейтралі, увімкніть повернення в нейтраль: Налаштування → Водіння → Ігрові контролери."
  be: "Прызначаны перадачы H-падобнай КПП. Калі ваш рычаг не мае кнопкі нейтралі, уключыце вяртанне ў нейтраль: Налады → Ваджэнне → Гульнявыя кантролеры."
  kk: "H-тәрізді қораптың берілістері тағайындалған. Иінтіректе бейтарап түймесі болмаса, бейтарапқа қайтуды қосыңыз: Баптаулар → Жүргізу → Ойын контроллерлері."
  pl: "Przypisano biegi skrzyni H. Jeśli Twoja skrzynia nie ma przycisku luzu, włącz powrót na luz w Ustawienia → Jazda → Kontrolery gier."
  cs: "Jsou přiřazeny rychlosti řazení do H. Pokud vaše páka nemá tlačítko neutrálu, zapněte návrat do neutrálu v Nastavení → Řízení → Herní ovladače."
  hu: "A H-váltó fokozatai ki vannak osztva. Ha a váltódnak nincs üres gombja, kapcsold be az üresbe váltást: Beállítások → Vezetés → Játékvezérlők."
  es: "Hay marchas de palanca en H asignadas. Si tu palanca no tiene botón de punto muerto, activa el regreso a punto muerto en Ajustes → Conducción → Mandos."
  it: "Sono assegnate marce del cambio ad H. Se il tuo cambio non ha un pulsante di folle, attiva il ritorno in folle in Impostazioni → Guida → Controller."
  nl: "Er zijn H-schakelversnellingen toegewezen. Heeft je pook geen neutraalknop, zet dan terug naar neutraal aan via Instellingen → Rijden → Gamecontrollers."
  tr: "H şanzıman vitesleri atandı. Vites kolunuzda boş düğmesi yoksa Ayarlar → Sürüş → Oyun kumandaları altında boşa dönmeyi açın."
  ja: "Hパターンのギアが割り当てられています。シフターにニュートラルボタンがない場合は、設定 → 運転 → ゲームコントローラーでニュートラル復帰を有効にしてください。"
  zh: "已分配 H 档挡位。如果你的换挡器没有空挡按钮，请在 设置 → 驾驶 → 游戏控制器 中启用回空挡。"
  hi: "H-पैटर्न गियर असाइन हैं। अगर आपके शिफ्टर में न्यूट्रल बटन नहीं है, तो सेटिंग्स → ड्राइविंग → गेम कंट्रोलर में न्यूट्रल पर लौटना चालू करें।"
  zh-tw: "已指派 H 檔檔位。如果你的換檔器沒有空檔按鈕，請在 設定 → 駕駛 → 遊戲控制器 中啟用回空檔。"
  ko: "H패턴 기어가 지정되어 있습니다. 시프터에 중립 버튼이 없다면 설정 → 운전 → 게임 컨트롤러에서 중립 복귀를 켜세요."
  th: "มีการกำหนดเกียร์แบบ H แล้ว หากคันเกียร์ของคุณไม่มีปุ่มเกียร์ว่าง ให้เปิดการกลับเกียร์ว่างที่ การตั้งค่า → การขับขี่ → คอนโทรลเลอร์เกม"
  vi: "Đã gán các số của cần số chữ H. Nếu cần số không có nút số trung gian, hãy bật về số trung gian trong Cài đặt → Lái xe → Tay cầm chơi game."
  id: "Gigi tuas H sudah ditetapkan. Jika tuas Anda tidak punya tombol netral, aktifkan kembali ke netral di Pengaturan → Mengemudi → Pengontrol game."
  ms: "Gear tuil H telah ditetapkan. Jika tuil anda tiada butang neutral, hidupkan kembali ke neutral di Tetapan → Pemanduan → Pengawal permainan."
