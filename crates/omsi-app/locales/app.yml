"Pick a line first. As in OMSI, the start time and date then say where in the tour the bus is: the trip under way, or the next to leave.":
  ca: "Tria primer una línia. Com a OMSI, l'hora i la data d'inici determinen en quin punt del torn és l'autobús: el trajecte en curs o el següent que ha de sortir."
  ru: "Сначала выберите линию. Как в OMSI, время и дата старта определяют, где в выходе находится автобус: текущий рейс или следующий."
  de: "Wähle zuerst eine Linie. Wie in OMSI bestimmen Startzeit und Datum, wo im Umlauf der Bus ist: die laufende Fahrt oder die nächste."
  fr: "Choisissez d'abord une ligne. Comme dans OMSI, l'heure et la date de départ indiquent où en est le bus dans son service : le trajet en cours ou le suivant."
  uk: "Спершу оберіть лінію. Як в OMSI, час і дата початку визначають, де в обороті перебуває автобус: рейс, що триває, або наступний, що відправляється."
  be: "Спачатку абярыце лінію. Як у OMSI, час і дата пачатку вызначаюць, дзе ў абароце знаходзіцца аўтобус: рэйс, які ідзе, або наступны, што адпраўляецца."
  kk: "Алдымен желіні таңдаңыз. OMSI-дегідей, басталу уақыты мен күні автобустың рейстер тізбегінің қай жерінде екенін көрсетеді: жүріп жатқан рейс немесе келесі жөнелетін рейс."
  pl: "Najpierw wybierz linię. Tak jak w OMSI, godzina i data startu określają, w którym miejscu brygady jest autobus: kurs w toku albo następny do odjazdu."
  cs: "Nejdřív vyberte linku. Stejně jako v OMSI určuje čas a datum začátku, kde v turnusu se autobus nachází: rozjetý spoj, nebo příští odjezd."
  hu: "Először válasszon járatot. Mint az OMSI-ban, az indulási idő és dátum határozza meg, hol tart a busz a fordulóban: a folyamatban lévő menet vagy a következő indulás."
  es: "Elige primero una línea. Como en OMSI, la hora y la fecha de inicio indican en qué punto del recorrido está el autobús: el viaje en curso o el próximo en salir."
  pt: "Escolha primeiro uma linha. Como no OMSI, a hora e a data de início determinam em que ponto da escala o ônibus está: na viagem em andamento ou na próxima saída."
  pt-pt: "Escolha primeiro uma linha. Como no OMSI, a hora e a data de início determinam em que ponto da escala o autocarro está: na viagem em andamento ou na próxima saída."
  it: "Scegli prima una linea. Come in OMSI, ora e data di partenza indicano a che punto del turno si trova il bus: la corsa in corso o la prossima in partenza."
  nl: "Kies eerst een lijn. Zoals in OMSI geven starttijd en datum aan waar in de omloop de bus is: de rit die bezig is of de eerstvolgende vertrek."
  tr: "Önce bir hat seçin. OMSI'de olduğu gibi, başlangıç saati ve tarihi otobüsün turun neresinde olduğunu belirler: yoldaki sefer veya kalkacak sonraki sefer."
  ja: "先に系統を選んでください。OMSIと同様に、開始時刻と日付で行路のどの位置から始まるかが決まります:運行中の便、または次に出発する便。"
  zh: "请先选择线路。与OMSI一样,设定的开始时间和日期决定巴士处于行程的哪个位置: 是正在行驶的班次，还是即将发车的下一班次。"
  hi: "पहले एक लाइन चुनें। OMSI की तरह, शुरुआत का समय और तारीख़ तय करते हैं कि बस टूर में कहाँ है: चल रही ट्रिप या अगली जाने वाली ट्रिप।"
  zh-tw: "請先選擇路線。與 OMSI 一樣，開始日期及時間會決定巴士在更次中的位置，是正在行駛的班次，或下一班準備出發的車。"
  ko: "먼저 노선을 선택하세요. OMSI와 같이 시작 날짜와 시간이 현재 운행 중인 차량 또는 다음 출발 차량을 결정합니다."
  th: "เลือกสายรถก่อน เช่นเดียวกับ OMSI วันและเวลาเริ่มต้นจะกำหนดว่ารถอยู่ในเที่ยวที่กำลังวิ่งหรือเที่ยวถัดไป"
  vi: "Hãy chọn tuyến trước. Như OMSI, ngày giờ bắt đầu quyết định xe đang chạy chuyến nào hoặc chuẩn bị rời bến."
  id: "Pilih jalur terlebih dahulu. Seperti OMSI, waktu dan tanggal mulai menentukan perjalanan yang sedang berlangsung atau yang berikutnya."
  ms: "Pilih laluan dahulu. Seperti OMSI, masa dan tarikh mula menentukan perjalanan yang sedang berlangsung atau perjalanan berikutnya."
  tl: "Pumili muna ng linya. Tulad sa OMSI, ang petsa at oras ang magtatakda kung nasa kasalukuyan o susunod na biyahe ang bus."
