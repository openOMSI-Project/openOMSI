  pt-pt: "Uma sessão precisa do OMSI 2 original: escolha antes a pasta dele em Preparação."
  it: "Una sessione richiede l'OMSI 2 originale: scegli prima la sua cartella in Configurazione."
  nl: "Voor een sessie is de originele OMSI 2 nodig: kies eerst de map onder Installatie."
