"The OMSI 2 folder is the one with maps and Vehicles in it (any complete installation). The game binary is the openomsi program; it is found by itself when it sits next to the launcher.":
  ca: "La carpeta d'OMSI 2 és la que conté maps i Vehicles (qualsevol instal·lació completa). L'executable del joc és el programa openomsi; es detecta automàticament si és al costat del launcher."
  ru: "Папка OMSI 2 - та, где есть maps и Vehicles (любая полная установка). Файл игры - программа omsi этого переписанного варианта; он находится сам, если лежит рядом с лаунчером."
  de: "Der OMSI-2-Ordner ist der mit maps und Vehicles (jede vollständige Installation). Die Spieldatei ist das Programm openomsi; sie wird gefunden, wenn sie neben dem Launcher liegt."
  fr: "Le dossier OMSI 2 est celui qui contient maps et Vehicles (toute installation complète). L'exécutable est le programme omsi de cette réécriture ; il est trouvé tout seul s'il est à côté du lanceur."
  uk: "Тека OMSI 2 - та, де є maps і Vehicles (будь-яка повна інсталяція). Виконуваний файл гри - програма openomsi; він знаходиться сам, якщо лежить поруч з лаунчером."
  be: "Тэчка OMSI 2 - тая, дзе ёсць maps і Vehicles (любая поўная інсталяцыя). Выканальны файл гульні - праграма openomsi; ён знаходзіцца сам, калі ляжыць побач з лаўнчарам."
  kk: "OMSI 2 қалтасы - ішінде maps және Vehicles бар қалта (кез келген толық орнату). Ойын бинарлығы - openomsi бағдарламасы; ол лаунчердің қасында тұрса, өзі табылады."
  pl: "Folder OMSI 2 to ten z maps i Vehicles w środku (dowolna pełna instalacja). Plik gry to program openomsi; znajduje się sam, gdy leży obok launchera."
  cs: "Složka OMSI 2 je ta, ve které jsou maps a Vehicles (jakákoli úplná instalace). Binárka hry je program openomsi; najde se sama, pokud leží vedle launcheru."
  hu: "Az OMSI 2 mappa az otthona a maps és a Vehicles mappádnak.(bármely teljes telepítés). A futtatható fájl az openomsi program; ami automatikusan észlelésre kerül, ha a launcher-el egy mappában vannak."
  es: "La carpeta de OMSI 2 es la que contiene maps y Vehicles (cualquier instalación completa). El binario del juego es el programa openomsi; se encuentra solo cuando está junto al lanzador."
  pt: "A pasta do OMSI 2 é a que contém maps e Vehicles (qualquer instalação completa). O executável do jogo é o programa openomsi; ele é encontrado sozinho quando está ao lado do launcher."
  pt-pt: "A pasta do OMSI 2 é a que contém maps e Vehicles (qualquer instalação completa). O executável do jogo é o programa openomsi; ele é encontrado sozinho quando está ao lado do launcher."
  it: "La cartella OMSI 2 è quella con maps e Vehicles (qualsiasi installazione completa). L'eseguibile del gioco è il programma openomsi; viene trovato da solo se sta accanto al launcher."
  nl: "De OMSI 2-map is de map met maps en Vehicles (elke complete installatie). Het spelprogramma is het programma openomsi; het wordt vanzelf gevonden als het naast de launcher staat."
  tr: "OMSI 2 klasörü, içinde maps ve Vehicles bulunan klasördür (herhangi bir tam kurulum). Oyun programı openomsi programıdır; başlatıcının yanında durduğunda kendiliğinden bulunur."
  ja: "OMSI 2フォルダとは、mapsとVehiclesが入っているフォルダです(完全なインストールであれば可)。ゲーム本体はopenomsiプログラムで、ランチャーの隣にあれば自動的に見つかります。"
  zh: "OMSI 2文件夹是包含maps和Vehicles的那个文件夹(任何完整安装均可)。游戏程序即openomsi程序;当它位于启动器旁边时会被自动找到。"
  hi: "OMSI 2 फ़ोल्डर वह है जिसमें maps और Vehicles हों (कोई भी पूरा इंस्टॉलेशन)। गेम बाइनरी openomsi प्रोग्राम है; लॉन्चर के बगल में होने पर वह अपने आप मिल जाता है।"
  zh-tw: "OMSI 2 資料夾是包含 maps 及 Vehicles 的資料夾（任何完整安裝版本皆可）。遊戲執行檔即 openomsi 程式；當它位於啟動器旁時會自動被偵測到。"
