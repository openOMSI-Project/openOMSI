"Press the brake pedal all the way down and hold it, then press Next. No brake pedal: Skip.":
  ca: "Prem el pedal de fre a fons i mantén-lo premut; després prem Següent. Si no tens pedal de fre: Omet."
  ru: "Нажмите педаль тормоза до упора и удерживайте, затем нажмите «Далее». Нет педали тормоза: «Пропустить»."
  de: "Bremspedal ganz durchtreten und halten, dann Weiter drücken. Kein Bremspedal: Überspringen."
  fr: "Enfoncez la pédale de frein à fond et maintenez-la, puis appuyez sur Suivant. Pas de pédale de frein : Ignorer."
  uk: "Натисніть педаль гальма до упору й утримуйте, потім натисніть «Далі». Немає педалі гальма: «Пропустити»."
  be: "Націсніце педаль тормаза да ўпору і ўтрымлівайце, потым націсніце «Далей». Няма педалі тормаза: «Прапусціць»."
  kk: "Тежегіш педалін соңына дейін басып ұстаңыз, сосын Келесі басыңыз. Тежегіш педалі жоқ: Өткізу."
  pl: "Wciśnij pedał hamulca do końca i przytrzymaj, potem naciśnij Dalej. Brak pedału hamulca: Pomiń."
  cs: "Sešlápněte brzdový pedál až na doraz a držte, pak stiskněte Další. Bez brzdového pedálu: Přeskočit."
  hu: "Nyomd le teljesen a fékpedált és tartsd, majd nyomd meg a Következő gombot. Nincs fékpedál: Kihagyás."
  es: "Pisa el pedal de freno hasta el fondo y mantenlo, luego pulsa Siguiente. Sin pedal de freno: Omitir."
  pt: "Pise o pedal de freio até o fundo e segure, depois pressione Próximo. Sem pedal de freio: Pular."
  pt-pt: "Pise o pedal de freio até o fundo e segure, depois prima Próximo. Sem pedal de freio: Pular."
  it: "Premi il pedale del freno a fondo e tienilo, poi premi Avanti. Nessun pedale del freno: Salta."
  nl: "Trap het rempedaal helemaal in en houd vast, druk dan op Volgende. Geen rempedaal: Overslaan."
  tr: "Fren pedalına sonuna kadar basıp tutun, sonra Sonraki'ye basın. Fren pedalı yoksa: Atla."
  ja: "ブレーキペダルを一番奥まで踏み込んで保持し、「次へ」を押してください。ブレーキペダルがない場合:スキップ。"
  zh: "将刹车踏板一直踩到底并保持,然后按“下一步”。没有刹车踏板:跳过。"
  hi: "ब्रेक पैडल को पूरा दबाकर रखें, फिर अगला दबाएँ। ब्रेक पैडल नहीं है: छोड़ें।"
  zh-tw: "請將煞車踏板踩到底並保持住，然後按「下一步」。無煞車踏板：略過。"
"Press the clutch pedal all the way down and hold it, then press Next. No clutch: Skip.":
  ca: "Prem l'embragatge a fons i mantén-lo premut; després prem Següent. Si no tens embragatge: Omet."
  ru: "Нажмите педаль сцепления до упора и удерживайте, затем нажмите «Далее». Нет сцепления: «Пропустить»."
  de: "Kupplungspedal ganz durchtreten und halten, dann Weiter drücken. Keine Kupplung: Überspringen."
  fr: "Enfoncez la pédale d'embrayage à fond et maintenez-la, puis appuyez sur Suivant. Pas d'embrayage : Ignorer."
  uk: "Натисніть педаль зчеплення до упору й утримуйте, потім натисніть «Далі». Немає зчеплення: «Пропустити»."
  be: "Націсніце педаль счаплення да ўпору і ўтрымлівайце, потым націсніце «Далей». Няма счаплення: «Прапусціць»."
  kk: "Ілініс педалін соңына дейін басып ұстаңыз, сосын Келесі басыңыз. Ілініс жоқ: Өткізу."
  pl: "Wciśnij pedał sprzęgła do końca i przytrzymaj, potem naciśnij Dalej. Brak sprzęgła: Pomiń."
  cs: "Sešlápněte spojkový pedál až na doraz a držte, pak stiskněte Další. Bez spojky: Přeskočit."
  hu: "Nyomd le teljesen a tengelykapcsoló-pedált és tartsd, majd nyomd meg a Következő gombot. Nincs tengelykapcsoló: Kihagyás."
  es: "Pisa el pedal de embrague hasta el fondo y mantenlo, luego pulsa Siguiente. Sin embrague: Omitir."
  pt: "Pise o pedal de embreagem até o fundo e segure, depois pressione Próximo. Sem embreagem: Pular."
  pt-pt: "Pise o pedal de embreagem até o fundo e segure, depois prima Próximo. Sem embreagem: Pular."
  it: "Premi il pedale della frizione a fondo e tienilo, poi premi Avanti. Nessuna frizione: Salta."
  nl: "Trap het koppelingspedaal helemaal in en houd vast, druk dan op Volgende. Geen koppeling: Overslaan."
  tr: "Debriyaj pedalına sonuna kadar basıp tutun, sonra Sonraki'ye basın. Debriyaj yoksa: Atla."
  ja: "クラッチペダルを一番奥まで踏み込んで保持し、「次へ」を押してください。クラッチがない場合:スキップ。"
  zh: "将离合踏板一直踩到底并保持,然后按“下一步”。没有离合:跳过。"
  hi: "क्लच पैडल को पूरा दबाकर रखें, फिर अगला दबाएँ। क्लच नहीं है: छोड़ें।"
  zh-tw: "請將離合器踏板踩到底並保持住，然後按「下一步」。無離合器：略過。"
