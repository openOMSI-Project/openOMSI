  ca: "Assignacions desades; s'ha activat Controls personalitzats a Tecles de conducció perquè el joc les utilitzi."
  ru: "Назначения клавиш сохранены; «Клавиши вождения» переключены на «Свои настройки», чтобы игра их использовала."
  de: "Tastenbelegung gespeichert; Fahrtasten auf „Eigene Steuerung“ umgestellt, damit das Spiel sie nutzt."
