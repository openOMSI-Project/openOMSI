"Nothing moved far enough. Hold it all the way, then press Next (or Skip).":
  ca: "Cap control s'ha mogut prou. Mantén-lo al màxim i prem Següent (o Omet)."
  ru: "Ничего не сдвинулось достаточно далеко. Удерживайте до упора, затем нажмите «Далее» (или «Пропустить»)."
  de: "Nichts wurde weit genug bewegt. Bis zum Anschlag halten, dann Weiter (oder Überspringen) drücken."
  fr: "Rien n'a bougé assez loin. Maintenez jusqu'en butée, puis appuyez sur Suivant (ou Ignorer)."
  uk: "Нічого не зрушилося достатньо. Утримуйте до упору, потім натисніть «Далі» (або «Пропустити»)."
  be: "Нічога не зрушылася дастаткова. Утрымлівайце да ўпору, потым націсніце «Далей» (або «Прапусціць»)."
  kk: "Жеткілікті қозғалмады. Соңына дейін ұстап тұрып, Келесі (немесе Өткізу) басыңыз."
  pl: "Za mało ruchu. Przytrzymaj do końca, potem naciśnij Dalej (lub Pomiń)."
  cs: "Nic se nepohnulo dost daleko. Držte to na doraz a stiskněte Další (nebo Přeskočit)."
  hu: "Nem mozdult el eléggé. Tartsd teljesen benyomva, majd nyomd meg a Következő gombot (vagy Kihagyás)."
  es: "Nada se movió lo suficiente. Mantenlo del todo y pulsa Siguiente (u Omitir)."
  pt: "Nada se moveu o suficiente. Segure até o fim e pressione Próximo (ou Pular)."
  pt-pt: "Nada se moveu o suficiente. Segure até o fim e prima Próximo (ou Pular)."
  it: "Non si è mosso abbastanza. Tienilo fino in fondo, poi premi Avanti (o Salta)."
  nl: "Niet ver genoeg bewogen. Houd het helemaal ingedrukt en druk dan op Volgende (of Overslaan)."
  tr: "Yeterince hareket eden bir şey yok. Sonuna kadar tutun, sonra Sonraki'ye (veya Atla'ya) basın."
  ja: "十分に動きませんでした。最後まで倒して保持し、「次へ」を押してください(または「スキップ」)。"
  zh: "移动幅度不够。请推到底并保持,然后按“下一步”(或“跳过”)。"
  hi: "कुछ भी पर्याप्त नहीं हिला। उसे पूरा दबाए रखें, फिर अगला (या छोड़ें) दबाएँ।"
