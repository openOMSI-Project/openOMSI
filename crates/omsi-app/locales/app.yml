"A game is running already (its window may be behind this one - see Sessions). Click again to start another one anyway.":
  ca: "Ja hi ha una partida en marxa (la finestra pot ser darrere d'aquesta; consulta Sessions). Torna a clicar per iniciar-ne una altra igualment."
  ru: "Игра уже запущена (её окно может быть позади - см. «Сессии»). Нажмите ещё раз, чтобы запустить ещё одну."
  de: "Ein Spiel läuft bereits (sein Fenster liegt vielleicht dahinter - siehe Sitzungen). Nochmals klicken, um trotzdem ein weiteres zu starten."
  fr: "Une partie est déjà lancée (sa fenêtre est peut-être derrière - voir Sessions). Cliquez encore pour en lancer une autre."
  uk: "Гра вже запущена (її вікно може бути позаду цього - див. «Сесії»). Натисніть ще раз, щоб усе одно запустити ще одну."
  be: "Гульня ўжо запушчана (яе акно можа быць ззаду гэтага - гл. «Сесіі»). Націсніце яшчэ раз, каб усё роўна запусціць яшчэ адну."
  kk: "Ойын қазірдің өзінде жұмыс істеп тұр (терезесі осының артында болуы мүмкін - Сессияларды қараңыз). Бәрібір тағы біреуін бастау үшін қайта басыңыз."
  pl: "Gra już działa (jej okno może być za tym - zobacz Sesje). Kliknij ponownie, aby mimo to uruchomić kolejną."
  cs: "Hra už běží (její okno může být za tímto - viz Relace). Klepnutím znovu přesto spustíte další."
  hu: "Már fut egy játékmenet (az ablaka lehet, hogy e mögött van - lásd Munkamenetek). Kattints mégegyszer, hogy mindenképpen újat indíts!"
  es: "Ya hay una partida en marcha (su ventana puede estar detrás de esta; mira Sesiones). Haz clic de nuevo para iniciar otra igualmente."
  pt: "Já há uma partida em andamento (a janela pode estar atrás desta; veja Sessões). Clique de novo para iniciar outra mesmo assim."
  pt-pt: "Já há uma partida em andamento (a janela pode estar atrás desta; veja Sessões). Clique de novo para iniciar outra mesmo assim."
  it: "Un gioco è già in esecuzione (la sua finestra può essere dietro questa - vedi Sessioni). Clicca di nuovo per avviarne comunque un altro."
  nl: "Er draait al een spel (het venster kan achter dit venster staan - zie Sessies). Klik nogmaals om toch nog een spel te starten."
  tr: "Zaten bir oyun çalışıyor (penceresi bunun arkasında olabilir - Oturumlar'a bakın). Yine de başka bir tane başlatmak için tekrar tıklayın."
  ja: "すでにゲームが起動しています(ウィンドウがこの後ろにあるかもしれません。セッションを参照)。もう一度クリックすると、別のゲームを起動します。"
  zh: "游戏正在运行(其窗口可能在此窗口后面,见“会话”)。再次点击将仍然启动另一个游戏。"
  hi: "एक गेम पहले से चल रहा है (उसकी विंडो इसके पीछे हो सकती है - सेशन देखें)। फिर भी दूसरा शुरू करने के लिए दोबारा क्लिक करें।"
  zh-tw: "已有遊戲正在執行（視窗可能在後方，請查看「遊戲工作階段」）。如要再啟動一個遊戲，請再按一次。"
  ko: "이미 게임이 실행 중입니다 (창이 뒤에 있을 수 있으니 세션을 확인하세요). 새 게임을 시작하려면 다시 클릭하세요."
  th: "มีเกมกำลังทำงานอยู่แล้ว (หน้าต่างอาจอยู่ด้านหลัง ดูหน้าเซสชัน) คลิกอีกครั้งหากต้องการเริ่มเกมใหม่"
  vi: "Một trò chơi đang chạy (cửa sổ có thể ở phía sau, xem Phiên chơi). Nhấp lại để bắt đầu thêm trò chơi."
  id: "Game sudah berjalan (jendelanya mungkin berada di belakang, lihat Sesi). Klik lagi untuk memulai game lain."
  ms: "Permainan sudah berjalan (tetingkap mungkin di belakang, lihat Sesi). Klik sekali lagi untuk mula permainan baharu."
  tl: "May tumatakbong laro na (maaaring nasa likod ang window, tingnan ang Sessions). Pindutin ulit para magbukas ng isa pa."
