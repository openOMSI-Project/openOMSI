  hi: "सेशन के लिए ओरिजिनल OMSI 2 चाहिए: पहले सेटअप में उसका फ़ोल्डर चुनें।"
  zh-tw: "遊戲工作階段需要原版 OMSI 2。請先在「初始設定」選擇其資料夾。"
  ko: "세션에는 원본 OMSI 2가 필요합니다. 먼저 초기 설정에서 폴더를 선택하세요."
  th: "ต้องมี OMSI 2 ต้นฉบับ เลือกโฟลเดอร์ในหน้าตั้งค่าเริ่มต้นก่อน"
