"No game controller is connected, and none is set up. Connect a wheel, pedals or a joystick; a gamepad works without setting up (left stick steers, the triggers are the pedals).":
  ca: "No hi ha cap dispositiu de joc connectat ni configurat. Connecta un volant, pedals o un joystick; un comandament funciona sense configurar-lo (joystick esquerre per girar i gallets com a pedals)."
  ru: "Игровой контроллер не подключён и не настроен. Подключите руль, педали или джойстик; геймпад работает без настройки (левый стик — руль, триггеры — педали)."
  de: "Kein Gamecontroller verbunden und keiner eingerichtet. Schließe ein Lenkrad, Pedale oder einen Joystick an; ein Gamepad funktioniert ohne Einrichtung (linker Stick lenkt, die Trigger sind die Pedale)."
  fr: "Aucune manette n'est connectée ni configurée. Branchez un volant, des pédales ou un joystick ; une manette fonctionne sans configuration (le stick gauche dirige, les gâchettes sont les pédales)."
  uk: "Ігровий контролер не підключено й не налаштовано. Підключіть кермо, педалі чи джойстик; геймпад працює без налаштування (лівий стік - кермо, тригери - педалі)."
  be: "Гульнявы кантролер не падключаны і не наладжаны. Падключыце руль, педалі ці джойсцік; геймпад працуе без наладжвання (левы стык - руль, трыгеры - педалі)."
  kk: "Ойын контроллері қосылмаған және бапталмаған. Руль, педальдар немесе джойстик қосыңыз; геймпад баптаусыз жұмыс істейді (сол стик рульдейді, триггерлер - педальдар)."
  pl: "Nie podłączono ani nie skonfigurowano kontrolera. Podłącz kierownicę, pedały lub joystick; gamepad działa bez konfiguracji (lewa gałka skręca, spusty to pedały)."
  cs: "Není připojen žádný herní ovladač a žádný není nastaven. Připojte volant, pedály nebo joystick; gamepad funguje bez nastavení (levá páčka řídí, spouště jsou pedály)."
  hu: "Nincs játékvezérlő csatlakoztatva, és egy sincs beállítva. Csatlakoztass kormányt, pedálokat vagy joysticket; a gamepad beállítás nélkül működik (bal kar kormányoz, a ravaszok a pedálok)."
  es: "No hay ningún mando de juego conectado ni configurado. Conecta un volante, pedales o un joystick; un gamepad funciona sin configurar (el stick izquierdo gira, los gatillos son los pedales)."
  pt: "Nenhum controle de jogo está conectado ou configurado. Conecte um volante, pedais ou um joystick; um gamepad funciona sem configurar (o analógico esquerdo vira, os gatilhos são os pedais)."
  pt-pt: "Nenhum controlador de jogo está conectado ou configurado. Conecte um volante, pedais ou um joystick; um gamepad funciona sem configurar (o analógico esquerdo vira, os gatilhos são os pedais)."
  it: "Nessun controller di gioco collegato né configurato. Collega un volante, dei pedali o un joystick; un gamepad funziona senza configurazione (stick sinistro sterza, i grilletti sono i pedali)."
  nl: "Er is geen gamecontroller aangesloten of ingesteld. Sluit een stuurwiel, pedalen of joystick aan; een gamepad werkt zonder instellen (linker stick stuurt, de triggers zijn de pedalen)."
  tr: "Bağlı oyun kumandası yok ve hiçbiri ayarlanmamış. Bir direksiyon, pedal veya joystick bağlayın; gamepad ayarsız çalışır (sol çubuk yönlendirir, tetikler pedaldır)."
  ja: "ゲームコントローラーが接続されておらず、設定もされていません。ハンドル、ペダル、ジョイスティックを接続してください。ゲームパッドは設定なしで使えます(左スティックで操舵、トリガーがペダル)。"
  zh: "未连接游戏手柄,也未设置。请连接方向盘、踏板或摇杆;游戏手柄无需设置即可使用(左摇杆转向,扳机键为踏板)。"
  hi: "कोई गेम कंट्रोलर जुड़ा नहीं है और न ही कोई सेट है। व्हील, पैडल या जॉयस्टिक जोड़ें; गेमपैड बिना सेटअप के काम करता है (बायाँ स्टिक स्टीयर करता है, ट्रिगर पैडल हैं)।"
  zh-tw: "未連接遊戲控制器，且尚未設定。請連接方向盤、踏板或搖桿；手把無須設定即可使用（左搖桿轉向，扳機鍵為踏板）。"
