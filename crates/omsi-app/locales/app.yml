"The original OMSI 2 was not found automatically: choose its folder (the one with OMSI, maps and Vehicles) and press Save.":
  ca: "No s'ha trobat automàticament l'OMSI 2 original: tria'n la carpeta (la que conté OMSI, maps i Vehicles) i prem Desa."
  ru: "Оригинальная OMSI 2 не найдена автоматически: выберите её папку (где OMSI, maps и Vehicles) и нажмите «Сохранить»."
  de: "Das originale OMSI 2 wurde nicht automatisch gefunden: wähle seinen Ordner (mit OMSI, maps und Vehicles) und drücke Speichern."
  fr: "L'OMSI 2 original n'a pas été trouvé automatiquement : choisissez son dossier (celui avec OMSI, maps et Vehicles) et appuyez sur Enregistrer."
  uk: "Оригінальну OMSI 2 не знайдено автоматично: оберіть її теку (де є OMSI, maps і Vehicles) і натисніть «Зберегти»."
  be: "Арыгінальную OMSI 2 не знойдзена аўтаматычна: абярыце яе тэчку (дзе ёсць OMSI, maps і Vehicles) і націсніце «Захаваць»."
  kk: "Түпнұсқа OMSI 2 автоматты түрде табылмады: оның қалтасын (OMSI, maps және Vehicles бар қалта) таңдап, Сақтау түймесін басыңыз."
  pl: "Nie znaleziono oryginalnego OMSI 2: wybierz jego folder (ten z OMSI, maps i Vehicles) i naciśnij Zapisz."
  cs: "Původní OMSI 2 nebylo nalezeno automaticky: vyberte jeho složku (tu s OMSI, maps a Vehicles) a stiskněte Uložit."
  hu: "Az eredeti OMSI 2 nem található automatikusan: válaszd ki a mappáját (amelyikben az OMSI, a maps és a Vehicles van), és nyomd meg a Mentés gombot."
  es: "No se encontró el OMSI 2 original automáticamente: elige su carpeta (la que contiene OMSI, maps y Vehicles) y pulsa Guardar."
  pt: "O OMSI 2 original não foi encontrado automaticamente: escolha a pasta dele (a que contém OMSI, maps e Vehicles) e pressione Salvar."
  pt-pt: "O OMSI 2 original não foi encontrado automaticamente: escolha a pasta dele (a que contém OMSI, maps e Vehicles) e prima Guardar."
  it: "L'OMSI 2 originale non è stato trovato automaticamente: scegli la sua cartella (quella con OMSI, maps e Vehicles) e premi Salva."
  nl: "De originele OMSI 2 is niet automatisch gevonden: kies de map (die met OMSI, maps en Vehicles) en druk op Opslaan."
  tr: "Orijinal OMSI 2 otomatik olarak bulunamadı: klasörünü (OMSI, maps ve Vehicles içeren) seçip Kaydet'e basın."
  ja: "元のOMSI 2が自動では見つかりませんでした。そのフォルダ(OMSI、maps、Vehiclesが入っているもの)を選んで「保存」を押してください。"
  zh: "未能自动找到原版OMSI 2:请选择其文件夹(包含OMSI、maps和Vehicles的那个)并按“保存”。"
  hi: "ओरिजिनल OMSI 2 अपने आप नहीं मिला: उसका फ़ोल्डर (जिसमें OMSI, maps और Vehicles हों) चुनें और Save दबाएँ।"
  zh-tw: "未能自動找到原版 OMSI 2：請選擇包含 OMSI、maps 及 Vehicles 的資料夾，再按「儲存」。"
  ko: "원본 OMSI 2를 자동으로 찾을 수 없습니다. OMSI, maps, Vehicles가 있는 폴더를 선택하고 저장하세요."
  th: "ไม่พบ OMSI 2 ต้นฉบับ เลือกโฟลเดอร์ที่มี OMSI, maps และ Vehicles แล้วกดบันทึก"
  vi: "Không tìm thấy OMSI 2 gốc. Chọn thư mục chứa OMSI, maps và Vehicles rồi nhấn Lưu."
  id: "OMSI 2 asli tidak ditemukan. Pilih folder yang berisi OMSI, maps, dan Vehicles, lalu tekan Simpan."
  ms: "OMSI 2 asal tidak ditemui. Pilih folder yang mengandungi OMSI, maps dan Vehicles, kemudian tekan Simpan."
  tl: "Hindi nakita ang orihinal na OMSI 2. Piliin ang folder na may OMSI, maps at Vehicles, saka pindutin ang Save."
"The driver whose personnel file the game writes: hours, kilometres, punctuality, tickets.":
  ca: "El conductor del qual el joc desa l'expedient: hores, quilòmetres, puntualitat i bitllets."
  ru: "Водитель, в личное дело которого игра пишет: часы, километры, пунктуальность, билеты."
  de: "Der Fahrer, dessen Personalakte das Spiel führt: Stunden, Kilometer, Pünktlichkeit, Fahrscheine."
  fr: "Le conducteur dont le jeu tient le dossier : heures, kilomètres, ponctualité, billets."
  uk: "Водій, чиє особове діло веде гра: години, кілометри, пунктуальність, квитки."
  be: "Вадзіцель, чыю асабістую справу вядзе гульня: гадзіны, кіламетры, пунктуальнасць, білеты."
  kk: "Ойын жеке іс парағын жазатын жүргізуші: сағаттар, километрлер, тұрақтылық, билеттер."
  pl: "Kierowca, dla którego gra prowadzi akta osobowe: godziny, kilometry, punktualność, bilety."
  cs: "Řidič, jehož osobní spis hra vede: hodiny, kilometry, dochvilnost, jízdenky."
  hu: "A sofőr, akinek a személyi lapját a játék vezeti: Órák, kilométerek, pontosság, jegyeladások és sok más."
  es: "El conductor cuyo expediente escribe el juego: horas, kilómetros, puntualidad, billetes."
  pt: "O motorista cujo registro o jogo mantém: horas, quilômetros, pontualidade e passagens."
  pt-pt: "O condutor cujo registro o jogo mantém: horas, quilómetros, pontualidade e bilhetes."
  it: "Il conducente del cui fascicolo personale il gioco tiene traccia: ore, chilometri, puntualità, biglietti."
  nl: "De bestuurder van wie het spel het personeelsdossier bijhoudt: uren, kilometers, punctualiteit, kaartjes."
  tr: "Oyunun özlük dosyasını yazdığı sürücü: saat, kilometre, dakiklik, biletler."
  ja: "ゲームが人事ファイルに記録する運転手:時間、キロ数、定時性、乗車券。"
  zh: "游戏为其写入人事档案的司机:工时、公里数、准点率、车票。"
  hi: "वह ड्राइवर जिसकी पर्सनल फ़ाइल गेम लिखता है: घंटे, किलोमीटर, समय-पालन, टिकट।"
  zh-tw: "遊戲會為這名司機記錄駕駛時數、里程、準時率及售票數據。"
  ko: "게임이 이 운전자의 운전 시간, 거리, 정시성, 승차권 판매를 기록합니다."
  th: "เกมจะบันทึกชั่วโมงขับรถ ระยะทาง ความตรงเวลา และการขายตั๋วของคนขับนี้"
  vi: "Trò chơi ghi lại số giờ lái, quãng đường, độ đúng giờ và vé đã bán của tài xế này."
  id: "Game mencatat jam, kilometer, ketepatan waktu, dan tiket pengemudi ini."
  ms: "Permainan merekod jam, kilometer, ketepatan masa dan tiket pemandu ini."
  tl: "Itinatala ng laro ang oras, kilometro, pagiging nasa oras at tickets ng driver na ito."
