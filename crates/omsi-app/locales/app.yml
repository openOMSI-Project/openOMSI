"The bus fell through the ground: it was put back where it last stood":
  ca: "L'autobús ha travessat el terra: s'ha tornat a posar a l'última posició estable"
  ru: "Автобус провалился под землю: он возвращён на последнее место стоянки"
  de: "Der Bus ist durch den Boden gefallen: Er wurde dorthin zurückgesetzt, wo er zuletzt stand"
  fr: "Le bus est passé à travers le sol : il a été remis là où il se trouvait"
  uk: "Автобус провалився крізь землю: його повернуто туди, де він стояв востаннє"
  be: "Аўтобус праваліўся скрозь зямлю: яго вернута туды, дзе ён стаяў апошні раз"
  kk: "Автобус жерден өтіп кетті: ол соңғы тұрған жеріне қайта қойылды"
  pl: "Autobus przeleciał przez ziemię: postawiono go z powrotem w ostatnim miejscu"
  cs: "Autobus propadl zemí: byl vrácen na poslední místo"
  hu: "A busz átesett a talajon: visszatettük oda, ahol utoljára állt"
  es: "El autobús cayó a través del suelo: se ha vuelto a poner donde estuvo por última vez"
  pt: "O ônibus atravessou o chão: foi recolocado onde estava por último"
  pt-pt: "O autocarro atravessou o chão: foi recolocado onde estava por último"
  it: "Il bus è caduto attraverso il terreno: è stato rimesso dov'era l'ultima volta"
  nl: "De bus viel door de grond: hij is teruggezet waar hij het laatst stond"
  tr: "Otobüs zeminden düştü: en son durduğu yere geri konuldu"
  ja: "バスが地面を抜け落ちたため、最後にいた場所に戻しました"
  zh: "巴士穿过了地面:已放回它上次所在的位置"
  hi: "बस ज़मीन के आर-पार गिर गई: उसे आखिरी जगह पर वापस रख दिया गया"
  zh-tw: "巴士掉入地面穿模：已將其放回最後停放的位置"
"The bus stands where the map was clicked":
  ca: "L'autobús és on has clicat al mapa"
  ru: "Автобус стоит там, где щёлкнули по карте"
  de: "Der Bus steht dort, wo auf die Karte geklickt wurde"
  fr: "Le bus se trouve là où la carte a été cliquée"
  uk: "Автобус стоїть там, де клацнули на мапі"
  be: "Аўтобус стаіць там, дзе пстрыкнулі на мапе"
  kk: "Автобус картада басылған жерде тұр"
  pl: "Autobus stoi tam, gdzie kliknięto na mapie"
  cs: "Autobus stojí tam, kam jste klikli na mapě"
  hu: "A busz ott áll, ahová a térképen kattintottál"
  es: "El autobús está donde se hizo clic en el mapa"
  pt: "O ônibus está onde o mapa foi clicado"
  pt-pt: "O autocarro está onde o mapa foi clicado"
  it: "Il bus si trova dove hai cliccato sulla mappa"
  nl: "De bus staat waar op de kaart is geklikt"
  tr: "Otobüs haritada tıklanan yerde duruyor"
  ja: "バスはマップでクリックした場所にあります"
  zh: "巴士停在地图上点击的位置"
  hi: "बस वहीं खड़ी है जहाँ मैप पर क्लिक किया गया"
  zh-tw: "巴士已放置於地圖上點選的位置"
"The device is not connected: plug it in (the list on the left marks it green).":
  ca: "El dispositiu no està connectat: connecta'l (la llista de l'esquerra el marca en verd)."
  ru: "Устройство не подключено: подключите его (в списке слева оно отмечено зелёным)."
  de: "Das Gerät ist nicht verbunden: Stecke es an (in der Liste links ist es grün markiert)."
  fr: "L'appareil n'est pas connecté : branchez-le (la liste de gauche le marque en vert)."
  uk: "Пристрій не підключено: підключіть його (у списку ліворуч він позначений зеленим)."
  be: "Прылада не падключана: падключыце яе (у спісе злева яна пазначана зялёным)."
  kk: "Құрылғы қосылмаған: оны қосыңыз (сол жақтағы тізімде жасыл болып белгіленеді)."
  pl: "Urządzenie nie jest podłączone: podłącz je (lista po lewej oznacza je na zielono)."
  cs: "Zařízení není připojeno: připojte ho (seznam vlevo ho označí zeleně)."
  hu: "Az eszköz nincs csatlakoztatva: dugd be (a bal oldali lista zölddel jelöli)."
  es: "El dispositivo no está conectado: enchúfalo (la lista de la izquierda lo marca en verde)."
  pt: "O dispositivo não está conectado: ligue-o (a lista à esquerda o marca em verde)."
  pt-pt: "O dispositivo não está conectado: ligue-o (a lista à esquerda o marca em verde)."
  it: "Il dispositivo non è collegato: collegalo (l'elenco a sinistra lo segna in verde)."
  nl: "Het apparaat is niet aangesloten: sluit het aan (de lijst links markeert het groen)."
  tr: "Cihaz bağlı değil: takın (soldaki listede yeşil işaretlenir)."
  ja: "デバイスが接続されていません:接続してください(左のリストで緑色になります)。"
  zh: "设备未连接:请插上设备(左侧列表中会标为绿色)。"
  hi: "डिवाइस जुड़ा नहीं है: उसे लगाएँ (बाईं सूची में वह हरा दिखता है)।"
  zh-tw: "裝置未連線：請插上裝置（左側清單會以綠色標示）。"
"The device shows no axis yet: move the wheel and the pedals a little, let go, and press Next again.":
  ca: "El dispositiu encara no mostra cap eix: mou una mica el volant i els pedals, deixa'ls anar i torna a prémer Següent."
  ru: "Устройство пока не показывает ни одной оси: немного подвигайте руль и педали, отпустите и снова нажмите «Далее»."
  de: "Das Gerät zeigt noch keine Achse: Bewege Lenkrad und Pedale ein wenig, lass los und drücke erneut Weiter."
  fr: "L'appareil n'affiche encore aucun axe : bougez un peu le volant et les pédales, relâchez, puis appuyez de nouveau sur Suivant."
  uk: "Пристрій ще не показує осей: трохи поверніть кермо й натисніть педалі, відпустіть і знову натисніть «Далі»."
  be: "Прылада яшчэ не паказвае восей: трохі павярніце руль і націсніце педалі, адпусціце і зноў націсніце «Далей»."
  kk: "Құрылғыда әлі ось көрінбейді: рульді және педальдарды сәл қозғаңыз, жіберіңіз де, қайта Келесі басыңыз."
  pl: "Urządzenie nie pokazuje jeszcze osi: poruszaj trochę kierownicą i pedałami, puść i naciśnij Dalej ponownie."
  cs: "Zařízení zatím nehlásí žádnou osu: trochu pohněte volantem a pedály, pusťte a stiskněte znovu Další."
  hu: "Az eszköz még nem mutat tengelyt: mozgasd kicsit a kormányt és a pedálokat, engedd el, és nyomd meg újra a Következő gombot."
  es: "El dispositivo aún no muestra ningún eje: mueve un poco el volante y los pedales, suelta y pulsa Siguiente de nuevo."
  pt: "O dispositivo ainda não mostra nenhum eixo: mova um pouco o volante e os pedais, solte e pressione Próximo de novo."
  pt-pt: "O dispositivo ainda não mostra nenhum eixo: mova um pouco o volante e os pedais, solte e prima Próximo de novo."
  it: "Il dispositivo non mostra ancora alcun asse: muovi un po' il volante e i pedali, rilascia e premi di nuovo Avanti."
  nl: "Het apparaat toont nog geen as: beweeg het stuur en de pedalen even, laat los en druk nogmaals op Volgende."
  tr: "Cihaz henüz bir eksen göstermiyor: direksiyonu ve pedalları biraz oynatın, bırakın ve tekrar Sonraki'ye basın."
  ja: "デバイスにまだ軸が表示されません:ハンドルとペダルを少し動かして離し、もう一度「次へ」を押してください。"
  zh: "设备尚未显示任何轴:请稍微转动方向盘、踩一下踏板,松开后再按“下一步”。"
  hi: "डिवाइस में अभी कोई एक्सिस नहीं दिख रही: व्हील और पैडल थोड़ा हिलाएँ, छोड़ें और फिर अगला दबाएँ।"
  zh-tw: "裝置尚未偵測到任何軸向：請稍微轉動方向盤並踩下踏板，放開後再次按「下一步」。"
"The engine is off  (E electrics, M starter; mod buses with an ignition key turn it with E: press again and hold. Shift+U does it all)":
  ca: "El motor està apagat  (E per al sistema elèctric, M per arrencar; als mods amb clau de contacte, gira-la amb E: torna a prémer i mantén-la. Maj+U ho fa tot)"
  ru: "Двигатель выключен  (E — электрика, M — стартёр; у модовых автобусов с ключом зажигания запуск по E: нажмите ещё раз и удерживайте. Shift+U делает всё сразу)"
  de: "Der Motor ist aus  (E Elektrik, M Anlasser; Mod-Busse mit Zündschlüssel starten mit E: erneut drücken und halten. Shift+U macht alles)"
  fr: "Le moteur est coupé  (E électricité, M démarreur ; les bus de mods avec clé de contact démarrent avec E : appuyez de nouveau et maintenez. Shift+U fait tout)"
  uk: "Двигун вимкнено  (E - електрика, M - стартер; на модових автобусах із ключем запалювання поверніть ключ через E: натисніть ще раз і утримуйте. Shift+U робить усе)"
  be: "Рухавік выключаны  (E - электрыка, M - стартар; на модавых аўтобусах з ключом запальвання павярніце ключ праз E: націсніце яшчэ раз і ўтрымлівайце. Shift+U робіць усё)"
  kk: "Қозғалтқыш өшірулі  (E электрика, M стартер; тұтану кілті бар мод автобустар оны E-мен бұрады: қайта басып ұстаңыз. Shift+U бәрін өзі жасайды)"
  pl: "Silnik wyłączony  (E elektryka, M rozrusznik; mody z kluczykiem uruchamia się E: naciśnij ponownie i przytrzymaj. Shift+U robi wszystko)"
  cs: "Motor je vypnutý  (E elektrika, M startér; mod autobusy se zapalovacím klíčkem ho zapnou E: stiskněte znovu a držte. Shift+U udělá vše)"
  hu: "A motor nem jár.  (E elektromosság, M önindító; bizonyos mod buszokat csak E gombbal kell indítani: nyomd meg újra és tartsd. A Shift+U mindent elintéz)"
  es: "El motor está apagado  (E electricidad, M arranque; los autobuses mod con llave de contacto lo giran con E: pulsa de nuevo y mantén. Shift+U lo hace todo)"
  pt: "O motor está desligado  (E elétrica, M partida; ônibus mod com chave de ignição a giram com E: pressione de novo e segure. Shift+U faz tudo)"
  pt-pt: "O motor está desligado  (E elétrica, M partida; autocarro mod com chave de ignição a giram com E: prima de novo e segure. Shift+U faz tudo)"
  it: "Il motore è spento  (E impianto elettrico, M avviamento; i bus mod con chiave di accensione la girano con E: premi di nuovo e tieni. Shift+U fa tutto)"
  nl: "De motor is uit  (E elektra, M starter; modbussen met contactsleutel draaien die met E: nogmaals drukken en vasthouden. Shift+U doet alles)"
  tr: "Motor kapalı  (E elektrik, M marş; kontak anahtarlı mod otobüsleri E ile çalıştırır: tekrar basıp tutun. Shift+U hepsini yapar)"
  ja: "エンジンがオフです(Eで電装、Mでスターター。イグニッションキーのあるModバスはEで始動:もう一度押して長押し。Shift+Uで全部行います)"
  zh: "发动机已熄火  (E 电气,M 启动器;带点火钥匙的模组巴士用E启动:再按一次并按住。Shift+U可一键完成)"
  hi: "इंजन बंद है  (E इलेक्ट्रिक्स, M स्टार्टर; इग्निशन की वाली मॉड बसें E से चालू होती हैं: फिर दबाकर रखें। Shift+U सब कर देता है)"
  zh-tw: "引擎已熄火（E 電源，M 啟動馬達；具點火鑰匙的模組車輛使用 E 發動：再次按下並按住。Shift+U 可一鍵完成）"
"The game closed on an error":
  ca: "El joc s'ha tancat per un error"
  ru: "Игра закрылась из-за ошибки"
  de: "Das Spiel wurde wegen eines Fehlers beendet"
  fr: "Le jeu s'est fermé sur une erreur"
  uk: "Гра закрилася з помилкою"
  be: "Гульня закрылася з памылкай"
  kk: "Ойын қатемен жабылды"
  pl: "Gra zamknęła się z błędem"
  cs: "Hra skončila chybou"
  hu: "A játék hiba miatt bezárult"
  es: "El juego se cerró por un error"
  pt: "O jogo fechou por causa de um erro"
  pt-pt: "O jogo fechou por causa de um erro"
  it: "Il gioco si è chiuso per un errore"
  nl: "Het spel sloot af door een fout"
  tr: "Oyun bir hata nedeniyle kapandı"
  ja: "ゲームがエラーで終了しました"
  zh: "游戏因错误而关闭"
  hi: "गेम एक त्रुटि पर बंद हो गया"
  zh-tw: "遊戲因發生錯誤而關閉"
"The game draws with DirectX 12 from the next start (Settings → Graphics API to change it back).":
  ca: "El joc farà servir DirectX 12 a partir de la propera arrencada (Configuració → API gràfica per tornar-ho a canviar)."
  ru: "Со следующего запуска игра использует DirectX 12 (вернуть можно в «Настройки → Графический API»)."
  de: "Ab dem nächsten Start rendert das Spiel mit DirectX 12 (Zurückstellen unter Einstellungen → Grafik-API)."
  fr: "Au prochain démarrage, le jeu utilise DirectX 12 (Réglages → API graphique pour revenir en arrière)."
  uk: "Гра малюватиме через DirectX 12 з наступного запуску («Налаштування» → «Графічний API» поверне назад)."
  be: "Гульня будзе маляваць праз DirectX 12 з наступнага запуску («Налады» → «Графічны API» верне назад)."
  kk: "Ойын келесі іске қосудан бастап DirectX 12 арқылы сызады (қайтару үшін Баптаулар → Графика API)."
  pl: "Gra będzie używać DirectX 12 od następnego uruchomienia (aby to cofnąć: Ustawienia → API grafiki)."
  cs: "Hra se od příštího spuštění vykresluje přes DirectX 12 (zpět změníte v Nastavení → Grafické API)."
  hu: "A játék a következő indítástól DirectX 12-vel rajzol (visszaállítás: Beállítások → Grafikai API)."
  es: "El juego dibujará con DirectX 12 desde el próximo inicio (Ajustes → API gráfica para volver)."
  pt: "O jogo vai renderizar com DirectX 12 a partir da próxima inicialização (Configurações → API gráfica para voltar)."
  pt-pt: "O jogo vai renderizar com DirectX 12 a partir da próxima inicialização (Definições → API gráfica para voltar)."
  it: "Il gioco userà DirectX 12 dal prossimo avvio (Impostazioni → API grafica per tornare indietro)."
  nl: "Het spel gebruikt DirectX 12 vanaf de volgende start (Instellingen → Grafische API om terug te zetten)."
  tr: "Oyun bir sonraki açılıştan itibaren DirectX 12 ile çizer (geri almak için Ayarlar → Grafik API'si)."
  ja: "次回の起動からゲームはDirectX 12で描画します(元に戻すには 設定 → グラフィックスAPI)。"
  zh: "从下次启动起,游戏将使用DirectX 12绘制(在 设置 → 图形API 中可改回)。"
  hi: "गेम अगली शुरुआत से DirectX 12 से ड्रा करेगा (वापस बदलने के लिए सेटिंग्स → ग्राफ़िक्स API)।"
  zh-tw: "遊戲將於下次啟動時使用 DirectX 12 渲染（可在「設定 → 圖形 API」中改回）。"
"The gearbox is in N: press D (Shift+D when W A S D drive), or click it. Buses like the Citaro take D only with the brake held":
  ca: "El canvi és en N: prem D (Maj+D si condueixes amb W A S D) o clica-hi. En autobusos com el Citaro cal mantenir el fre premut per posar D"
  ru: "КПП в положении N: нажмите D (Shift+D, если едете на W A S D) или щёлкните по ней. Автобусы вроде Citaro включают D только при нажатом тормозе"
  de: "Das Getriebe steht auf N: D drücken (Shift+D, wenn W A S D fährt) oder anklicken. Busse wie der Citaro nehmen D nur bei getretener Bremse"
  fr: "La boîte est sur N : appuyez sur D (Shift+D quand W A S D conduisent) ou cliquez dessus. Les bus comme le Citaro n'acceptent D que frein serré"
  uk: "Коробка на N: натисніть D (Shift+D, якщо кермують W A S D) або клацніть на ній. Автобуси на кшталт Citaro беруть D лише з утримуваним гальмом"
  be: "Каробка на N: націсніце D (Shift+D, калі кіруюць W A S D) або пстрыкніце на ёй. Аўтобусы накшталт Citaro бяруць D толькі з утрымліваным тормазам"
  kk: "Қорап N күйінде: D басыңыз (W A S D жүргізсе, Shift+D) немесе оны басыңыз. Citaro сияқты автобустар D-ны тек тежегіш басылып тұрғанда қабылдайды"
  pl: "Skrzynia jest w N: naciśnij D (Shift+D, gdy jeździsz W A S D) albo kliknij. Autobusy takie jak Citaro przyjmują D tylko przy wciśniętym hamulcu"
  cs: "Převodovka je v N: stiskněte D (Shift+D při jízdě W A S D) nebo na ni klikněte. Autobusy jako Citaro přejdou na D jen při sešlápnuté brzdě"
  hu: "A váltó N-ben van: nyomd meg a D-t (Shift+D, ha a W A S D vezet), vagy kattints rá. A Citarohoz hasonló buszok a D-t csak nyomott fékkel veszik fel"
  es: "La caja está en N: pulsa D (Shift+D cuando W A S D conducen) o haz clic. Autobuses como el Citaro solo aceptan D con el freno pisado"
  pt: "O câmbio está em N: pressione D (Shift+D quando W A S D dirigem) ou clique. Ônibus como o Citaro só aceitam D com o freio pressionado"
  pt-pt: "O câmbio está em N: prima D (Shift+D quando W A S D dirigem) ou clique. Autocarro como o Citaro só aceitam D com o freio pressionado"
  it: "Il cambio è in N: premi D (Shift+D quando guidi con W A S D), o cliccalo. Bus come il Citaro accettano D solo con il freno premuto"
  nl: "De versnellingsbak staat in N: druk op D (Shift+D als W A S D rijdt), of klik erop. Bussen zoals de Citaro nemen D alleen met ingedrukte rem"
  tr: "Vites N'de: D'ye basın (W A S D sürerken Shift+D) veya tıklayın. Citaro gibi otobüsler D'yi yalnızca fren basılıyken alır"
  ja: "ギアがNです:Dを押すか(W A S D 運転時はShift+D)、クリックしてください。Citaroなどのバスは、ブレーキを踏んでいる間だけDに入ります"
  zh: "变速箱处于N档:按D(用 W A S D 驾驶时按Shift+D),或点击它。Citaro等巴士必须踩住刹车才能挂D档"
  hi: "गियरबॉक्स N में है: D दबाएँ (W A S D से चलाते समय Shift+D), या उस पर क्लिक करें। Citaro जैसी बसें D तभी लेती हैं जब ब्रेक दबा हो"
  zh-tw: "變速箱處於 N 波：請按 D（若以 W A S D 駕駛則按 Shift+D）或直接點選。Citaro 等車款需踩住煞車才能入 D 波"
"The graphics driver stopped the game. Updating the graphics driver usually helps; Settings → Graphics API can switch to OpenGL.":
  ca: "El controlador gràfic ha aturat el joc. Actualitzar-lo sol ajudar; a Configuració → API gràfica pots canviar a OpenGL."
  ru: "Графический драйвер остановил игру. Обычно помогает обновление драйвера; в «Настройки → Графический API» можно переключиться на OpenGL."
  de: "Der Grafiktreiber hat das Spiel gestoppt. Ein Update des Grafiktreibers hilft meist; unter Einstellungen → Grafik-API kann auf OpenGL umgestellt werden."
  fr: "Le pilote graphique a arrêté le jeu. Mettre à jour le pilote aide généralement ; Réglages → API graphique permet de passer à OpenGL."
  uk: "Графічний драйвер зупинив гру. Зазвичай допомагає оновлення графічного драйвера; у «Налаштування» → «Графічний API» можна перемкнутися на OpenGL."
  be: "Графічны драйвер спыніў гульню. Звычайна дапамагае абнаўленне графічнага драйвера; у «Налады» → «Графічны API» можна пераключыцца на OpenGL."
  kk: "Графика драйвері ойынды тоқтатты. Графика драйверін жаңарту әдетте көмектеседі; Баптаулар → Графика API арқылы OpenGL-ге ауыстыруға болады."
  pl: "Sterownik grafiki zatrzymał grę. Zwykle pomaga aktualizacja sterownika grafiki; w Ustawienia → API grafiki można przełączyć na OpenGL."
  cs: "Grafický ovladač zastavil hru. Obvykle pomůže aktualizace grafického ovladače; v Nastavení → Grafické API lze přepnout na OpenGL."
  hu: "A videokártya-illesztőprogram leállította a játékot. Általában segít az illesztőprogram frissítése; a Beállítások → Grafikai API OpenGL-re válthat."
  es: "El controlador gráfico detuvo el juego. Suele ayudar actualizar el controlador gráfico; en Ajustes → API gráfica puedes cambiar a OpenGL."
  pt: "O driver gráfico interrompeu o jogo. Atualizar o driver gráfico costuma ajudar; em Configurações → API gráfica você pode mudar para OpenGL."
  pt-pt: "O driver gráfico interrompeu o jogo. Atualizar o driver gráfico costuma ajudar; em Definições → API gráfica você pode mudar para OpenGL."
  it: "Il driver grafico ha fermato il gioco. Di solito aiuta aggiornare il driver grafico; Impostazioni → API grafica può passare a OpenGL."
  nl: "Het grafische stuurprogramma heeft het spel gestopt. Het bijwerken van het grafische stuurprogramma helpt meestal; Instellingen → Grafische API kan overschakelen naar OpenGL."
  tr: "Grafik sürücüsü oyunu durdurdu. Grafik sürücüsünü güncellemek genelde işe yarar; Ayarlar → Grafik API'si ile OpenGL'e geçilebilir."
  ja: "グラフィックスドライバーによりゲームが停止しました。グラフィックスドライバーの更新で改善することが多いです。設定 → グラフィックスAPI でOpenGLに切り替えることもできます。"
  zh: "图形驱动导致游戏停止。更新图形驱动通常有帮助;也可以在 设置 → 图形API 中切换到OpenGL。"
  hi: "ग्राफ़िक्स ड्राइवर ने गेम रोक दिया। ग्राफ़िक्स ड्राइवर अपडेट करना आमतौर पर मदद करता है; सेटिंग्स → ग्राफ़िक्स API से OpenGL पर स्विच किया जा सकता है।"
  zh-tw: "顯示卡驅動程式導致遊戲終止。通常更新驅動程式可解決問題；亦可在「設定 → 圖形 API」中切換為 OpenGL。"
"The graphics driver stopped the game. Updating the graphics driver usually helps; you can also let the game draw with DirectX 12 instead of Vulkan (the button below, or Settings → Graphics API).":
  ca: "El controlador gràfic ha aturat el joc. Actualitzar-lo sol ajudar; també pots fer servir DirectX 12 en lloc de Vulkan (amb el botó de sota o a Configuració → API gràfica)."
  ru: "Графический драйвер остановил игру. Обычно помогает обновление драйвера; также можно включить DirectX 12 вместо Vulkan (кнопка ниже или «Настройки → Графический API»)."
  de: "Der Grafiktreiber hat das Spiel gestoppt. Ein Update des Grafiktreibers hilft meist; du kannst das Spiel auch mit DirectX 12 statt Vulkan rendern lassen (die Schaltfläche unten oder Einstellungen → Grafik-API)."
  fr: "Le pilote graphique a arrêté le jeu. Mettre à jour le pilote aide généralement ; vous pouvez aussi faire utiliser DirectX 12 au lieu de Vulkan (le bouton ci-dessous, ou Réglages → API graphique)."
  uk: "Графічний драйвер зупинив гру. Зазвичай допомагає оновлення графічного драйвера; також можна дозволити грі малювати через DirectX 12 замість Vulkan (кнопка нижче або «Налаштування» → «Графічний API»)."
  be: "Графічны драйвер спыніў гульню. Звычайна дапамагае абнаўленне графічнага драйвера; таксама можна дазволіць гульні маляваць праз DirectX 12 замест Vulkan (кнопка ніжэй або «Налады» → «Графічны API»)."
  kk: "Графика драйвері ойынды тоқтатты. Графика драйверін жаңарту әдетте көмектеседі; сондай-ақ ойынға Vulkan орнына DirectX 12 қолдануға болады (төмендегі түйме немесе Баптаулар → Графика API)."
  pl: "Sterownik grafiki zatrzymał grę. Zwykle pomaga aktualizacja sterownika grafiki; możesz też ustawić grze DirectX 12 zamiast Vulkan (przycisk poniżej lub Ustawienia → API grafiki)."
  cs: "Grafický ovladač zastavil hru. Obvykle pomůže aktualizace grafického ovladače; hru můžete také nechat vykreslovat přes DirectX 12 místo Vulkanu (tlačítko níže nebo Nastavení → Grafické API)."
  hu: "A videokártya-illesztőprogram leállította a játékot. Általában segít az illesztőprogram frissítése; a játékot Vulkan helyett DirectX 12-vel is rajzoltathatod (lent a gomb, vagy Beállítások → Grafikai API)."
  es: "El controlador gráfico detuvo el juego. Suele ayudar actualizar el controlador gráfico; también puedes hacer que el juego dibuje con DirectX 12 en lugar de Vulkan (el botón de abajo, o Ajustes → API gráfica)."
  pt: "O driver gráfico interrompeu o jogo. Atualizar o driver gráfico costuma ajudar; você também pode fazer o jogo renderizar com DirectX 12 em vez de Vulkan (o botão abaixo, ou Configurações → API gráfica)."
  pt-pt: "O driver gráfico interrompeu o jogo. Atualizar o driver gráfico costuma ajudar; você também pode fazer o jogo renderizar com DirectX 12 em vez de Vulkan (o botão abaixo, ou Definições → API gráfica)."
  it: "Il driver grafico ha fermato il gioco. Di solito aiuta aggiornare il driver grafico; puoi anche far disegnare il gioco con DirectX 12 invece di Vulkan (il pulsante qui sotto, o Impostazioni → API grafica)."
  nl: "Het grafische stuurprogramma heeft het spel gestopt. Het bijwerken van het grafische stuurprogramma helpt meestal; je kunt het spel ook met DirectX 12 in plaats van Vulkan laten tekenen (de knop hieronder, of Instellingen → Grafische API)."
  tr: "Grafik sürücüsü oyunu durdurdu. Grafik sürücüsünü güncellemek genelde işe yarar; ayrıca oyunun Vulkan yerine DirectX 12 ile çizmesini sağlayabilirsiniz (aşağıdaki düğme veya Ayarlar → Grafik API'si)."
  ja: "グラフィックスドライバーによりゲームが停止しました。グラフィックスドライバーの更新で改善することが多いです。Vulkanの代わりにDirectX 12で描画させることもできます(下のボタン、または 設定 → グラフィックスAPI)。"
  zh: "图形驱动导致游戏停止。更新图形驱动通常有帮助;你也可以让游戏改用DirectX 12代替Vulkan绘制(下方按钮,或 设置 → 图形API)。"
  hi: "ग्राफ़िक्स ड्राइवर ने गेम रोक दिया। ग्राफ़िक्स ड्राइवर अपडेट करना आमतौर पर मदद करता है; आप गेम को Vulkan की जगह DirectX 12 से भी ड्रा करवा सकते हैं (नीचे का बटन, या सेटिंग्स → ग्राफ़िक्स API)।"
  zh-tw: "顯示卡驅動程式導致遊戲終止。通常更新驅動程式可解決問題；你也可以改用 DirectX 12 取代 Vulkan 渲染（下方按鈕，或「設定 → 圖形 API」）。"
"The host put your bus back on its wheels":
  ca: "L'amfitrió ha tornat a posar el teu autobús sobre les rodes"
  ru: "Хост поставил ваш автобус на колёса"
  de: "Der Host hat deinen Bus wieder auf die Räder gestellt"
  fr: "L'hôte a remis votre bus sur ses roues"
  uk: "Хост повернув ваш автобус на колеса"
  be: "Хост вярнуў ваш аўтобус на колы"
  kk: "Хост автобусыңызды дөңгелектеріне қайта қойды"
  pl: "Host postawił twój autobus z powrotem na kołach"
  cs: "Hostitel postavil váš autobus zpět na kola"
  hu: "A gazda visszatette a buszod a kerekeire"
  es: "El anfitrión puso tu autobús de nuevo sobre sus ruedas"
  pt: "O anfitrião colocou seu ônibus de volta sobre as rodas"
  pt-pt: "O anfitrião colocou seu autocarro de volta sobre as rodas"
  it: "L'host ha rimesso il tuo bus sulle ruote"
  nl: "De host heeft je bus terug op zijn wielen gezet"
  tr: "Sunucu otobüsünüzü tekrar tekerlekleri üzerine koydu"
  ja: "ホストがあなたのバスを元の向きに戻しました"
  zh: "主机让你的巴士恢复了车轮着地"
  hi: "होस्ट ने आपकी बस वापस पहियों पर रख दी"
  zh-tw: "房主已協助將你的巴士翻正"
"The last check failed":
  ca: "L'última comprovació ha fallat"
  ru: "Последняя проверка не удалась"
  de: "Die letzte Prüfung ist fehlgeschlagen"
