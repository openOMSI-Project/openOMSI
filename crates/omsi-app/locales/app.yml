  it: "Premi il pedale dell'acceleratore a fondo e tienilo, poi premi Avanti. Nessun pedale: Salta."
  nl: "Trap het gaspedaal helemaal in en houd vast, druk dan op Volgende. Geen pedalen: Overslaan."
  tr: "Gaz pedalına sonuna kadar basıp tutun, sonra Sonraki'ye basın. Pedal yoksa: Atla."
  ja: "アクセルペダルを一番奥まで踏み込んで保持し、「次へ」を押してください。ペダルがない場合:スキップ。"
  zh: "将油门踏板一直踩到底并保持,然后按“下一步”。没有踏板:跳过。"
