  hu: "Nyomd le teljesen a gázpedált és tartsd, majd nyomd meg a Következő gombot. Nincsenek pedálok: Kihagyás."
  es: "Pisa el pedal del acelerador hasta el fondo y mantenlo, luego pulsa Siguiente. Sin pedales: Omitir."
