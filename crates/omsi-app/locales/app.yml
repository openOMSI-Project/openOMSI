"Paste the code your friend's game shows. The map, time and weather are the host's; you choose your bus.":
  ca: "Enganxa el codi que mostra la partida del teu amic. El mapa, l'hora i el temps són els de l'amfitrió; tu tries l'autobús."
  ru: "Вставьте код из игры друга. Карта, время и погода - как у хоста; автобус выбираете вы."
  de: "Füge den Code aus dem Spiel deines Freundes ein. Karte, Zeit und Wetter sind die des Hosts; den Bus wählst du."
  fr: "Collez le code affiché par le jeu de votre ami. La carte, l'heure et la météo sont celles de l'hôte ; vous choisissez votre bus."
  uk: "Вставте код, який показує гра вашого друга. Мапа, час і погода - від хоста; автобус обираєте ви."
  be: "Устаўце код, які паказвае гульня вашага сябра. Мапа, час і надвор'е - ад хоста; аўтобус абіраеце вы."
  kk: "Досыңыздың ойыны көрсететін кодты қойыңыз. Карта, уақыт пен ауа райы - хосттікі; автобусты өзіңіз таңдайсыз."
  pl: "Wklej kod pokazywany przez grę znajomego. Mapa, czas i pogoda są hosta; autobus wybierasz ty."
  cs: "Vložte kód, který zobrazuje hra kamaráda. Mapa, čas a počasí určuje hostitel; autobus si vyberete vy."
  hu: "Illeszd be a barátod játéka által mutatott kódot. A térkép, az idő és az időjárás a gazdáé; a buszt te választod."
  es: "Pega el código que muestra el juego de tu amigo. El mapa, la hora y el clima son los del anfitrión; tú eliges tu autobús."
  pt: "Cole o código mostrado no jogo do seu amigo. O mapa, a hora e o clima são os do anfitrião; você escolhe seu ônibus."
  pt-pt: "Cole o código mostrado no jogo do seu amigo. O mapa, a hora e o meteorologia são os do anfitrião; você escolhe seu autocarro."
