  be: "Націсніце педаль газу да ўпору і ўтрымлівайце, потым націсніце «Далей». Няма педалей: «Прапусціць»."
  kk: "Газ педалін соңына дейін басып ұстаңыз, сосын Келесі басыңыз. Педальдар жоқ: Өткізу."
