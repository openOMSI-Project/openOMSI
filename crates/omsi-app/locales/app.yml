"Once the game runs, the Sessions page shows the session code with a copy button; your friend pastes it into Join. It works at home and over the internet - no VPN needed.":
  ca: "Quan el joc està en marxa, la pàgina Sessions mostra el codi de sessió amb un botó per copiar-lo; el teu amic l'enganxa a Uneix-t'hi. Funciona a casa i per internet, sense VPN."
  ru: "Когда игра запущена, на странице «Сессии» виден код сессии с кнопкой копирования; друг вставляет его в «Присоединиться». Работает дома и через интернет - VPN не нужен."
  de: "Sobald das Spiel läuft, zeigt die Seite Sitzungen den Code mit Kopier-Knopf; dein Freund fügt ihn bei Beitreten ein. Funktioniert zu Hause und über das Internet - ohne VPN."
  fr: "Une fois le jeu lancé, la page Sessions affiche le code avec un bouton copier ; votre ami le colle dans Rejoindre. Fonctionne à la maison et sur Internet - sans VPN."
  uk: "Коли гра запуститься, на сторінці «Сесії» з'явиться код сесії з кнопкою копіювання; друг вставляє його в поле «Приєднатися». Працює вдома й через інтернет - VPN не потрібен."
  be: "Калі гульня запусціцца, на старонцы «Сесіі» з'явіцца код сесіі з кнопкай капіявання; сябар устаўляе яго ў поле «Далучыцца». Працуе дома і праз інтэрнэт - VPN не патрэбны."
  kk: "Ойын іске қосылғаннан кейін Сессиялар бетінде көшіру түймесі бар сессия коды көрсетіледі; досыңыз оны Қосылу өрісіне қояды. Ол үйде де, интернетте де жұмыс істейді - VPN қажет емес."
  pl: "Gdy gra ruszy, strona Sesje pokaże kod sesji z przyciskiem kopiowania; znajomy wkleja go w polu Dołącz. Działa w domu i przez internet - bez VPN."
  cs: "Po spuštění hry zobrazí stránka Relace kód relace s tlačítkem pro kopírování; kamarád ho vloží do Připojit. Funguje doma i přes internet - bez VPN."
  hu: "A játék indulása után a Munkamenetek oldal megmutatja a kódot a Másolás gombbal; a játékostársad ezt be tudja illeszteni a Csatlakozás mezőbe. Otthon és interneten át is működik - VPN nélkül."
  es: "Cuando el juego se está ejecutando, la página Sesiones muestra el código de sesión con un botón de copiar; tu amigo lo pega en Unirse. Funciona en casa y por internet, sin VPN."
  pt: "Com o jogo em execução, a página Sessões mostra o código da sessão com um botão de copiar; seu amigo cola em Entrar. Funciona em casa e pela internet, sem VPN."
  pt-pt: "Com o jogo em execução, a página Sessões mostra o código da sessão com um botão de copiar; seu amigo cola em Entrar. Funciona em casa e pela internet, sem VPN."
  it: "Quando il gioco è avviato, la pagina Sessioni mostra il codice sessione con un pulsante per copiarlo; il tuo amico lo incolla in Unisciti. Funziona a casa e via internet - nessuna VPN necessaria."
  nl: "Zodra het spel draait, toont de pagina Sessies de sessiecode met een kopieerknop; je vriend plakt die bij Deelnemen. Werkt thuis en via internet - geen VPN nodig."
  tr: "Oyun çalışınca Oturumlar sayfasında kopyalama düğmesiyle birlikte oturum kodu görünür; arkadaşınız bunu Katıl alanına yapıştırır. Evde de internet üzerinden de çalışır - VPN gerekmez."
  ja: "ゲームが起動すると、セッションページにコピーボタン付きでセッションコードが表示されます。友達はそれを「参加」に貼り付けます。自宅でもインターネット越しでも使え、VPNは不要です。"
  zh: "游戏运行后,“会话”页面会显示带复制按钮的会话码;朋友将其粘贴到“加入”即可。在家里或通过互联网均可使用,无需VPN。"
  hi: "गेम चलने के बाद सेशन पेज पर कॉपी बटन के साथ सेशन कोड दिखता है; आपका दोस्त उसे Join में पेस्ट करता है। यह घर पर और इंटरनेट पर भी चलता है - VPN की ज़रूरत नहीं।"
  zh-tw: "遊戲啟動後，「遊戲工作階段」頁面會顯示可複製的連線碼。朋友在「加入」貼上即可，在家或透過互聯網均可使用，毋須 VPN。"
  ko: "게임 실행 후 세션 화면에 복사 가능한 코드가 표시됩니다. 친구가 참가 화면에 붙여 넣으면 됩니다. 집이나 인터넷 어디서든 VPN 없이 작동합니다."
  th: "เมื่อเกมเริ่มแล้ว หน้าเซสชันจะแสดงรหัสพร้อมปุ่มคัดลอก ให้เพื่อนวางรหัสในหน้าเข้าร่วม ใช้งานได้ทั้งในบ้านและผ่านอินเทอร์เน็ตโดยไม่ต้องใช้ VPN"
  vi: "Khi trò chơi chạy, trang Phiên chơi hiển thị mã cùng nút sao chép. Bạn bè dán mã vào Tham gia. Hoạt động ở nhà hoặc qua Internet mà không cần VPN."
  id: "Setelah game berjalan, halaman Sesi menampilkan kode yang dapat disalin. Teman Anda menempelkannya di Gabung. Bisa melalui jaringan rumah maupun internet tanpa VPN."
  ms: "Apabila permainan bermula, halaman Sesi menunjukkan kod yang boleh disalin. Rakan anda menampalnya pada Sertai. Berfungsi di rumah atau melalui internet tanpa VPN."
  tl: "Kapag tumatakbo na ang laro, ipapakita ng Sessions ang code na puwedeng kopyahin. I-paste iyon ng kaibigan sa Join. Gumagana sa bahay o internet nang walang VPN."
