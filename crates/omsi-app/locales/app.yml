"Take your hands off the wheel and your feet off the pedals (the wheel in the middle), then press Next.":
  ca: "Treu les mans del volant i els peus dels pedals (amb el volant centrat) i prem Següent."
  ru: "Уберите руки с руля и ноги с педалей (руль посередине), затем нажмите «Далее»."
  de: "Nimm die Hände vom Lenkrad und die Füße von den Pedalen (Lenkrad in der Mitte), dann drücke Weiter."
  fr: "Lâchez le volant et les pédales (volant au centre), puis appuyez sur Suivant."
  uk: "Приберіть руки з керма й ноги з педалей (кермо посередині), потім натисніть «Далі»."
  be: "Прыбярыце рукі з руля і ногі з педаляў (руль пасярэдзіне), потым націсніце «Далей»."
  kk: "Қолыңызды рульден, аяғыңызды педальдардан алыңыз (руль ортада), сосын Келесі басыңыз."
  pl: "Zdejmij ręce z kierownicy i nogi z pedałów (kierownica na środku), potem naciśnij Dalej."
  cs: "Sundejte ruce z volantu a nohy z pedálů (volant uprostřed), pak stiskněte Další."
  hu: "Vedd le a kezed a kormányról és a lábad a pedálokról (a kormány középen), majd nyomd meg a Következő gombot."
  es: "Quita las manos del volante y los pies de los pedales (volante en el centro), luego pulsa Siguiente."
  pt: "Tire as mãos do volante e os pés dos pedais (volante no centro), depois pressione Próximo."
  pt-pt: "Tire as mãos do volante e os pés dos pedais (volante no centro), depois prima Próximo."
  it: "Togli le mani dal volante e i piedi dai pedali (volante al centro), poi premi Avanti."
  nl: "Haal je handen van het stuur en je voeten van de pedalen (stuur in het midden), druk dan op Volgende."
  tr: "Ellerinizi direksiyondan, ayaklarınızı pedallardan çekin (direksiyon ortada), sonra Sonraki'ye basın."
  ja: "ハンドルから手を、ペダルから足を離して(ハンドルは中央に)、「次へ」を押してください。"
  zh: "请松开方向盘、离开踏板(方向盘居中),然后按“下一步”。"
  hi: "हाथ स्टीयरिंग से और पैर पैडल से हटाएँ (पहिया बीच में), फिर अगला दबाएँ।"
  zh-tw: "請將雙手離開方向盤、雙腳離開踏板（方向盤保持居中），然後按「下一步」。"
