  zh-tw: "開啟主機功能，接著在「駕駛」頁面開始更次。"
"Turn the wheel (or move the stick) all the way to the LEFT and hold it there, then press Next.":
  ca: "Gira el volant (o mou el joystick) del tot a l'ESQUERRA i mantén-lo així; després prem Següent."
  ru: "Поверните руль (или отклоните стик) до упора ВЛЕВО и удерживайте, затем нажмите «Далее»."
  de: "Drehe das Lenkrad (oder bewege den Stick) ganz nach LINKS und halte es dort, dann drücke Weiter."
  fr: "Tournez le volant (ou poussez le stick) à fond vers la GAUCHE et maintenez-le, puis appuyez sur Suivant."
  uk: "Поверніть кермо (або відхиліть джойстик) до упору ЛІВОРУЧ і утримуйте, потім натисніть «Далі»."
  be: "Павярніце руль (або адхіліце джойсцік) да ўпору ЎЛЕВА і ўтрымлівайце, потым націсніце «Далей»."
  kk: "Рульді (немесе стикті) соңына дейін СОЛҒА бұрып, сол жерде ұстаңыз, сосын Келесі басыңыз."
  pl: "Skręć kierownicę (lub gałkę) do końca w LEWO i przytrzymaj, potem naciśnij Dalej."
  cs: "Otočte volantem (nebo pákou) úplně DOLEVA a držte, pak stiskněte Další."
  hu: "Fordítsd a kormányt (vagy told a kart) teljesen BALRA és tartsd ott, majd nyomd meg a Következő gombot."
  es: "Gira el volante (o mueve el stick) del todo a la IZQUIERDA y mantenlo, luego pulsa Siguiente."
  pt: "Gire o volante (ou mova o manche) todo para a ESQUERDA e segure, depois pressione Próximo."
  pt-pt: "Gire o volante (ou mova o manche) todo para a ESQUERDA e segure, depois prima Próximo."
  it: "Gira il volante (o muovi lo stick) tutto a SINISTRA e tienilo lì, poi premi Avanti."
  nl: "Draai het stuur (of beweeg de stick) helemaal naar LINKS en houd het vast, druk dan op Volgende."
  tr: "Direksiyonu (veya çubuğu) sonuna kadar SOLA çevirip orada tutun, sonra Sonraki'ye basın."
  ja: "ハンドルを(またはスティックを)一番左まで回して保持し、「次へ」を押してください。"
  zh: "将方向盘(或摇杆)一直转到最左边并保持,然后按“下一步”。"
  hi: "व्हील (या स्टिक) को पूरा बाईं ओर घुमाकर वहीं रखें, फिर अगला दबाएँ।"
