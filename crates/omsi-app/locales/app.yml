"On foot: W A S D walk, Shift runs, F4 free camera / F1 back, G sits down (by the driver's place: back at the wheel), Ctrl+Shift+G steps out of the bus":
  ca: "A peu: W A S D per caminar, Maj per córrer, F4 per a càmera lliure / F1 per tornar, G per seure (al lloc del conductor: tornar al volant), Ctrl+Maj+G per sortir de l'autobús"
  pt: "A pé: W A S D para andar, Shift para correr, F4 para câmera livre / F1 para voltar, G para sentar (perto do banco do motorista: volta ao volante), Ctrl+Shift+G para sair do ônibus"
  pt-pt: "A pé: W A S D para andar, Shift para correr, F4 para câmara livre / F1 para voltar, G para sentar (junto ao lugar do condutor: volta ao volante), Ctrl+Shift+G para sair do autocarro"
  zh: "步行:W A S D 行走,Shift 奔跑,F4 自由视角 / F1 返回,按 G 坐下(在驾驶位旁:回到方向盘前),Ctrl+Shift+G 离开驾驶室"
