"Click a key and press the new one (hold Shift, Ctrl or Alt for a combination); Escape leaves it as it is.":
  ca: "Clica una tecla i prem la nova (mantén Maj, Ctrl o Alt per a una combinació); Esc deixa l'assignació com estava."
  ru: "Нажмите на клавишу и затем новую (удерживайте Shift, Ctrl или Alt для сочетания); Escape оставляет как есть."
  de: "Klicke eine Taste an und drücke die neue (Shift, Ctrl oder Alt für eine Kombination halten); Escape lässt sie wie sie ist."
  fr: "Cliquez sur une touche puis appuyez sur la nouvelle (maintenez Shift, Ctrl ou Alt pour une combinaison) ; Échap la laisse telle quelle."
  uk: "Клацніть клавішу й натисніть нову (для комбінації утримуйте Shift, Ctrl або Alt); Escape залишає все як є."
  be: "Пстрыкніце клавішу і націсніце новую (для спалучэння ўтрымлівайце Shift, Ctrl або Alt); Escape пакідае ўсё як ёсць."
  kk: "Пернені басып, жаңасын басыңыз (тіркесім үшін Shift, Ctrl немесе Alt ұстап тұрыңыз); Escape қалдырып кетеді."
  pl: "Kliknij klawisz i naciśnij nowy (przytrzymaj Shift, Ctrl lub Alt dla kombinacji); Escape zostawia bez zmian."
  cs: "Klikněte na klávesu a stiskněte novou (pro kombinaci držte Shift, Ctrl nebo Alt); Escape ji nechá beze změny."
  hu: "Kattints egy billentyűre, és nyomd meg az újat (kombinációhoz tartsd a Shift, Ctrl vagy Alt billentyűt); az Escape változatlanul hagyja."
  es: "Haz clic en una tecla y pulsa la nueva (mantén Shift, Ctrl o Alt para una combinación); Escape la deja como está."
  pt: "Clique em uma tecla e pressione a nova (segure Shift, Ctrl ou Alt para uma combinação); Escape mantém como está."
  pt-pt: "Clique em uma tecla e prima a nova (segure Shift, Ctrl ou Alt para uma combinação); Escape mantém como está."
  it: "Clicca un tasto e premi quello nuovo (tieni premuto Shift, Ctrl o Alt per una combinazione); Esc lo lascia com'è."
  nl: "Klik op een toets en druk op de nieuwe (houd Shift, Ctrl of Alt ingedrukt voor een combinatie); Escape laat het zoals het is."
  tr: "Bir tuşa tıklayın ve yenisine basın (kombinasyon için Shift, Ctrl veya Alt'ı basılı tutun); Escape olduğu gibi bırakır."
  ja: "キーをクリックして新しいキーを押します(組み合わせはShift、Ctrl、Altを押しながら)。Escapeで変更せずに戻ります。"
  zh: "点击一个按键,然后按下新的按键(按住Shift、Ctrl或Alt可设置组合键);按Escape保持不变。"
  hi: "किसी की पर क्लिक करके नई की दबाएँ (कॉम्बिनेशन के लिए Shift, Ctrl या Alt दबाए रखें); Escape उसे जैसा है वैसा छोड़ देता है।"
  zh-tw: "按一下按鍵，然後按下新按鍵（按住 Shift、Ctrl 或 Alt 可設定組合鍵）；按 Escape 保持不變。"
