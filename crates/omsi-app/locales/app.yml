  uk: "Прив'язки клавіш збережено; «Клавіші водіння» перемкнено на «Власне керування», щоб гра їх використовувала."
  be: "Прывязкі клавіш захаваны; «Клавішы кіравання» пераключаны на «Уласнае кіраванне», каб гульня іх выкарыстоўвала."
  kk: "Перне тағайындаулары сақталды; Жүргізу пернелері Реттелетін басқаруға ауыстырылды, енді ойын оларды қолданады."
  pl: "Przypisania klawiszy zapisane; Klawisze jazdy przełączono na Własne sterowanie, więc gra ich używa."
  cs: "Klávesové zkratky uloženy; Klávesy pro jízdu přepnuty na Vlastní ovládání, aby je hra používala."
  hu: "Billentyűkiosztás mentve; a Vezetési billentyűk Egyéni vezérlésre váltottak, hogy a játék használja őket."
  es: "Teclas guardadas; Teclas de conducción cambió a Controles personalizados para que el juego las use."
  pt: "Teclas salvas; a opção Teclas de direção foi alterada para Controles personalizados para que o jogo use essas teclas."
  pt-pt: "Teclas guardadas; a opção Teclas de direção foi alterada para Controlos personalizados para que o jogo use essas teclas."
  it: "Tasti salvati; i Tasti di guida sono passati a Comandi personalizzati così il gioco li usa."
  nl: "Toetsen opgeslagen; Rijtoetsen is overgeschakeld naar Aangepaste besturing zodat het spel ze gebruikt."
  tr: "Tuş atamaları kaydedildi; oyun kullansın diye Sürüş tuşları Özel kontroller'e geçirildi."
  ja: "キー割り当てを保存しました。運転キーをカスタム操作に切り替えたので、ゲームはそれを使います。"
  zh: "按键绑定已保存;驾驶按键已切换为自定义控制,游戏将使用它们。"
  hi: "की बाइंडिंग सेव हुईं; गेम उन्हें इस्तेमाल करे इसलिए ड्राइविंग कीज़ कस्टम कंट्रोल पर स्विच हो गईं।"
