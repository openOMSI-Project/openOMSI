  nl: "Plak de code die het spel van je vriend toont. Kaart, tijd en weer zijn die van de host; jij kiest je bus."
  tr: "Arkadaşınızın oyununda görünen kodu yapıştırın. Harita, saat ve hava sunucuya aittir; otobüsü siz seçersiniz."
  ja: "友達のゲームに表示されたコードを貼り付けてください。マップ、時刻、天候はホストのものになります。バスは自分で選べます。"
  zh: "粘贴朋友游戏中显示的会话码。地图、时间和天气由主机决定;你可以选择自己的巴士。"
  hi: "अपने दोस्त के गेम में दिखने वाला कोड पेस्ट करें। मैप, समय और मौसम होस्ट का होता है; बस आप चुनते हैं।"
  zh-tw: "貼上朋友遊戲中顯示的連線碼。地圖、時間及天氣均由房主決定；你可以自由選擇巴士。"
"Drive with friends by a code, or on servers that are always on.":
  ca: "Condueix amb amics mitjançant un codi o en servidors que estan sempre actius."
  ru: "Ездите с друзьями по коду или на серверах, которые работают всегда."
  de: "Fahre mit Freunden per Code oder auf Servern, die immer laufen."
  fr: "Roulez avec des amis par code ou sur des serveurs toujours en ligne."
  uk: "Грайте з друзями за кодом або на серверах, що працюють постійно."
  be: "Гуляйце з сябрамі па кодзе або на серверах, што працуюць пастаянна."
  kk: "Достармен кодпен немесе үнемі қосулы серверлерде жүріңіз."
  pl: "Jedź ze znajomymi po kodzie lub na serwerach działających cały czas."
  cs: "Jezděte s kamarády pomocí kódu nebo na serverech, které běží pořád."
  hu: "Vezess barátokkal kóddal, vagy folyamatosan futó szervereken."
  es: "Conduce con amigos con un código, o en servidores siempre activos."
  pt: "Dirija com amigos usando um código, ou em servidores sempre ligados."
  pt-pt: "Dirija com amigos usando um código, ou em servidores sempre ligados."
  it: "Guida con gli amici tramite un codice, o su server sempre attivi."
  nl: "Rijd met vrienden via een code, of op servers die altijd aan staan."
  tr: "Arkadaşlarla kodla veya her zaman açık sunucularda sürün."
  ja: "コードで友達と、または常時稼働のサーバーで一緒に運転します。"
  zh: "通过会话码,或在常开的服务器上与朋友一起驾驶。"
  hi: "दोस्तों के साथ कोड से चलाएँ, या हमेशा चालू रहने वाले सर्वरों पर।"
  zh-tw: "使用連線碼與朋友一同駕駛，或加入長期在線的伺服器。"
  ko: "코드를 통해 친구와 운전하거나 상시 운영 서버에 참가하세요."
  th: "ขับรถกับเพื่อนผ่านรหัสหรือบนเซิร์ฟเวอร์ที่เปิดตลอดเวลา"
  vi: "Lái xe cùng bạn bè bằng mã hoặc trên máy chủ hoạt động liên tục."
  id: "Mengemudi dengan teman lewat kode atau di server yang selalu aktif."
  ms: "Pandu dengan rakan menggunakan kod atau di pelayan yang sentiasa aktif."
  tl: "Magmaneho kasama ang mga kaibigan gamit ang code o sa laging online na server."
