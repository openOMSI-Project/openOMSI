"The original OMSI 2 was not found automatically. Choose its folder (the one with OMSI, maps and Vehicles) and press Save.":
  ca: "No s'ha trobat automàticament l'OMSI 2 original. Tria'n la carpeta (la que conté OMSI, maps i Vehicles) i prem Desa."
  ru: "Оригинальная OMSI 2 не найдена автоматически. Выберите её папку (где OMSI, maps и Vehicles) и нажмите «Сохранить»."
  de: "Das originale OMSI 2 wurde nicht automatisch gefunden. Wähle seinen Ordner (mit OMSI, maps und Vehicles) und drücke Speichern."
  fr: "L'OMSI 2 original n'a pas été trouvé automatiquement. Choisissez son dossier (celui avec OMSI, maps et Vehicles) et appuyez sur Enregistrer."
  uk: "Оригінальну OMSI 2 не знайдено автоматично. Оберіть її теку (де є OMSI, maps і Vehicles) і натисніть «Зберегти»."
  be: "Арыгінальную OMSI 2 не знойдзена аўтаматычна. Абярыце яе тэчку (дзе ёсць OMSI, maps і Vehicles) і націсніце «Захаваць»."
  kk: "Түпнұсқа OMSI 2 автоматты түрде табылмады. Оның қалтасын (OMSI, maps және Vehicles бар қалта) таңдап, Сақтау түймесін басыңыз."
  pl: "Nie znaleziono oryginalnego OMSI 2. Wybierz jego folder (ten z OMSI, maps i Vehicles) i naciśnij Zapisz."
  cs: "Původní OMSI 2 nebylo nalezeno automaticky. Vyberte jeho složku (tu s OMSI, maps a Vehicles) a stiskněte Uložit."
  hu: "Az eredeti OMSI 2 nem található automatikusan. Válaszd ki a mappáját (amelyikben az OMSI, a maps és a Vehicles van), és nyomd meg a Mentés gombot."
  es: "No se encontró el OMSI 2 original automáticamente. Elige su carpeta (la que contiene OMSI, maps y Vehicles) y pulsa Guardar."
  pt: "O OMSI 2 original não foi encontrado automaticamente. Escolha a pasta dele (a que contém OMSI, maps e Vehicles) e pressione Salvar."
  pt-pt: "O OMSI 2 original não foi encontrado automaticamente. Escolha a pasta dele (a que contém OMSI, maps e Vehicles) e prima Guardar."
  it: "L'OMSI 2 originale non è stato trovato automaticamente. Scegli la sua cartella (quella con OMSI, maps e Vehicles) e premi Salva."
  nl: "De originele OMSI 2 is niet automatisch gevonden. Kies de map (die met OMSI, maps en Vehicles) en druk op Opslaan."
  tr: "Orijinal OMSI 2 otomatik olarak bulunamadı. Klasörünü (OMSI, maps ve Vehicles içeren) seçip Kaydet'e basın."
  ja: "元のOMSI 2が自動では見つかりませんでした。そのフォルダ(OMSI、maps、Vehiclesが入っているもの)を選んで「保存」を押してください。"
  zh: "未能自动找到原版OMSI 2。请选择其文件夹(包含OMSI、maps和Vehicles的那个)并按“保存”。"
  hi: "ओरिजिनल OMSI 2 अपने आप नहीं मिला। उसका फ़ोल्डर (जिसमें OMSI, maps और Vehicles हों) चुनें और Save दबाएँ।"
  zh-tw: "未能自動找到原版 OMSI 2。請選擇包含 OMSI、maps 及 Vehicles 的資料夾，再按「儲存」。"
  ko: "원본 OMSI 2를 자동으로 찾을 수 없습니다. OMSI, maps, Vehicles가 있는 폴더를 선택하고 저장하세요."
  th: "ไม่พบ OMSI 2 ต้นฉบับโดยอัตโนมัติ เลือกโฟลเดอร์ที่มี OMSI, maps และ Vehicles แล้วกดบันทึก"
  vi: "Không tự tìm thấy OMSI 2 gốc. Chọn thư mục chứa OMSI, maps và Vehicles rồi nhấn Lưu."
  id: "OMSI 2 asli tidak ditemukan otomatis. Pilih folder yang berisi OMSI, maps, dan Vehicles, lalu tekan Simpan."
  ms: "OMSI 2 asal tidak ditemui secara automatik. Pilih folder yang mengandungi OMSI, maps dan Vehicles, kemudian tekan Simpan."
  tl: "Hindi awtomatikong nakita ang orihinal na OMSI 2. Piliin ang folder na may OMSI, maps at Vehicles, saka pindutin ang Save."
