"No runs yet. Drive a duty and it shows up here.":
  ca: "Encara no hi ha serveis. Fes-ne un i apareixerà aquí."
  ru: "Поездок пока нет. Отработайте смену - она появится здесь."
  de: "Noch keine Fahrten. Fahre einen Dienst, dann erscheint er hier."
  fr: "Aucun trajet pour l'instant. Faites un service et il apparaîtra ici."
  uk: "Поїздок ще немає. Проїдьте наряд, і він з'явиться тут."
  be: "Паездак яшчэ няма. Праедзьце наряд, і ён з'явіцца тут."
  kk: "Әзірге рейстер жоқ. Нарядпен жүріңіз, ол осында пайда болады."
  pl: "Brak przejazdów. Odbądź służbę, a pojawi się tutaj."
  cs: "Zatím žádné jízdy. Odjeďte službu a objeví se tady."
  hu: "Még nincs korábbi menet. Teljesíts egy szolgálatot, és itt megjelenik."
  es: "Aún no hay recorridos. Conduce un servicio y aparecerá aquí."
  pt: "Ainda não há viagens. Faça uma escala e ela aparecerá aqui."
  pt-pt: "Ainda não há viagens. Faça uma escala e ela aparecerá aqui."
  it: "Ancora nessuna corsa. Guida un turno e comparirà qui."
  nl: "Nog geen ritten. Rijd een dienst en die verschijnt hier."
  tr: "Henüz sefer yok. Bir görev sürün, burada görünür."
  ja: "運行記録はまだありません。乗務を運転するとここに表示されます。"
  zh: "还没有行车记录。完成一次出车任务后会显示在这里。"
  hi: "अभी कोई रन नहीं। कोई ड्यूटी चलाएँ, वह यहाँ दिखेगी।"
  zh-tw: "尚無行車記錄。完成一個更次後便會顯示在此。"
  ko: "아직 운행 기록이 없습니다. 근무를 완료하면 여기에 표시됩니다."
  th: "ยังไม่มีประวัติการขับรถ เริ่มหน้าที่แล้วข้อมูลจะปรากฏที่นี่"
  vi: "Chưa có chuyến nào. Lái một ca để hiển thị tại đây."
  id: "Belum ada perjalanan. Jalankan satu tugas untuk melihatnya di sini."
  ms: "Belum ada perjalanan. Pandu satu tugas untuk melihatnya di sini."
  tl: "Wala pang biyahe. Magmaneho ng isang duty para lumitaw rito."
"Every change is saved at once; the game reads them when it starts.":
  ca: "Cada canvi es desa immediatament; el joc els llegeix en iniciar-se."
  ru: "Каждое изменение сохраняется сразу; игра читает их при запуске."
  de: "Jede Änderung wird sofort gespeichert; das Spiel liest sie beim Start."
  fr: "Chaque modification est enregistrée aussitôt ; le jeu les lit au démarrage."
  uk: "Кожна зміна зберігається одразу; гра читає їх під час запуску."
  be: "Кожная змена захоўваецца адразу; гульня чытае іх пры запуску."
  kk: "Әрбір өзгеріс бірден сақталады; ойын оларды іске қосылғанда оқиды."
  pl: "Każda zmiana jest zapisywana od razu; gra wczytuje je przy starcie."
  cs: "Každá změna se uloží hned; hra je načte při spuštění."
  hu: "Minden módosítás azonnal mentésre kerül; a játék induláskor olvassa be őket."
  es: "Cada cambio se guarda al instante; el juego los lee al iniciar."
  pt: "Cada alteração é salva imediatamente; o jogo a lê na próxima inicialização."
  pt-pt: "Cada alteração é guardada imediatamente; o jogo a lê na próxima inicialização."
  it: "Ogni modifica viene salvata subito; il gioco le legge all'avvio."
  nl: "Elke wijziging wordt direct opgeslagen; het spel leest ze bij het starten."
  tr: "Her değişiklik anında kaydedilir; oyun bunları başlarken okur."
  ja: "変更はすぐに保存されます。ゲームは起動時にそれらを読み込みます。"
  zh: "所有更改会立即保存;游戏在启动时读取它们。"
  hi: "हर बदलाव तुरंत सेव होता है; गेम शुरू होते समय उन्हें पढ़ता है।"
  zh-tw: "所有更改會即時儲存，遊戲啟動時會自動讀取。"
  ko: "모든 변경 사항은 즉시 저장되며 게임 시작 시 불러옵니다."
  th: "ทุกการเปลี่ยนแปลงจะถูกบันทึกทันทีและเกมจะอ่านเมื่อเริ่ม"
  vi: "Mọi thay đổi được lưu ngay và trò chơi sẽ đọc khi bắt đầu."
  id: "Setiap perubahan langsung disimpan dan dibaca saat game dimulai."
  ms: "Setiap perubahan disimpan serta-merta dan dibaca apabila permainan bermula."
  tl: "Agad na sine-save ang bawat pagbabago at binabasa ng laro sa pagsisimula."
