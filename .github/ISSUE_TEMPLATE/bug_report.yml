name: Bug Report
description: Something isn't working as expected
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! A few things make it much quicker to fix:

        * **Write in English.** Issues in other languages are closed until they are translated - a translator such as DeepL or Google Translate is fine.
        * **One problem per issue.** Several problems in one report get lost; open one issue for each.
        * **Use the latest release.** The launcher updates itself; many problems are already fixed in a newer build.
        * **The game stopped on an error?** Use *Report on GitHub* in the launcher's error message - it fills in the error and the end of the log for you.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I wrote this report in English.
          required: true
        - label: I searched the [open and closed issues](https://github.com/openOMSI-org/openOMSI/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: It still happens on the latest release.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options:
        - Crash, freeze or the game doesn't start
        - Performance (FPS, stutter, loading)
        - Passengers, doors, tickets and money
        - Driving, controls, input devices and cameras
        - AI traffic, timetable and navigation
        - Multiplayer or dedicated server
        - One particular bus, DLC or map
        - Graphics, weather and effects
        - Sound
        - Launcher, menus and HUD
        - Something else
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots and videos help a lot - paste or drag them in here.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen ourselves? Name the stop, the line or the place on the map if it matters.
      placeholder: |
        1. Start a duty on ... with ...
        2. Drive to ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead? If OMSI 2 does it differently, say how.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown in the launcher's side bar and on the first line of `game.log`.
      placeholder: e.g. 0.1.1313
    validations:
      required: true

  - type: input
    id: worked-before
    attributes:
      label: Did it work in an earlier version?
      description: If it broke in an update, the last version that worked tells us where to look.
      placeholder: e.g. worked in 0.1.1166, broken since 0.1.1169
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
    validations:
      required: true

  - type: dropdown
    id: game-type
    attributes:
      label: How were you playing?
      options:
        - Single player
        - Multiplayer (client)
        - Multiplayer (host)
        - Dedicated server
    validations:
      required: false

  - type: input
    id: map
    attributes:
      label: Map
      description: The map's name; for a mod map, where it comes from (a link is best).
      placeholder: e.g. Berlin-Spandau (stock)
    validations:
      required: false

  - type: input
    id: vehicle
    attributes:
      label: Bus or vehicle
      description: The vehicle's name; for a mod or DLC, which one (a link is best).
      placeholder: e.g. MAN SD200 (stock)
    validations:
      required: false

  - type: input
    id: graphics
    attributes:
      label: Graphics
      description: For graphics, performance and crash problems - the Graphics and Graphics API settings, and your graphics card.
      placeholder: e.g. Enhanced, Vulkan, NVIDIA RTX 3060
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the relevant part of `game.log` (or `launcher.log` for launcher problems). Both are in the `.openomsi` folder in your user folder - on Windows `C:\Users\<you>\.openomsi`. This will be automatically formatted as code.
      render: shell
    validations:
      required: false
