# Builds openOMSI for Windows and Linux (x64, ARM64), macOS (Apple silicon, Intel) and Android
# (plus the dedicated server for Linux and Windows) on every push to
# main and publishes them as the release v<MAJOR.MINOR.COMMIT>; see docs/VERSIONING.md.
# Pull requests run the same builds without publishing.
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The builds (and the actions they use) only read the repository; `release` alone writes,
# with its own permission below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # a pull request's test build says which pull request it is: 0.1.1313-pr1192 (the
      # launcher shows it, and the updater leaves such a build alone)
      - id: v
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "version=$(sh scripts/version.sh)${PR:+-pr$PR}" >> "$GITHUB_OUTPUT"
      - run: echo "### openOMSI ${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # ARM64 (Snapdragon laptops): built on the x64 runner with its ARM64 tools
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Workspace regression tests
        if: matrix.arch == 'x64'
        run: cargo test --locked --workspace --no-fail-fast
      - name: Build
        shell: cmd
        run: scripts\build-windows.cmd ${{ matrix.target }}
      # Microsoft's shader compiler for DirectX 12 (dxcompiler.dll, dxil.dll beside the
      # program): without it wgpu falls back to the old FXC, which is slow and refuses
      # some of the game's shaders. DirectX 12 is the way round a Vulkan driver that fails.
      - name: DirectX shader compiler
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" -D dxc
          $zip = Get-ChildItem dxc/*.zip | Where-Object { $_.Name -notmatch "linux|pdb" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dxc/x
          $arch = if ("${{ matrix.arch }}" -eq "arm64") { "arm64" } else { "x64" }
          Copy-Item "dxc/x/bin/$arch/dxcompiler.dll", "dxc/x/bin/$arch/dxil.dll" dist/windows/
          Get-ChildItem dist/windows
      # Google's ANGLE (OpenGL ES over Direct3D 11) for the "ANGLE (DirectX 11)" graphics API:
      # libEGL.dll and libGLESv2.dll built from ANGLE's own source by
      # openOMSI-org/angle-openomsi, taken by its release tag and checked against the
      # SHA-256 recorded here (and the DLLs against the release's own SHA256SUMS). x64 only:
      # there is no ARM64 build, and the game skips the option without the DLLs.
      - name: ANGLE (DirectX 11)
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ANGLE_TAG: angle-8091-36b74e4dd4
          ANGLE_SHA256: 1c0086155a17445110dd97400018ca6e72ea245ef178989b457720ee1fba3af5
        run: |
          gh release download $env:ANGLE_TAG -R openOMSI-org/angle-openomsi --pattern "*-windows-x64.zip" -D angle
          $zip = Get-ChildItem angle/*.zip | Select-Object -First 1
          $have = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $env:ANGLE_SHA256) { throw "ANGLE zip: SHA-256 $have, expected $env:ANGLE_SHA256" }
          Expand-Archive $zip.FullName -DestinationPath angle/x
          $dir = Get-ChildItem angle/x -Directory | Select-Object -First 1
          foreach ($line in Get-Content (Join-Path $dir.FullName "SHA256SUMS")) {
            $want, $name = $line -split '\s+\*?', 2
            $got = (Get-FileHash (Join-Path $dir.FullName $name) -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $want.ToLower()) { throw "ANGLE ${name}: SHA-256 $got, expected $want" }
          }
          Copy-Item (Join-Path $dir.FullName "libEGL.dll"), (Join-Path $dir.FullName "libGLESv2.dll"), (Join-Path $dir.FullName "LICENSE-ANGLE.txt") dist/windows/
          Get-ChildItem dist/windows
      # The Visual C++ runtime beside the program (Microsoft allows it to be shipped
      # app-locally): without it a PC lacking the Redistributable refused to start the game
      # ("VCRUNTIME140_1.dll was not found"). It cannot be linked in instead - the OpenXR
      # loader is built against the DLL runtime.
      - name: Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\${{ matrix.arch }}\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          $dir = if ($crt) { $crt.FullName } elseif ("${{ matrix.arch }}" -eq "x64") { "$env:SystemRoot\System32" } else { throw "no ARM64 Visual C++ runtime in $vs" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            Copy-Item (Join-Path $dir $dll) dist/windows/
          }
          Get-ChildItem dist/windows
      - name: Package
        shell: pwsh
        run: |
          $name = "openOMSI-$env:OPENOMSI_VERSION-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item README.md, LICENSE dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "out/$name.zip"
          # the dedicated server for Windows (Server 2016 and later): the same program
          # started with --server, and start.cmd
          New-Item -ItemType Directory -Force dist/server | Out-Null
          Copy-Item dist/windows/openomsi.exe, dist/windows/vcruntime140.dll, dist/windows/vcruntime140_1.dll, dist/windows/msvcp140.dll, scripts/server/start.cmd, LICENSE dist/server/
          # (Steam's library: the x64 program does not start without it beside it)
          if (Test-Path dist/windows/steam_api64.dll) { Copy-Item dist/windows/steam_api64.dll dist/server/ }
          Copy-Item docs/SERVER.md dist/server/README.md
          New-Item -ItemType File -Force dist/server/.openomsi-content | Out-Null
          Compress-Archive -Path dist/server/* -DestinationPath "out/openOMSI-$env:OPENOMSI_VERSION-server-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          # (a release keeps its files; a pull request's test builds are fetched within days)
          retention-days: 14
          name: windows-${{ matrix.arch }}
          path: out/*.zip

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          # Intel Macs: built on the Apple silicon runner for x86_64
          - target: x86_64-apple-darwin
            arch: x64
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
      OPENOMSI_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: scripts/build-macos.sh
      - name: Package
        run: |
          mkdir -p out
          cp README.md LICENSE dist/macos/
          cd dist/macos && ditto -c -k --sequesterRsrc . "../../out/openOMSI-$OPENOMSI_VERSION-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          # (a release keeps its files; a pull request's test builds are fetched within days)
          retention-days: 14
          name: macos-${{ matrix.arch }}
          path: out/*.zip

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The x64 job builds the whole workspace's tests and then the release on one runner,
      # more than its free disk holds: full, the runner stopped answering mid-build ("lost
      # communication with the server"). The preinstalled SDKs nothing here uses make room.
      - name: Free disk space
        if: matrix.arch == 'x64'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev \
              libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev zip clang lld && break
            sleep 20
          done
      - name: Workspace regression tests
        if: matrix.arch == 'x64'
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
        run: |
          cargo test --locked --workspace --no-fail-fast
          # (the tests' debug build is not needed for the release one: its room is)
          rm -rf target/debug
          df -h /
      - name: Build the game
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
        run: scripts/build-linux.sh
      - name: Build the server
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
        run: scripts/build-server.sh
      - name: Validate shaders
        if: matrix.arch == 'x64'
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
        run: cargo test --locked --release -p omsi-render shaders_validate_and_match_the_uniforms
      - name: Package
        run: |
          mkdir -p out
          cp README.md LICENSE dist/linux/
          cp LICENSE dist/server/
          (cd dist/linux && zip -qr "../../out/openOMSI-$OPENOMSI_VERSION-linux-${{ matrix.arch }}.zip" .)
          (cd dist/server && zip -qr "../../out/openOMSI-$OPENOMSI_VERSION-server-linux-${{ matrix.arch }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          # (a release keeps its files; a pull request's test builds are fetched within days)
          retention-days: 14
          name: linux-${{ matrix.arch }}
          path: out/*.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
      # the signing key (base64 of a keystore, alias openomsi, password android); without
      # it every build is signed with a new key and does not install over the last one
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      # a pull request's APK is an app of its own beside the release (scripts/build-android.sh)
      OPENOMSI_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build
        run: scripts/build-android.sh
      - name: Package
        run: |
          mkdir -p out
          cp "dist/android/openOMSI-$OPENOMSI_VERSION.apk" "out/openOMSI-$OPENOMSI_VERSION-android-arm64.apk"
          # (and under a name of its own: releases/latest/download/openOMSI-android.apk is
          # always the newest APK - for a phone whose installed build cannot update itself)
          cp "dist/android/openOMSI-$OPENOMSI_VERSION.apk" "out/openOMSI-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          # (a release keeps its files; a pull request's test builds are fetched within days)
          retention-days: 14
          name: android
          path: out/*.apk

  release:
    if: github.event_name != 'pull_request'
    needs: [version, windows, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish v${{ needs.version.outputs.version }}
        run: |
          ls -l out
          # what changed: this version's section of CHANGELOG.md (up to the next version)
          awk -v v="## $VERSION" 'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") {f = 1; next} f && /^## / {exit} f {print}' CHANGELOG.md > changes.md
          # a release for every push: without a section of its own, what CHANGELOG.md gained
          # since the previous release (the lines added, in their order)
          if ! grep -q '[^[:space:]]' changes.md; then
            prev=$(git tag -l 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -1)
            if [ -n "$prev" ]; then
              git diff --unified=0 "$prev" HEAD -- CHANGELOG.md | grep '^+' | grep -v '^+++' | sed 's/^+//' | grep -v '^## ' > changes.md || true
            fi
          fi
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "Small changes and fixes." > changes.md
          fi
          cat > notes.md <<NOTES
          **openOMSI $VERSION**

          > **Early release, expect bugs.** openOMSI needs an original OMSI 2 installation to run; it contains no game content.

          NOTES
          cat changes.md >> notes.md
          cat >> notes.md <<NOTES

          ### Downloads

          | Platform | Download |
          | --- | --- |
          | Windows x64 | \`openOMSI-$VERSION-windows-x64.zip\` |
          | Windows ARM64 | \`openOMSI-$VERSION-windows-arm64.zip\` |
          | macOS (Apple silicon) | \`openOMSI-$VERSION-macos-arm64.zip\` |
          | macOS (Intel) | \`openOMSI-$VERSION-macos-x64.zip\` |
          | Linux x64 | \`openOMSI-$VERSION-linux-x64.zip\` |
          | Linux ARM64 | \`openOMSI-$VERSION-linux-arm64.zip\` |
          | Android (arm64, 8.0+) | \`openOMSI-$VERSION-android-arm64.apk\` |
          | Dedicated server, Linux | \`openOMSI-$VERSION-server-linux-x64.zip\`, \`openOMSI-$VERSION-server-linux-arm64.zip\` |
          | Dedicated server, Windows | \`openOMSI-$VERSION-server-windows-x64.zip\`, \`openOMSI-$VERSION-server-windows-arm64.zip\` |
          NOTES
          git tag -f "v$VERSION" "$GITHUB_SHA"
          git push -f origin "v$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # the same version built again (main was rewritten and pushed once more): the
            # release stays, with this build's files and notes
            gh release upload "v$VERSION" out/*.zip out/*.apk --clobber
            gh release edit "v$VERSION" --title "openOMSI $VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" out/*.zip out/*.apk \
              --verify-tag \
              --title "openOMSI $VERSION" \
              --notes-file notes.md
          fi
