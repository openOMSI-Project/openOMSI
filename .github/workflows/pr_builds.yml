# Comments on a pull request with a download link per platform once release.yml has built
# its test builds, and updates that one comment on every push (see docs/VERSIONING.md).
# It runs from main through workflow_run, so it can write to a pull request from a fork
# without running the fork's code. The links go through nightly.link (its GitHub app is
# installed on the repository), so downloading needs no GitHub account.
name: PR test builds

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    # (a cancelled run was replaced by a newer push, whose run comments instead)
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Comment the download links
        run: |
          # (a fork's pull request is missing from workflow_run.pull_requests: find it by its branch)
          pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD" --jq '.[0] | select(.head.sha == env.SHA) | .number')
          if [ -z "$pr" ]; then
            echo "No open pull request has $SHA at its head (closed, or pushed again since)."
            exit 0
          fi
          marker='<!-- pr-test-builds -->'
          short=$(printf '%.7s' "$SHA")
          {
            echo "$marker"
            if [ "$CONCLUSION" != success ]; then
              echo "### Test builds for $short"
              echo
              echo "The build failed, so there is nothing to test yet - see [the run]($RUN_URL)."
            else
              echo "### Test builds for $short"
              echo
              echo "| Platform | Download |"
              echo "| --- | --- |"
              for name in $(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name' | sort); do
                # (a fork's workflow names its artifacts itself: only plain names go into the
                # comment, so that none can add a link or markup of its own to it)
                case "$name" in
                  *[!A-Za-z0-9._-]*) continue ;;
                esac
                case "$name" in
                  windows-*) what="Windows ${name#windows-} (game and dedicated server)" ;;
                  linux-*) what="Linux ${name#linux-} (game and dedicated server)" ;;
                  macos-arm64) what="macOS (Apple silicon)" ;;
                  macos-x64) what="macOS (Intel)" ;;
                  android) what="Android (arm64)" ;;
                  *) what="$name" ;;
                esac
                echo "| $what | [$name.zip](https://nightly.link/$REPO/actions/runs/$RUN_ID/$name.zip) |"
              done
              echo
              echo "- Unpack the download into a **new folder**, not over your openOMSI. The launcher shows the version as \`...-pr$pr\`, and a test build is never updated. It shares your settings and OMSI 2 folder; mods you installed into your openOMSI folder are only seen when you unpack it into a copy of that folder."
              echo "- Android: the download holds an APK that installs as a separate app, *openOMSI PR #$pr*, beside the release, and shares its openOMSI folder."
              echo "- What to try is under **How to test** in the description. Please comment with what you found and the version the launcher shows."
              echo "- The links work for 14 days after the build."
            fi
          } > body.md
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
          echo "Commented the test builds of $short on #$pr."
